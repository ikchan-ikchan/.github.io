<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>骨格推定 P2P デモ</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 45%; margin: 0 2%; background: #000; }
    #controls { margin: 1em; }
    #availableComputes { margin-top: 1em; font-size: 0.9em; color: #333; }
  </style>
</head>
<body>
  <h1>骨格推定 P2P デモ</h1>
  <div id="controls">
    <label><input type="radio" name="role" value="compute"> 計算</label>
    <label><input type="radio" name="role" value="user"> ユーザー</label>
    <button id="startBtn">開始</button>
  </div>

  <p>あなたの PeerID: <span id="myId">—</span></p>

  <!-- ユーザー側のみ表示 -->
  <div id="userControls" style="display:none;">
    <p>待機中の計算側ID:</p>
    <div id="availableComputes">なし</div>
    <p>接続したい計算側のIDをクリックして選択:</p>
    <div id="computeListContainer"></div>
  </div>

  <div>
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
  </div>

  <script>
    const myIdSpan = document.getElementById('myId');
    const startBtn   = document.getElementById('startBtn');
    const userCtrls  = document.getElementById('userControls');
    const availDiv   = document.getElementById('availableComputes');
    const listCont   = document.getElementById('computeListContainer');
    const localV     = document.getElementById('localVideo');
    const remoteV    = document.getElementById('remoteVideo');

    let role, peer, localStream, pollingInterval;

    startBtn.onclick = async () => {
      // 役割取得
      role = document.querySelector('input[name=role]:checked')?.value;
      if (!role) return alert('まず「計算」か「ユーザー」を選択してください');

      // 役割に応じて UI 切り替え
      if (role === 'user') {
        userCtrls.style.display = 'block';
      }

      // PeerJS 初期化
      const peerOpts = {
        host: '0.peerjs.com', secure: true, port: 443,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      };

      if (role === 'compute') {
        // compute は固定プレフィックス付き ID で生成
        const id = 'compute-' + Math.random().toString(36).substr(2, 8);
        peer = new Peer(id, peerOpts);
      } else {
        peer = new Peer(peerOpts);
      }

      // open イベント
      peer.on('open', async id => {
        myIdSpan.textContent = id;

        if (role === 'compute') {
          // 計算側：ユーザーからの呼び出しを待つだけ
          peer.on('call', async call => {
            // 仮想カメラを探してストリームを返答
            const devices = await navigator.mediaDevices.enumerateDevices();
            const vc = devices.find(d => d.kind==='videoinput' && /VirtualCam|v4l2loopback/.test(d.label));
            if (!vc) return alert('仮想カメラが見つかりません');
            const stream = await navigator.mediaDevices.getUserMedia({ video:{ deviceId: vc.deviceId } });
            localV.srcObject = stream;
            call.answer(stream);
            call.on('stream', s => { remoteV.srcObject = s; });
          });
        } else {
          // ユーザー側：自分カメラ取得＆開始
          localStream = await navigator.mediaDevices.getUserMedia({ video: true });
          localV.srcObject = localStream;

          // 待機中の計算側をリスト表示し、クリックで接続
          startPollingComputes();
        }
      });
    };

    // 計算側ID一覧を 5秒ごとに取得・更新
    function startPollingComputes() {
      updateComputeList();
      pollingInterval = setInterval(updateComputeList, 5000);
    }

    function updateComputeList() {
      peer.listAllPeers(peers => {
        const computes = peers.filter(id => id.startsWith('compute-'));
        // 表示
        availDiv.textContent = computes.length ? computes.join(', ') : 'なし';
        // クリック可能リスト
        listCont.innerHTML = '';
        computes.forEach(id => {
          const btn = document.createElement('button');
          btn.textContent = id;
          btn.style.margin = '0 4px 4px 0';
          btn.onclick = () => connectToCompute(id);
          listCont.appendChild(btn);
        });
      });
    }

    // 選択した計算側に自分のカメラ映像を送る
    function connectToCompute(computeId) {
      if (!localStream) return;
      const call = peer.call(computeId, localStream);
      call.on('stream', s => { remoteV.srcObject = s; });
      // もうポーリングは不要
      clearInterval(pollingInterval);
    }
  </script>
</body>
</html>
