<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + Joystick 同期版</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    /* （省略：既存のスタイルはそのまま） */
    #snapshotContainer {
      margin-top: 10px;
      display: flex;
      overflow-x: auto;
      max-height: 100px;
    }
    #snapshotContainer img {
      height: 80px;
      margin-right: 4px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <!-- （省略：既存の HTML 部分はそのまま） -->
  <div id="snapshotContainer"></div>

<script>
  // 役割判定
  const params    = new URLSearchParams(location.search);
  const role      = params.get('role');
  const isCompute = role === 'compute';

  // 要素取得
  const joy            = document.getElementById('joystick');
  const knob           = document.getElementById('knob');
  const stateDiv       = document.getElementById('joystickState');
  const localVideo     = document.getElementById('localVideo');
  const remoteVideo    = document.getElementById('remoteVideo');
  const myIdSpan       = document.getElementById('myId');
  const logDiv         = document.getElementById('log');
  const userControls   = document.getElementById('userControls');
  const computeControls= document.getElementById('computeControls');
  const snapshotContainer = document.getElementById('snapshotContainer');

  let dataConn = null;
  let lastLabel = '中心';

  // PeerJS 初期化
  const peer = new Peer();
  peer.on('open', id=>{
    myIdSpan.textContent = id;
    log(`[INFO] 接続完了。自分のID: ${id}`);
  });
  peer.on('error', err=> log(`[ERROR] PeerJS: ${err}`));

  // ログ出力
  function log(msg){
    console.log(msg);
    logDiv.textContent += '\n' + msg;
  }

  // スナップショット送信
  function sendSnapshot(){
    if (!dataConn || !dataConn.open) return;
    const video = localVideo;
    const canvas = document.createElement('canvas');
    canvas.width  = video.videoWidth || video.clientWidth;
    canvas.height = video.videoHeight || video.clientHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      dataConn.send({ type: 'snapshot', image: blob });
      log('[INFO] Snapshot sent');
    }, 'image/png');
  }

  // ジョイスティック：状態更新 & スナップショット判定
  function updateState(v){
    const label = v < -0.5 ? '上' : v > 0.5 ? '下' : '中心';
    // 「上」に移行した瞬間だけスナップ
    if (!isCompute && label === '上' && lastLabel !== '上') {
      sendSnapshot();
    }
    lastLabel = label;
    stateDiv.textContent = label;
    if (!isCompute && dataConn && dataConn.open) {
      dataConn.send({ type:'joystick', value:v });
    }
  }

  // ノブを動かす計算側受信処理
  function setKnobPosition(v){
    const rect = joy.getBoundingClientRect();
    const maxY = rect.height/2 - knob.offsetHeight/2;
    const y = Math.max(-maxY, Math.min(maxY, v*maxY));
    knob.style.transition = 'transform 0.15s';
    knob.style.transform  = `translate(-50%, calc(-50% + ${y}px))`;
    updateState(v);  // 表示更新のみ
    setTimeout(()=> knob.style.transition='', 160);
  }

  // データチャネル受信（計算側）
  peer.on('connection', conn=>{
    dataConn = conn;
    conn.on('open', ()=> log('[INFO] データチャネル接続完了'));
    conn.on('data', d=>{
      if (d.type === 'joystick') {
        setKnobPosition(d.value);
      }
      else if (d.type === 'snapshot' && isCompute) {
        // Blob を受け取ってサムネイル表示
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.src = reader.result;
          snapshotContainer.appendChild(img);
          log('[INFO] Snapshot received');
        };
        reader.readAsDataURL(d.image);
      }
    });
  });

  // 以下、既存のユーザー／計算モードごとのカメラ＆通話処理はそのまま…
  //  （userControls, computeControls の切り替え、
  //   カメラ列挙／開始、callBtn onclick、peer.on('call') など）
</script>
</body>
</html>
