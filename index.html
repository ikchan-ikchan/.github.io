<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>P2P 録画ビデオ送信デモ</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    video { width: 80%; max-width: 720px; background: #000; margin: 10px auto; display: block; }
    button, input { font-size: 1rem; padding: 8px; margin: 5px; }
    #controls { margin-top: 20px; }
    #log { font-size: 0.9rem; color: #555; white-space: pre-wrap; text-align: left; max-height: 150px; overflow-y: auto; background: #f7f7f7; padding: 10px; }
  </style>
</head>
<body>
  <h1>P2P 録画ビデオ送信デモ</h1>
  <p>あなたのID: <span id="myId">―</span></p>

  <div id="senderUI" style="display:none;">
    <video id="localVideo" autoplay muted></video>
    <div id="controls">
      <button id="startRecBtn">録画開始</button>
      <button id="stopRecBtn" disabled>録画停止＆送信</button><br/>
      <input type="text" id="targetId" placeholder="受信側IDを入力" />
      <button id="connectBtn">接続</button>
    </div>
  </div>

  <div id="receiverUI" style="display:none;">
    <video id="recvVideo" controls autoplay></video>
    <div id="log">[INFO] 待機中…</div>
  </div>

<script>
  // 役割判定
  const params    = new URLSearchParams(location.search);
  const isSender  = params.get('role') === 'compute';

  // 要素
  const myIdSpan     = document.getElementById('myId');
  const senderUI     = document.getElementById('senderUI');
  const receiverUI   = document.getElementById('receiverUI');
  const localVideo   = document.getElementById('localVideo');
  const recvVideo    = document.getElementById('recvVideo');
  const logDiv       = document.getElementById('log');
  const startRecBtn  = document.getElementById('startRecBtn');
  const stopRecBtn   = document.getElementById('stopRecBtn');
  const connectBtn   = document.getElementById('connectBtn');
  const targetInput  = document.getElementById('targetId');

  // PeerJS 初期化
  const peer = new Peer();
  let conn, mediaRecorder, recordedChunks = [];

  peer.on('open', id => {
    myIdSpan.textContent = id;
    if (isSender) {
      senderUI.style.display   = 'block';
      initSender();
    } else {
      receiverUI.style.display = 'block';
      initReceiver();
    }
  });

  // ログ表示
  function log(msg) {
    if (logDiv) logDiv.textContent += `\n${msg}`;
    else console.log(msg);
  }

  // --- 送信側の初期化 ---
  function initSender() {
    // カメラ映像を事前に取得してプレビュー
    navigator.mediaDevices.getUserMedia({ video: { width:1920, height:1080 }, audio: true })
      .then(stream => {
        localVideo.srcObject = stream;
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => sendRecorded();
      })
      .catch(err => alert('カメラ取得失敗: ' + err));

    // 接続ボタン
    connectBtn.onclick = () => {
      const targetId = targetInput.value.trim();
      if (!targetId) return alert('受信側IDを入力してください');
      conn = peer.connect(targetId);
      conn.on('open', () => log('[INFO] DataChannel 接続完了'));
      conn.on('error', e => log(`[ERROR] ${e}`));
    };

    // 録画開始／停止
    startRecBtn.onclick = () => {
      if (!mediaRecorder) return alert('カメラ映像を待機中…');
      recordedChunks = [];
      mediaRecorder.start();
      startRecBtn.disabled = true;
      stopRecBtn.disabled  = false;
      log('[INFO] 録画開始');
    };
    stopRecBtn.onclick = () => {
      mediaRecorder.stop();
      startRecBtn.disabled = false;
      stopRecBtn.disabled  = true;
      log('[INFO] 録画停止 → 送信準備中');
    };

    // 録画データの送信
    function sendRecorded() {
      if (!conn || conn.open === false) return alert('先に接続してください');
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
      const fileSize = blob.size;
      const fileType = blob.type;
      const CHUNK_SIZE = 64 * 1024;

      // メタデータ送信
      conn.send({ fileSize, fileType });
      // ArrayBuffer化 → チャンク送信
      const reader = new FileReader();
      reader.onload = () => {
        const buffer = reader.result;
        let offset = 0;
        while (offset < buffer.byteLength) {
          const slice = buffer.slice(offset, offset + CHUNK_SIZE);
          conn.send(slice);
          offset += CHUNK_SIZE;
        }
        log('[INFO] 送信完了');
      };
      reader.readAsArrayBuffer(blob);
    }
  }

  // --- 受信側の初期化 ---
  function initReceiver() {
    let expectedSize = 0, receivedBuffers = [], startTime;

    peer.on('connection', c => {
      conn = c;
      log('[INFO] DataChannel 接続完了');
      conn.on('data', data => {
        if (data.fileSize && data.fileType) {
          // メタデータ受信
          expectedSize = data.fileSize;
          startTime    = performance.now();
          receivedBuffers = [];
          log(`[INFO] ファイルサイズ: ${expectedSize} bytes`);
        } else {
          // 動画チャンク受信
          receivedBuffers.push(data);
          const got = receivedBuffers.reduce((sum, b) => sum + b.byteLength, 0);
          if (got >= expectedSize) {
            // 完全受信 → Blob結合＋再生
            const blob = new Blob(receivedBuffers, { type: data.fileType || 'video/webm' });
            const url  = URL.createObjectURL(blob);
            recvVideo.src = url;
            const elapsed = ((performance.now() - startTime)/1000).toFixed(2);
            log(`[INFO] 受信完了・再生開始 (${elapsed} 秒)`);
          }
        }
      });
    });
  }

  peer.on('error', err => alert('PeerJS エラー: ' + err));
</script>
</body>
</html>
