<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>BodyPix による人物セグメンテーションデモ</title>
    <style>
      body { font-family: sans-serif; text-align: center; }
      video, canvas { display: block; margin: 10px auto; }
      #controls { margin: 10px; }
      #maxResolutionInfo, #segmentationInfo { margin-top: 5px; font-size: 0.9em; color: #555; }
    </style>
  </head>
  <body>
    <h2>BodyPix 体セグメンテーション デモ</h2>
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      &nbsp;&nbsp;
      <label for="frameRateInput">fps:</label>
      <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
      &nbsp;&nbsp;
      <label for="resPercentInput">解像度%:</label>
      <input type="number" id="resPercentInput" min="1" max="100" value="100" style="width:60px;">
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
      &nbsp;&nbsp;
      <button id="captureButton">記録</button>
      <div id="maxResolutionInfo"></div>
      <div id="segmentationInfo"></div>
    </div>

    <!-- 内部用 video と描画用 canvas -->
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <canvas id="outputCanvas"></canvas>

    <!-- ライブラリ読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>

    <script>
      const video = document.getElementById('video');
      const canvas = document.getElementById('outputCanvas');
      const ctx = canvas.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const resPercentInput = document.getElementById('resPercentInput');
      const startButton = document.getElementById('startButton');
      const captureButton = document.getElementById('captureButton');
      const maxResolutionInfo = document.getElementById('maxResolutionInfo');
      const segmentationInfo = document.getElementById('segmentationInfo');

      let bodyPixModel = null;
      let processingLoopId = null;

      // カメラ列挙
      async function enumerateCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        devices.filter(d => d.kind === 'videoinput')
               .forEach((d,i) => {
                 cameraSelect.innerHTML += 
                   `<option value="${d.deviceId}">${d.label||'カメラ '+(i+1)}</option>`;
               });
      }

      // カメラ開始
      async function startCamera() {
        // まず最低制約で取得して capabilities 調査
        const deviceId = cameraSelect.value;
        let temp = await navigator.mediaDevices.getUserMedia({ video:{ deviceId } });
        const track = temp.getVideoTracks()[0];
        const caps = track.getCapabilities();
        const maxW = caps.width?.max||640, maxH = caps.height?.max||480;
        maxResolutionInfo.innerText = `最大解像度: ${maxW}×${maxH}`;
        temp.getTracks().forEach(t=>t.stop());

        // ユーザー指定 %
        const p = parseInt(resPercentInput.value)||100;
        const w = Math.floor(maxW*p/100), h = Math.floor(maxH*p/100);
        const fps = parseInt(frameRateInput.value)||15;

        const stream = await navigator.mediaDevices.getUserMedia({
          video:{ deviceId, width:{exact:w}, height:{exact:h}, frameRate:{ideal:fps} }
        });
        video.srcObject = stream;
        await new Promise(r=>video.onloadedmetadata=r);
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      // ループ表示（リアルタイムプレビュー）
      function processLoop() {
        ctx.drawImage(video, 0,0, canvas.width, canvas.height);
        processingLoopId = requestAnimationFrame(processLoop);
      }

      // 記録時のセグメンテーション
      async function captureSegmentation() {
        cancelAnimationFrame(processingLoopId);
        if (!bodyPixModel) {
          segmentationInfo.innerText = 'モデル読み込み中…';
          bodyPixModel = await bodyPix.load();
          segmentationInfo.innerText = '';
        }
        // セグメント実行
        const segmentation = await bodyPixModel.segmentPerson(video, {
          internalResolution: 'medium',
          segmentationThreshold: 0.7
        });
        // マスク生成＆描画
        const mask = bodyPix.toMask(
          segmentation,
          {r:0, g:0, b:0, a:0},
          {r:128, g:128, b:128, a:128}
        );
        ctx.putImageData(mask, 0,0);
        segmentationInfo.innerText = '記録完了：灰色でマスク表示';
      }

      // イベントバインド
      startButton.onclick = async () => {
        await startCamera();
        processLoop();
      };
      captureButton.onclick = captureSegmentation;

      enumerateCameras();
    </script>
  </body>
</html>
