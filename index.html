<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Pose検出デモ（修正版）</title>
  <style>
    /* 余白を削除し、全画面表示 */
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    /* videoとcanvasは同位置に配置し、canvasを上に表示 */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    canvas {
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- カメラ映像用 -->
  <video id="video" autoplay playsinline></video>
  <!-- 推定結果描画用 -->
  <canvas id="overlay"></canvas>

  <!-- TensorFlow.jsとPoseNetライブラリの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.14.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    // カメラセットアップ：getUserMediaでカメラ映像を取得
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            // videoのサイズに合わせてcanvasのサイズを設定
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            console.log("videoサイズ:", video.videoWidth, video.videoHeight);
            resolve();
          };
        });
      } catch (e) {
        console.error("カメラの初期化に失敗しました：", e);
      }
    }

    // PoseNetモデルのロード
    async function loadPoseNet() {
      try {
        const net = await posenet.load();
        console.log("PoseNetモデルがロードされました");
        return net;
      } catch (e) {
        console.error("PoseNetのロードに失敗しました：", e);
      }
    }

    // 1フレームごとにPose推定を実施
    async function detectPose(net) {
      try {
        const pose = await net.estimateSinglePose(video, {
          flipHorizontal: true, // カメラの鏡像に合わせる場合 true
          decodingMethod: 'single-person'
        });
        console.log("推定結果:", pose);
        return pose;
      } catch (e) {
        console.error("姿勢推定中にエラー：", e);
      }
    }

    // 推定結果をキャンバスに描画する処理
    function drawPose(pose) {
      // キャンバスをクリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // キーポイントを描画（閾値を0.3に変更）
      pose.keypoints.forEach(key => {
        if (key.score > 0.3) {
          ctx.beginPath();
          ctx.arc(key.position.x, key.position.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = "red";
          ctx.fill();
        }
      });

      // 隣接するキーポイント同士を線で結んでボーンを描画
      const adjacentKeyPoints = posenet.getAdjacentKeyPoints(pose.keypoints, 0.3);
      adjacentKeyPoints.forEach(pair => {
        ctx.beginPath();
        ctx.moveTo(pair[0].position.x, pair[0].position.y);
        ctx.lineTo(pair[1].position.x, pair[1].position.y);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "blue";
        ctx.stroke();
      });
    }

    // メインのループ処理
    async function main() {
      await setupCamera();
      const net = await loadPoseNet();

      async function poseLoop() {
        const pose = await detectPose(net);
        if (pose) {
          drawPose(pose);
        }
        requestAnimationFrame(poseLoop);
      }
      poseLoop();
    }

    main();
  </script>
</body>
</html>
