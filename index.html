<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MediaPipe Pose: 動画ファイルを使ったポイント描画デモ</title>
    <style>
      body { font-family: sans-serif; text-align: center; }
      #controls { margin: 10px; }
      video, canvas { display: block; margin: 10px auto; }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: 動画ファイルを使ったポイント描画デモ</h2>
    <div id="controls">
      <input type="file" id="videoFileInput" accept="video/*">
    </div>
    <!-- 非表示の video 要素で動画を再生 -->
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <!-- 描画用キャンバス -->
    <canvas id="outputCanvas"></canvas>

    <!-- MediaPipe Pose と Drawing Utils の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script>
      const videoFileInput = document.getElementById('videoFileInput');
      const video = document.getElementById('video');
      const canvas = document.getElementById('outputCanvas');
      const ctx = canvas.getContext('2d');
      
      // MediaPipe Pose の初期化
      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      pose.onResults(onResults);

      // 検出結果を Canvas に描画
      function onResults(results) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
        if (results.poseLandmarks) {
          // ランドマーク（点）のみ描画
          drawLandmarks(ctx, results.poseLandmarks, {color: 'red', radius: 5});
        }
      }

      // 動画ファイル選択時の処理
      videoFileInput.addEventListener('change', () => {
        const file = videoFileInput.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        video.src = url;
        video.style.display = 'none';
        video.onloadedmetadata = () => {
          // Canvas を動画サイズに合わせる
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          video.play();
          startProcessing();
        };
      });

      // 動画フレームを MediaPipe Pose に送るループ
      function startProcessing() {
        async function process() {
          await pose.send({image: video});
          if (!video.ended) {
            requestAnimationFrame(process);
          }
        }
        requestAnimationFrame(process);
      }
    </script>
  </body>
</html>
