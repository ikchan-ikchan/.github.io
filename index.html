<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OpenPose on OpenCV.js (DNN) – full demo</title>
<style>
 /* ---- identical styling to the previous version ---- */
 body{font-family:sans-serif;text-align:center}
 video,canvas{display:block;margin:10px auto}
 #controls{margin:10px}
 #maxResolutionInfo,#poseCoordinates{margin-top:5px;font-size:.9em;color:#555}
 table{margin:auto;border-collapse:collapse}
 table,th,td{border:1px solid #aaa;padding:4px}
 #threeContainer{margin:10px auto;width:640px;height:300px;border:1px solid #ccc}
</style>
</head>
<body>
<h2>OpenPose on OpenCV.js + 3‑D viewer (rotatable)</h2>

<div id="controls">
  <label>カメラ:</label><select id="cameraSelect"></select>
  &nbsp;<label>FPS:</label><input id="frameRate" type="number" min="1" value="15" style="width:60px">
  &nbsp;<label>解像度 %:</label><input id="resPercent" type="number" min="1" max="100" value="100" style="width:60px">
  &nbsp;<button id="startBtn">開始</button>
  &nbsp;<button id="captureBtn">記録</button>
  <div id="maxResolutionInfo"></div>
</div>

<!-- video feed & 2‑D overlay -->
<video id="video" playsinline autoplay muted style="display:none"></video>
<canvas id="outputCanvas"></canvas>

<!-- coordinates table & three‑js -->
<div id="poseCoordinates"></div>
<div id="threeContainer"></div>

<!-- ▸▸ Libraries ------------------------------------------------------------------------- -->
<script async src="https://docs.opencv.org/4.x/opencv.js"
        onload="onOpenCvReady()"></script>     <!-- build WITH DNN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- ------------------------------------------------------------------------------------- -->

<script>
/* =============== 0. DOM short‑cuts =============== */
const camSel  = q('#cameraSelect'),   fpsInp = q('#frameRate'),
      resInp  = q('#resPercent'),     startB = q('#startBtn'),
      capB    = q('#captureBtn'),     maxInfo= q('#maxResolutionInfo'),
      vtag    = q('#video'),          canvas = q('#outputCanvas'),
      ctx     = canvas.getContext('2d'),
      coordDiv= q('#poseCoordinates'),threeDiv=q('#threeContainer');
let latest   = null, loopId = null, net = null;

/* -------------- helpers ---------------- */
function q(sel){return document.querySelector(sel)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

/* =============== 1. camera enumeration =============== */
async function listCams(){
  const devs=await navigator.mediaDevices.enumerateDevices();
  camSel.innerHTML='';
  devs.filter(d=>d.kind==='videoinput').forEach((d,i)=>{
    const o=document.createElement('option');
    o.value=d.deviceId;o.text=d.label||`camera ${i+1}`;
    camSel.appendChild(o);
  });
}

/* =============== 2. OpenCV load & network init =============== */
async function onOpenCvReady(){
  // 2‑1 download caffemodel → OpenCV FS
  console.log('OpenCV.js ready – downloading weights …');
  const wUrl='https://www.dropbox.com/s/2h2bv29a130sgrk/pose_iter_440000.caffemodel?dl=1';
  const wResp=await fetch(wUrl); const wBuf=await wResp.arrayBuffer();
  const wData=new Uint8Array(wBuf);
  cv.FS_createDataFile('/', 'pose.caffemodel', wData, true, false, false);
  console.log('weights stored in FS');

  // 2‑2 load prototxt (raw GitHub Pages). **PUT YOUR OWN URL HERE**
  const protoURL='openpose_pose_coco.prototxt';            // same folder
  const pResp=await fetch(protoURL); const pTxt=await pResp.text();
  cv.FS_createDataFile('/', 'pose.prototxt',
                       new TextEncoder().encode(pTxt), true,false,false);
  console.log('prototxt stored in FS');

  // 2‑3 create net
  net=cv.readNetFromCaffe('pose.prototxt','pose.caffemodel');
  console.log('OpenPose network ready');
  await listCams();
}

/* =============== 3. start camera & loop =============== */
startB.onclick = async ()=>{
  if(!net){alert('OpenCV (DNN) not ready yet');return;}
  await startCamera();
  runLoop();
};

async function startCamera(){
  if(vtag.srcObject){ vtag.srcObject.getTracks().forEach(t=>t.stop())}
  /* determine max res */
  const tmp=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:camSel.value}}});
  const trk=tmp.getVideoTracks()[0],cap=trk.getCapabilities();
  const maxW=cap.width?.max||640, maxH=cap.height?.max||480;
  tmp.getTracks().forEach(t=>t.stop());
  maxInfo.textContent=`最大解像度: ${maxW}×${maxH}`;

  const scale=(parseInt(resInp.value)||100)/100;
  const wantW=Math.floor(maxW*scale), wantH=Math.floor(maxH*scale);
  const fps=parseInt(fpsInp.value)||15;

  const stream=await navigator.mediaDevices.getUserMedia({
      video:{deviceId:{exact:camSel.value},
             width:{exact:wantW},height:{exact:wantH},
             frameRate:{ideal:fps}}});
  vtag.srcObject=stream;
  await new Promise(r=>vtag.onloadedmetadata=r);
  canvas.width=vtag.videoWidth; canvas.height=vtag.videoHeight;
}

/* =============== 4. main processing loop =============== */
function runLoop(){
  const fps=parseInt(fpsInp.value)||15, intv=1000/fps;
  const blobSize=new cv.Size(368,368);
  async function step(){
    if(vtag.paused||vtag.ended) return;
    ctx.drawImage(vtag,0,0,canvas.width,canvas.height);
    const src=cv.imread(canvas);
    const blob=cv.blobFromImage(src,1/255,blobSize,new cv.Scalar(0,0,0),
                                false,false);
    net.setInput(blob);
    const out=net.forward();            // [1,57,46,46] (COCO 18 pts + BG)
    latest = extractKeypoints(out, canvas.width, canvas.height);
    draw2d(latest);
    src.delete(); blob.delete(); out.delete();
    loopId=setTimeout(step,intv);
  }
  step();
}

/* -------------- 4‑a extract keypoints -------------- */
function extractKeypoints(out, W,H){
  const nPts=18, outH=out.size(2), outW=out.size(3);
  const points=[];
  for(let n=0;n<nPts;n++){
    let maxVal=-1, maxX=0, maxY=0;
    for(let y=0;y<outH;y++){
      for(let x=0;x<outW;x++){
        const val=out.floatAt(0,n,y,x);
        if(val>maxVal){maxVal=val;maxX=x;maxY=y;}
      }
    }
    if(maxVal>0.1){
      points.push({x:maxX/outW*W, y:maxY/outH*H, z:-maxVal*100});
    }else points.push(null);
  }
  return points;
}

/* -------------- 4‑b draw 2‑D overlay -------------- */
function draw2d(pts){
  ctx.strokeStyle='lime';ctx.lineWidth=2;
  const pairs=[[1,2],[1,5],[2,3],[3,4],[5,6],[6,7],[1,8],[8,9],[9,10],
               [1,11],[11,12],[12,13]];
  pairs.forEach(([a,b])=>{
    if(pts[a]&&pts[b]){
      ctx.beginPath();ctx.moveTo(pts[a].x,pts[a].y);
      ctx.lineTo(pts[b].x,pts[b].y);ctx.stroke();
    }
  });
  ctx.fillStyle='red';
  pts.forEach(p=>{if(p){ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill();}});
}

/* =============== 5. record – table & three.js =============== */
capB.onclick = ()=>{
  clearTimeout(loopId);
  if(!latest){alert('まだポーズが検出できていません');return;}
  showTable(latest);
  draw3d(latest);
};

function showTable(pts){
  let html='<h3>座標</h3><table><tr><th>#</th><th>x</th><th>y</th><th>z</th></tr>';
  pts.forEach((p,i)=>{if(p)
    html+=`<tr><td>${i}</td><td>${p.x.toFixed(1)}</td><td>${p.y.toFixed(1)}</td><td>${p.z.toFixed(1)}</td></tr>`});
  coordDiv.innerHTML=html+'</table>';
}

/* -------------- Three.js -------------- */
function draw3d(pts){
  threeDiv.innerHTML='';
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(75,threeDiv.clientWidth/threeDiv.clientHeight,0.1,1000);
  const ren=new THREE.WebGLRenderer({antialias:true});
  ren.setSize(threeDiv.clientWidth,threeDiv.clientHeight);
  threeDiv.appendChild(ren.domElement);
  const ctl=new THREE.OrbitControls(cam, ren.domElement);
  ctl.enableDamping=true;ctl.dampingFactor=0.1;

  scene.add(new THREE.AmbientLight(0xffffff,0.8));

  /* grey ground */
  const g=new THREE.PlaneGeometry(400,400);
  const m=new THREE.MeshLambertMaterial({color:0x808080});
  const ground=new THREE.Mesh(g,m); ground.rotation.x=-Math.PI/2; ground.position.y=-50;
  scene.add(ground);

  const geom=new THREE.SphereGeometry(2,16,16),
        mat =new THREE.MeshBasicMaterial({color:0xff0000});
  pts.forEach(p=>{
    if(p){
      const s=new THREE.Mesh(geom,mat);
      s.position.set((p.x-canvas.width/2), -(p.y-canvas.height/2), p.z);
      scene.add(s);
    }
  });

  cam.position.set(0,0,200);
  (function animate(){requestAnimationFrame(animate);ctl.update();ren.render(scene,cam);})();
}

/* =============== bootstrap =============== */
listCams();
</script>
</body>
</html>
