<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + Joystick ワンショット送信版</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family:sans-serif; text-align:center; margin:0; padding:0; }
    #mediaArea { display:grid; grid-gap:10px; padding:10px; }
    #localVideo,#remoteVideo { width:100%; height:auto; background:#000; }
    /* ジョイスティック */
    #joystick { box-sizing:border-box; width:60px; height:240px;
      margin:auto; position:relative; border:4px solid #000;
      border-radius:30px; background:#fff;
      touch-action:none; overscroll-behavior:contain;
    }
    #knob { position:absolute; left:50%; top:50%; width:40px; height:40px;
      border-radius:50%; background:#000;
      transform:translate(-50%,-50%);
      transition:transform .15s; pointer-events:none;
    }
    #joystickState { font-weight:bold; margin-top:4px; }
    /* Portrait */
    @media (orientation: portrait) {
      #mediaArea {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "localVideo joystick"
          "remoteVideo joystick";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick    { grid-area: joystick; }
    }
    /* Landscape */
    @media (orientation: landscape) {
      #mediaArea {
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "localVideo joystick remoteVideo";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick    { grid-area: joystick; }
    }
    /* コントロール */
    #controls { padding:10px; }
    #controls select,#controls input,#controls button { margin:4px; }
    #log {
      white-space:pre-wrap; background:#f7f7f7; padding:8px;
      margin:8px; text-align:left; height:120px; overflow-y:auto;
      font-size:.9em;
    }
    /* hidden canvas */
    #captureCanvas { display:none; }
  </style>
</head>
<body>
  <h1>WebRTC P2P + Joystick ワンショット送信</h1>

  <!-- メディア＋ジョイスティック領域 -->
  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>

  <hr/>

  <!-- 通信コントロール -->
  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>
    <div id="userControls">
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button><br/>
      <!-- 送信はジョイスティック操作で自動呼び出し -->
      <input type="text" id="computeId" placeholder="計算側IDを入力" /><br/>
    </div>
    <div id="computeControls" style="display:none;">
      <p>計算モード：Unity Video Capture 自動選択待機中</p>
    </div>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

  <!-- ワンショット用 hidden canvas -->
  <canvas id="captureCanvas"></canvas>

<script>
(function(){
  // --- 要素取得 ---
  const params    = new URLSearchParams(location.search);
  const role      = params.get('role');
  const isCompute = role === 'compute';

  const localV      = document.getElementById('localVideo');
  const remoteV     = document.getElementById('remoteVideo');
  const myIdSpan    = document.getElementById('myId');
  const logDiv      = document.getElementById('log');
  const userCtrls   = document.getElementById('userControls');
  const computeCtrls= document.getElementById('computeControls');
  const videoSel    = document.getElementById('videoSource');
  const startBtn    = document.getElementById('startCamera');
  const computeIdIn = document.getElementById('computeId');
  const joystick    = document.getElementById('joystick');
  const knob        = document.getElementById('knob');
  const stateDiv    = document.getElementById('joystickState');
  const canvas      = document.getElementById('captureCanvas');
  const ctx         = canvas.getContext('2d');

  let localStream, peer;

  // --- ログ関数 ---
  function log(msg){
    console.log(msg);
    logDiv.textContent += "\n" + msg;
  }

  // --- PeerJS 初期化 ---
  peer = new Peer();
  peer.on('open', id=>{
    myIdSpan.textContent = id;
    log(`[INFO] 自分のID: ${id}`);
  });
  peer.on('error', err=>{
    log(`[ERROR] PeerJS: ${err}`);
  });

  if(isCompute){
    // ===== 計算モード =====
    userCtrls.style.display = 'none';
    computeCtrls.style.display = 'block';
    log("[INFO] 計算モード：Unity Video Capture 自動取得");

    navigator.mediaDevices.enumerateDevices()
    .then(devs=>{
      const cam = devs.find(d=> d.kind==='videoinput'
                        && d.label.includes('Unity Video Capture'));
      if(!cam) throw new Error("Unity Video Capture 未検出");
      log(`[INFO] 仮想カメラ取得: ${cam.label}`);
      return navigator.mediaDevices.getUserMedia({
        video:{ deviceId:{ exact:cam.deviceId }}, audio:false
      });
    })
    .then(stream=>{
      localV.srcObject = stream;
      log("[INFO] 仮想カメラ映像を取得");
      // 着信に対して仮想カメラ映像を返す
      peer.on('call', call=>{
        log("[INFO] 着信→映像返送");
        call.answer(stream);
      });
    })
    .catch(err=>{
      log(`[ERROR] 仮想カメラ失敗: ${err.message}`);
      peer.on('call', call=>{ call.answer(null); });
    });

    return; // 計算モードここまで
  }

  // ===== ユーザーモード =====
  log("[INFO] ユーザーモード：カメラ選択→ジョイスティックで送信");

  // カメラ一覧
  navigator.mediaDevices.enumerateDevices()
  .then(devs=>{
    videoSel.innerHTML = '';
    devs.filter(d=>d.kind==='videoinput')
      .forEach(d=>{
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.text  = d.label || d.deviceId;
        videoSel.appendChild(o);
      });
    if(!videoSel.options.length) log("[WARN] カメラなし");
  });

  // カメラ開始
  startBtn.onclick = ()=>{
    const id = videoSel.value;
    navigator.mediaDevices.getUserMedia({
      video:{ deviceId:{ exact:id }}, audio:false
    })
    .then(s=>{
      localStream = s;
      localV.srcObject = s;
      log(`[INFO] カメラ開始: ${s.getVideoTracks()[0].label}`);
      // canvasサイズ同期
      canvas.width  = localV.clientWidth;
      canvas.height = localV.clientHeight;
    })
    .catch(err=> log(`[ERROR] カメラ取得失敗: ${err.message}`));
  };

  // --- ジョイスティック制御 (3段階) ---
  let dragging=false, rect, maxY, lastState='中心';
  function updateState(v){
    const s = v<-0.5? '上': v>0.5? '下': '中心';
    stateDiv.textContent = s;
    if(s==='上' && lastState!=='上'){
      sendOneShot();
    }
    lastState = s;
  }
  function moveKnob(cy){
    let y = cy - (rect.top + rect.height/2);
    y = Math.max(-maxY, Math.min(maxY, y));
    knob.style.transform = `translate(-50%,calc(-50%+${y}px))`;
    updateState(y/maxY);
  }
  function centerKnob(){
    knob.style.transition='transform .15s';
    knob.style.transform='translate(-50%,-50%)';
    updateState(0);
    setTimeout(()=>knob.style.transition='',160);
  }
  joystick.addEventListener('pointerdown', e=>{
    e.preventDefault();
    dragging = true;
    rect     = joystick.getBoundingClientRect();
    maxY     = rect.height/2 - knob.offsetHeight/2;
    moveKnob(e.clientY);
    joystick.setPointerCapture(e.pointerId);
  },{passive:false});
  joystick.addEventListener('pointermove', e=>{
    e.preventDefault();
    if(dragging) moveKnob(e.clientY);
  },{passive:false});
  joystick.addEventListener('pointerup', e=>{
    e.preventDefault();
    dragging=false;
    centerKnob();
  },{passive:false});

  // --- ワンショット送信処理 ---
  function sendOneShot(){
    if(!localStream) return log("[WARN] カメラ未開始");
    const target = computeIdIn.value.trim();
    if(!target)    return log("[ERROR] 計算側IDを入力");
    // canvasに現在フレームを描画
    ctx.drawImage(localV,0,0,canvas.width,canvas.height);
    const oneStream = canvas.captureStream(1); // 1fps
    log("[INFO] ワンショット送信開始");
    const call = peer.call(target, oneStream);
    call.on('stream', s=>{
      remoteV.srcObject = s;
      log("[INFO] 処理済み映像を受信");
    });
    call.on('close', ()=> {
      log("[INFO] 通話切断");
      // 停止トラック
      oneStream.getTracks().forEach(t=>t.stop());
      remoteV.srcObject = null;
    });
    // 500ms後に hangup
    setTimeout(()=>{ call.close(); }, 500);
  }

  // --- 着信応答 (ユーザー側が使わない想定) ---
  peer.on('call', call=>{
    log("[INFO] 着信応答 (ユーザ) なし");
    call.answer(null);
  });

})();
</script>
</body>
</html>
