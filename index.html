<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Classroom Canvas (Supabase 無料・内蔵ビューア活用・二層キャンバス)</title>
<style>
  :root{--bg:#0b0c10;--panel:#12151b;--ink:#e8ecf1;--muted:#9aa4b2}
  html,body{height:100%}
  body{margin:0;background:#0b0c10;color:var(--ink);font-family:system-ui,Segoe UI,Inter,Roboto,Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .card{background:var(--panel);border:1px solid #ffffff17;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stack{display:flex;flex-direction:column;gap:8px}
  button,input{background:#161a22;color:var(--ink);border:1px solid #ffffff26;border-radius:10px;padding:8px 10px}
  button{cursor:pointer}
  button.primary{background:linear-gradient(180deg,#1f6feb,#3168ff);border-color:#2b5cff}
  .hidden{display:none}
  .badge{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:999px;border:1px solid #ffffff26;margin-left:6px;font-size:12px}
  .muted{color:var(--muted);font-size:12px}

  .canvasWrap{position:relative;width:100%;max-width:920px;aspect-ratio:16/9;border-radius:12px;border:1px solid #00000022;background:#fff;overflow:hidden}
  .layer{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
  iframe.layer{border:0;pointer-events:none;background:#fff}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <h2>クラス用キャンバス（Supabase 無料）
    <span id="badge" class="badge">init…</span>
    <span id="roomPill" class="badge">room: -</span>
  </h2>

  <div class="card" id="roleCard">
    <div class="stack">
      <div class="row">
        <button id="asTeacher" class="primary">先生</button>
        <button id="asStudent">生徒</button>
        <span class="badge muted">バケット: <code>rooms</code>（Public）</span>
      </div>
      <div class="muted">※ Storage バケット <code>rooms</code> を作成し、SQLで select/insert/update ポリシーを追加してください。</div>
    </div>
  </div>

  <div class="card hidden" id="teacherCard">
    <div class="stack">
      <div class="row">
        <label>部屋名</label>
        <input id="roomName" placeholder="ex) class-2A-math"/>
        <button id="startRoom" class="primary">部屋を立ち上げ</button>
      </div>
      <div class="row">
        <input type="file" id="baseFile" accept=".pdf,.doc,.docx,.ppt,.pptx,image/*"/>
        <span class="muted">PDF/Word/PowerPoint はブラウザ/Officeのビューアをそのまま埋め込み。画像は従来通り。</span>
      </div>
      <div class="canvasWrap" id="tWrap">
        <iframe class="layer" id="tFrame" title="document-view"></iframe>
        <canvas class="layer" id="tDraw"></canvas>
      </div>
      <div class="row">
        <button id="penBtn">ペン</button>
        <button id="eraserBtn">消しゴム</button>
        <label>太さ <input id="sizeRange" type="range" min="1" max="24" value="5"/></label>
        <label>滑らかさ <input id="smoothRange" type="range" min="0" max="0.9" step="0.05" value="0.5"/></label>
        <span class="muted">色:</span>
        <button data-color="#111">●</button>
        <button data-color="#e53935">●</button>
        <button data-color="#1e88e5">●</button>
        <button data-color="#43a047">●</button>
      </div>
    </div>
  </div>

  <div class="card hidden" id="studentCard">
    <div class="stack">
      <div class="row">
        <label>部屋名</label>
        <input id="joinName" placeholder="先生からの部屋名"/>
        <button id="joinRoom" class="primary">入室</button>
      </div>
      <div class="canvasWrap" id="sWrap">
        <iframe class="layer" id="sFrame" title="document-view"></iframe>
        <canvas class="layer" id="sDraw"></canvas>
      </div>
      <div class="muted">PDF/Officeは内蔵ビューアでそのまま表示。注釈は上のキャンバスに重ね描き。</div>
    </div>
  </div>
</div>

<script>
/************ 1) Supabase 接続（必ず置換） ************/
const SUPABASE_URL = "https://gskmzbuomlwzdrbaazaj.supabase.co"; // ← あなたのURL
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdza216YnVvbWx3emRyYmFhemFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwOTY0NDAsImV4cCI6MjA3NjY3MjQ0MH0.fvL6qrnPAavf5l9QjjUx-GBPsz3xjxHyBeY1YYXZlBo";                    // ← あなたのanon key
const BUCKET = 'rooms';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const badge = document.getElementById('badge');
badge.textContent = 'connected';

/************ 2) DOM / State ************/
let role=null, room=null, roomSlug=null, channel=null;
let tool='pen', baseSize=5, smoothK=0.5, penColor='#111';
let drawing=false, stroke=[];
// layers
const tFrame=document.getElementById('tFrame');
const tDraw=document.getElementById('tDraw');
const sFrame=document.getElementById('sFrame');
const sDraw=document.getElementById('sDraw');
const tdc=tDraw.getContext('2d');
const sdc=sDraw.getContext('2d');
const roomPill=document.getElementById('roomPill');

/************ 3) HiDPI & リサイズ（座標ずれ防止） ************/
function fitCanvasToBox(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width*dpr));
  canvas.height= Math.max(1, Math.round(rect.height*dpr));
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function attachResize(){
  const resizeAll = ()=>{ [tDraw,sDraw].forEach(c=>c && fitCanvasToBox(c)); };
  new ResizeObserver(resizeAll).observe(document.getElementById('tWrap'));
  new ResizeObserver(resizeAll).observe(document.getElementById('sWrap'));
  window.addEventListener('resize', resizeAll, {passive:true});
}
attachResize();
setTimeout(()=>{ [tDraw,sDraw].forEach(c=>c && fitCanvasToBox(c)); },0);

/************ 4) サニタイズ（S3安全キー） ************/
function slugRoom(name){
  return String(name||'')
    .normalize('NFKC').replace(/[\s/\\]+/g,'-')
    .replace(/[^\p{L}\p{N}_.-]+/gu,'-')
    .replace(/-+/g,'-').replace(/^-|-$/g,'')
    .toLowerCase() || 'room';
}
function safeFileName(name){
  const nk = String(name||'').normalize('NFKC');
  const idx = nk.lastIndexOf('.');
  let base = (idx>0? nk.slice(0,idx):nk).replace(/\s+/g,'-').replace(/[\\/#?\[\]*<>:"|%]+/g,'-').replace(/[^\p{L}\p{N}_.-]+/gu,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  let ext = (idx>0? nk.slice(idx).toLowerCase():'').replace(/\s+/g,'');
  if(!/^\.[a-z0-9]{1,8}$/.test(ext)) ext='';
  if(!base) base='file';
  return base+ext;
}

/************ 5) 役割UI ************/
document.getElementById('asTeacher').onclick=()=>{role='teacher';toggleCards();};
document.getElementById('asStudent').onclick=()=>{role='student';toggleCards();};
function toggleCards(){
  document.getElementById('roleCard').classList.add('hidden');
  document.getElementById(role==='teacher'?'teacherCard':'studentCard').classList.remove('hidden');
  setTimeout(()=>{ [tDraw,sDraw].forEach(c=>c && fitCanvasToBox(c)); },0);
}

/************ 6) Realtime ************/
async function joinChannel(r){
  if(channel) await channel.unsubscribe();
  channel = sb.channel('room:'+r,{config:{broadcast:{ack:true}}});
  await channel.subscribe();
}

/************ 7) 先生：部屋＆ファイル ************/
document.getElementById('startRoom').onclick = async ()=>{
  const name = document.getElementById('roomName').value.trim();
  if(!name) return alert('部屋名を入力');
  room = name; roomSlug = slugRoom(room);
  roomPill.textContent='room: '+roomSlug;
  await joinChannel(roomSlug);
};

document.getElementById('baseFile').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return; if(!roomSlug) return alert('先に部屋を立ち上げ');
  const safeName = safeFileName(file.name);
  const filePath = `${roomSlug}/${Date.now()}-${safeName}`;
  try{
    const up = await sb.storage.from(BUCKET).upload(filePath, file, { upsert:false, cacheControl:'3600', contentType: file.type || '' });
    if(up.error){ alert('Upload error: '+up.error.message); return; }
    const pubUrl = sb.storage.from(BUCKET).getPublicUrl(filePath).data.publicUrl;

    // 拡張子でビューアを切替
    const lower = safeName.toLowerCase();
    if(lower.endsWith('.pdf')){
      tFrame.src = pubUrl + '#toolbar=0&view=FitH&zoom=page-width';
    } else if(/\.(doc|docx|ppt|pptx)$/.test(lower)){
      tFrame.src = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(pubUrl);
    } else {
      // 画像なら <iframe> ではなく直接重ねて表示（背景にIMGを入れたい場合はここで実装可能）
      tFrame.src = 'about:blank';
      const img = new Image(); img.onload=()=>{ const ctx=tdc; ctx.clearRect(0,0,tDraw.width,tDraw.height); ctx.drawImage(img, 0, 0, tDraw.width, tDraw.height); }; img.src=pubUrl;
    }

    // 描画レイヤはクリア（ベースには触らない）
    tdc.clearRect(0,0,tDraw.width,tDraw.height);

    await channel.send({ type:'broadcast', event:'base', payload:{ url: pubUrl, name: safeName } });
  }catch(err){ console.error(err); alert('Failed to fetch: URL/KEY/HTTP配信を確認'); }
};

/************ 8) ペン/消しゴム（描画層のみを編集） ************/
function lerp(a,b,t){ return a + (b-a)*t; }
function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }
function fitCanvas(canvas){ const dpr=window.devicePixelRatio||1; const r=canvas.getBoundingClientRect(); canvas.width=Math.max(1,Math.round(r.width*dpr)); canvas.height=Math.max(1,Math.round(r.height*dpr)); const c=canvas.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); }
function ptFromEvt(e, canvas){ const r=canvas.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return {x:x*dpr, y:y*dpr, t:performance.now(), p:(e.pressure>0?e.pressure:0.7)}; }
function drawSmooth(ctx, pts, color, size){ if(pts.length<2){ const p=pts[0]; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p.x,p.y,size/2,0,Math.PI*2); ctx.fill(); return; } ctx.save(); ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2; const cp1x=p1.x+(p2.x-p0.x)/6, cp1y=p1.y+(p2.y-p0.y)/6; const cp2x=p2.x-(p3.x-p1.x)/6, cp2y=p2.y-(p3.y-p1.y)/6; if(i===0) ctx.moveTo(p1.x,p1.y); const sp=Math.max(0.001,(p2.t-p1.t)); const v=dist(p1,p2)/sp; const w1=Math.max(1,size*(1/(1+v*0.6))*(p1.p||1)); const w2=Math.max(1,size*(1/(1+v*0.6))*(p2.p||1)); ctx.lineWidth=(w1+w2)/2; ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y);} ctx.stroke(); ctx.restore(); }
function eraseStroke(ctx, from, to, radius){ ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='rgba(0,0,0,1)'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=radius*2; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y); ctx.stroke(); ctx.restore(); }

function bindDraw(canvas, ctx, isTeacher){
  let last=null; let buf=[]; let raf=null; fitCanvas(canvas);
  const flush = ()=>{ if(!channel||!isTeacher||buf.length===0) return; const batch=buf; buf=[]; channel.send({type:'broadcast',event:'draw',payload:{pts:batch}}); };
  const start = (e)=>{ if(!roomSlug) return; drawing=true; stroke=[]; last=null; handle(e); e.preventDefault(); };
  const move  = (e)=>{ if(!drawing) return; handle(e); e.preventDefault(); };
  const end   = ()=>{ drawing=false; flush(); };
  function handle(e){ const pt=ptFromEvt(e, canvas); if(last){ const d=dist(last,pt); const step=Math.max(1,1+Math.floor(d*(1-smoothK))); for(let i=1;i<=step;i++){ const t=i/step; stroke.push({x:lerp(last.x,pt.x,t), y:lerp(last.y,pt.y,t), t:lerp(last.t,pt.t,t), p:lerp(last.p,pt.p,t)});} if(tool==='eraser') eraseStroke(ctx,last,pt,baseSize*1.2); else { cancelAnimationFrame(raf); raf=requestAnimationFrame(()=> drawSmooth(ctx, stroke.slice(-Math.max(6, step*2)), penColor, baseSize)); } } else { stroke.push(pt); } last=pt; buf.push({x:pt.x,y:pt.y,mode:tool,size:baseSize,color:penColor,t:pt.t,p:pt.p}); if(buf.length>64) flush(); }
  canvas.addEventListener('pointerdown', start); canvas.addEventListener('pointermove', move); window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove',  move,  {passive:false}); window.addEventListener('touchend', end);
}

bindDraw(tDraw, tdc, true);
['penBtn','eraserBtn'].forEach(id=>document.getElementById(id).onclick=()=>{ tool=(id==='eraserBtn'?'eraser':'pen'); });
document.getElementById('sizeRange').oninput=(e)=> baseSize=+e.target.value;
document.getElementById('smoothRange').oninput=(e)=> smoothK=+e.target.value;
Array.from(document.querySelectorAll('[data-color]')).forEach(el=> el.addEventListener('click',()=>{ penColor = el.dataset.color; }));

/************ 9) 生徒受信（同じロジックでiframeへ表示） ************/
document.getElementById('joinRoom').onclick = async ()=>{
  const name = document.getElementById('joinName').value.trim(); if(!name) return alert('部屋名を入力');
  room = name; roomSlug = slugRoom(room); document.getElementById('roomPill').textContent='room: '+roomSlug;
  await joinChannel(roomSlug);
  [sDraw].forEach(c=>fitCanvasToBox(c));

  channel.on('broadcast',(msg)=>{
    if(msg.event==='base'){
      const {url,name} = msg.payload||{}; const lower=(name||'').toLowerCase();
      if(lower.endsWith('.pdf')){
        sFrame.src = url + '#toolbar=0&view=FitH&zoom=page-width';
      } else if(/\.(doc|docx|ppt|pptx)$/.test(lower)){
        sFrame.src = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(url);
      } else {
        sFrame.src = url; // 画像はそのまま表示される（多くのブラウザでOK）
      }
      sdc.clearRect(0,0,sDraw.width,sDraw.height);
    }
    if(msg.event==='draw'){
      const pts=(msg.payload&&msg.payload.pts)||[]; if(!pts.length) return;
      let last=null; const chunk=[]; const smooth=1-smoothK;
      for(const p of pts){ if(last){ const d=dist(last,p); const step=Math.max(1,1+Math.floor(d*smooth)); for(let i=1;i<=step;i++){ const t=i/step; chunk.push({x:lerp(last.x,p.x,t), y:lerp(last.y,p.y,t), t:0, p:1}); } } else { chunk.push({x:p.x,y:p.y,t:0,p:1}); } last=p; }
      if((pts[0]||{}).mode==='eraser'){ for(let i=1;i<chunk.length;i++){ eraseStroke(sdc, chunk[i-1], chunk[i], (pts[0].size||baseSize)*1.2); } }
      else { drawSmooth(sdc, chunk, (pts[0]&&pts[0].color)||penColor, (pts[0]&&pts[0].size)||baseSize); }
    }
  });
};
</script>
</body>
</html>
