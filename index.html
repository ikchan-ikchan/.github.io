<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 記録 + 3D表示（骨格線付き）デモ</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video, canvas {
        display: block;
        margin: 10px auto;
      }
      #controls {
        margin: 10px;
      }
      #maxResolutionInfo, #poseCoordinates {
        margin-top: 5px;
        font-size: 0.9em;
        color: #555;
      }
      table {
        margin: auto;
        border-collapse: collapse;
      }
      table, th, td {
        border: 1px solid #aaa;
        padding: 4px;
      }
      /* 3D 表示エリアのスタイル */
      #threeContainer {
        margin: 10px auto;
        width: 640px;
        height: 300px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 記録 + 3D表示（骨格線付き）デモ</h2>
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
      &nbsp;&nbsp;
      <label for="resPercentInput">解像度 (%):</label>
      <input type="number" id="resPercentInput" min="1" max="100" value="100" style="width:60px;">
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
      &nbsp;&nbsp;
      <button id="captureButton">記録</button>
      <div id="maxResolutionInfo"></div>
    </div>
    
    <!-- カメラ映像（内部利用：Canvas に描画） -->
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <!-- 2D 描画用キャンバス -->
    <canvas id="outputCanvas"></canvas>
    
    <!-- Pose 座標表示用 -->
    <div id="poseCoordinates"></div>
    <!-- 3D 表示用コンテナ -->
    <div id="threeContainer"></div>
    
    <!-- MediaPipe Pose と Drawing Utils の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- Three.js の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls (非モジュール版) の読み込み -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
      // メディアパイプ Pose で使う接続配列（主要な骨格接続例）
      const POSE_CONNECTIONS = [
        [11, 13],
        [13, 15],
        [12, 14],
        [14, 16],
        [11, 12],
        [11, 23],
        [12, 24],
        [23, 24],
        [23, 25],
        [25, 27],
        [27, 29],
        [29, 31],
        [24, 26],
        [26, 28],
        [28, 30],
        [30, 32]
      ];
      
      const video = document.getElementById('video');
      const outputCanvas = document.getElementById('outputCanvas');
      const canvasCtx = outputCanvas.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const resPercentInput = document.getElementById('resPercentInput');
      const startButton = document.getElementById('startButton');
      const captureButton = document.getElementById('captureButton');
      const maxResolutionInfo = document.getElementById('maxResolutionInfo');
      const poseCoordinatesDiv = document.getElementById('poseCoordinates');
      const threeContainer = document.getElementById('threeContainer');
      
      let pose = null;
      let processingLoopId = null;
      let latestResults = null;  // 最新のポーズ検出結果を保持
      
      // ① 利用可能なカメラの列挙
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `カメラ ${index + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (error) {
          console.error('カメラの列挙に失敗:', error);
        }
      }
      
      // ② MediaPipe Pose の初期化
      function initializePose() {
        pose = new Pose({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
          }
        });
        pose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        pose.onResults((results) => {
          latestResults = results;
          canvasCtx.save();
          canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
          canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
          if (results.poseLandmarks) {
            // 2D 描画は MediaPipe が提供する接続で描画
            drawConnectors(canvasCtx, results.poseLandmarks, Pose.POSE_CONNECTIONS, { color: 'lime', lineWidth: 2 });
            drawLandmarks(canvasCtx, results.poseLandmarks, { color: 'red', lineWidth: 1 });
          }
          canvasCtx.restore();
        });
      }
      
      // ③ 選択カメラで、最大解像度の何％かを指定して映像を取得
      async function startCamera() {
        const selectedDeviceId = cameraSelect.value;
        const tempConstraints = { video: { deviceId: { exact: selectedDeviceId } } };
        let tempStream;
        try {
          tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
        } catch (error) {
          console.error('初回ストリームの取得に失敗:', error);
          return;
        }
        const videoTrack = tempStream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        let maxWidth = (capabilities.width && capabilities.width.max) || 640;
        let maxHeight = (capabilities.height && capabilities.height.max) || 480;
        maxResolutionInfo.innerText = `このカメラの最大解像度: ${maxWidth} x ${maxHeight}`;
        tempStream.getTracks().forEach(track => track.stop());
        
        const resPercent = parseInt(resPercentInput.value) || 100;
        const desiredWidth = Math.floor(maxWidth * (resPercent / 100));
        const desiredHeight = Math.floor(maxHeight * (resPercent / 100));
        const frameRate = parseInt(frameRateInput.value) || 15;
        
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { exact: desiredWidth },
            height: { exact: desiredHeight },
            frameRate: { ideal: frameRate }
          }
        };
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          return new Promise(resolve => {
            video.onloadedmetadata = () => {
              outputCanvas.width = video.videoWidth;
              outputCanvas.height = video.videoHeight;
              video.play();
              resolve();
            };
          });
        } catch (error) {
          console.error('カメラ映像の取得に失敗:', error);
        }
      }
      
      // ④ 映像フレームを MediaPipe Pose に送信するループ
      async function processVideo() {
        const frameRate = parseInt(frameRateInput.value) || 15;
        const interval = 1000 / frameRate;
        async function sendFrame() {
          if (!video.paused && !video.ended) {
            await pose.send({ image: video });
          }
          processingLoopId = setTimeout(sendFrame, interval);
        }
        sendFrame();
      }
      
      // ⑤ 「開始」ボタン押下時の処理
      startButton.addEventListener('click', async () => {
        await startCamera();
        initializePose();
        processVideo();
      });
      
      // ⑥ 「記録」ボタン押下時の処理：処理ループ停止、座標テーブル＆3D 表示更新
      captureButton.addEventListener('click', () => {
        clearTimeout(processingLoopId);
        if (latestResults && latestResults.poseLandmarks) {
          let html = '<h3>記録された座標 (x, y, z)</h3>';
          html += '<table>';
          html += '<tr><th>Index</th><th>x</th><th>y</th><th>z</th></tr>';
          latestResults.poseLandmarks.forEach((landmark, index) => {
            html += `<tr>
                        <td>${index}</td>
                        <td>${landmark.x.toFixed(3)}</td>
                        <td>${landmark.y.toFixed(3)}</td>
                        <td>${landmark.z.toFixed(3)}</td>
                     </tr>`;
          });
          html += '</table>';
          poseCoordinatesDiv.innerHTML = html;
          draw3DPoints(latestResults.poseLandmarks);
        } else {
          poseCoordinatesDiv.innerHTML = '<p>まだポーズが検出されていません。</p>';
          threeContainer.innerHTML = '';
        }
      });
      
      // ⑦ Three.js を用いた 3D 表示関数（OrbitControls で回転・タッチ操作可能、灰色地面＆青色骨格線付き）
      function draw3DPoints(landmarks) {
        // 既存シーンがある場合はクリア
        threeContainer.innerHTML = '';
        
        // シーン、カメラ、レンダラーの作成
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        threeContainer.appendChild(renderer.domElement);
        
        // OrbitControls の設定（回転・ズーム、ダンピング有効、タッチ操作対応）
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.screenSpacePanning = true;
        
        // 環境光の追加
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        // 灰色の地面（グラウンドプレーン）の追加
        const planeGeometry = new THREE.PlaneGeometry(400, 400);
        const planeMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -50;
        scene.add(plane);
        
        // 各ランドマークを球体として追加およびその座標を配列に格納
        const pointGeometry = new THREE.SphereGeometry(2, 16, 16);
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const points = [];
        landmarks.forEach(landmark => {
          if (landmark) {
            const sphere = new THREE.Mesh(pointGeometry, pointMaterial);
            const x = (landmark.x - 0.5) * 100;
            const y = (0.5 - landmark.y) * 100;
            const z = landmark.z * 100;
            sphere.position.set(x, y, z);
            scene.add(sphere);
            points.push({ x, y, z });
          } else {
            points.push(null);
          }
        });
        
        console.log("3D点の座標:", points); // デバッグ用
        
        // 骨格を青色の線で接続する
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff, linewidth: 2 });
        POSE_CONNECTIONS.forEach(pair => {
          const start = points[pair[0]];
          const end = points[pair[1]];
          if (start && end) {
            const geometry = new THREE.BufferGeometry();
            const vertices = new Float32Array([
              start.x, start.y, start.z,
              end.x, end.y, end.z
            ]);
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            const line = new THREE.Line(geometry, lineMaterial);
            scene.add(line);
          }
        });
        
        // カメラ位置を設定（全体が見やすい位置へ）
        camera.position.set(0, 0, 150);
        
        // アニメーションループ（OrbitControls 更新）
        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      }
      
      // ページ読み込み時にカメラを列挙
      enumerateCameras();
    </script>
  </body>
</html>
