<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebRTC DataChannel でリアルタイム動画送信デモ</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 0; margin: 0; }
    video { width: 45%; background: #000; margin: 5px; }
    #controls { margin: 10px; }
    #log { white-space: pre-wrap; background: #eee; padding: 5px; height: 100px; overflow-y: auto; font-size: 0.9em; text-align: left; }
  </style>
</head>
<body>
  <h1>リアルタイム動画送信 via DataChannel</h1>
  <div id="controls">
    <label>自分のID: <span id="myId">—</span></label><br>
    <input type="text" id="targetId" placeholder="相手のIDを入力">
    <button id="connectBtn">接続</button>
  </div>
  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
  <h3>ログ</h3>
  <div id="log">[INFO] Ready</div>

<script>
  const logDiv = document.getElementById('log');
  function log(msg){
    console.log(msg);
    logDiv.textContent += '\n' + msg;
  }

  // PeerJS 初期化
  const peer = new Peer();
  let dataConn = null, recorder = null;

  peer.on('open', id => {
    document.getElementById('myId').textContent = id;
    log(`[INFO] 自分のID: ${id}`);
  });
  peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

  // メディア取得＆MediaRecorderセットアップ
  async function startCaptureAndRecord(){
    const stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    document.getElementById('localVideo').srcObject = stream;
    // VP8/WebM がサポートされている前提
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp8' });
    recorder.ondataavailable = e => {
      if (e.data && e.data.size > 0 && dataConn && dataConn.open) {
        dataConn.send(e.data);
      }
    };
    // 100ms ごとにチャンクを生成
    recorder.start(100);
    log('[INFO] 録画開始 (100ms チャンク)');
  }

  // リモート再生用 MSE セットアップ
  const remoteVideo = document.getElementById('remoteVideo');
  const mediaSource = new MediaSource();
  remoteVideo.src = URL.createObjectURL(mediaSource);
  let sourceBuffer;
  mediaSource.addEventListener('sourceopen', () => {
    sourceBuffer = mediaSource.addSourceBuffer('video/webm; codecs="vp8"');
    // バッファが空くまでキューしておいて append する
    sourceBuffer.mode = 'sequence';
    log('[INFO] MediaSource & SourceBuffer ready');
  });

  // データ受信ハンドラ
  function setupDataHandlers(conn){
    conn.on('data', blob => {
      // Blob -> ArrayBuffer -> appendBuffer
      const reader = new FileReader();
      reader.onload = () => {
        const buf = reader.result;
        if (!sourceBuffer.updating) {
          sourceBuffer.appendBuffer(new Uint8Array(buf));
        } else {
          sourceBuffer.addEventListener('updateend', function f(){
            sourceBuffer.removeEventListener('updateend', f);
            sourceBuffer.appendBuffer(new Uint8Array(buf));
          });
        }
      };
      reader.readAsArrayBuffer(blob);
    });
    conn.on('open', () => {
      log('[INFO] DataChannel open');
      startCaptureAndRecord();
    });
    conn.on('close', () => log('[INFO] DataChannel closed'));
    conn.on('error', err => log(`[ERROR] DataChannel: ${err}`));
  }

  // 接続ボタン
  document.getElementById('connectBtn').onclick = () => {
    const target = document.getElementById('targetId').value.trim();
    if (!target) {
      log('[ERROR] 相手のIDを入力してください');
      return;
    }
    log(`[INFO] ${target} に接続を試みます...`);
    dataConn = peer.connect(target, { reliable: true });
    setupDataHandlers(dataConn);
    // 併せて着信側の映像通話がある場合は受信も可能ですが今回は DataChannel のみ
  };

  // 着信側のデータチャネル受付
  peer.on('connection', conn => {
    dataConn = conn;
    log(`[INFO] DataChannel 着信 from ${conn.peer}`);
    setupDataHandlers(conn);
  });
</script>
</body>
</html>
