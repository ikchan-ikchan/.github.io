<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P デモ（ストリーミング／スナップショット）</title>
  <style>
    video { width: 320px; height: 240px; background:#000; margin:4px; }
    #log  { white-space: pre-wrap; background:#f7f7f7; padding:4px; text-align:left; }
  </style>
</head>
<body>
  <h2>WebRTC P2P デモ</h2>
  <!-- 映像プレビュー -->
  <video id="localVideo"  autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>

  <!-- ── 既存 UI（カメラ選択＋接続）を温存 ── -->
  <div>
    相手ID: <input type="text" id="remoteId" placeholder="計算ノードID" />
    <button id="connect">接続</button><br>
    カメラ: <select id="camSelect"></select>
    <button id="startCam">カメラ開始</button>
  </div>

  <!-- ★ 追加：モード切替と撮影ボタン ★ -->
  <fieldset style="display:inline-block;margin-top:6px;">
    <legend>処理モード</legend>
    <label><input type="radio" name="mode" value="stream" checked> 通常</label>
    <label><input type="radio" name="mode" value="snap"> スナップショット</label>
    <button id="snapBtn" disabled>撮影</button>
  </fieldset>

  <h3>ログ</h3>
  <div id="log">ページ読み込み完了</div>

  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script>
    /* 省スペースのためエラーチェック簡略化。カメラ許可→選択→接続の流れは
       これまでの UI を一切削らず温存。 */

    const log = msg => (console.log(msg), logDiv.textContent += '\n'+msg);
    const logDiv     = document.getElementById('log');
    const localV     = document.getElementById('localVideo');
    const remoteV    = document.getElementById('remoteVideo');
    const camSel     = document.getElementById('camSelect');
    const startBtn   = document.getElementById('startCam');
    const connectBtn = document.getElementById('connect');
    const remoteIdIn = document.getElementById('remoteId');
    const modeRads   = document.querySelectorAll('input[name="mode"]');
    const snapBtn    = document.getElementById('snapBtn');

    const peer = new Peer();      // 自動ID
    let dataConn = null;          // データチャネル
    let localStream = null;

    peer.on('open', id => log('[INFO] 自分のID: '+id));
    peer.on('error', err => log('[ERROR] Peer: '+err));

    // カメラリスト
    navigator.mediaDevices.enumerateDevices().then(ds=>{
      ds.filter(d=>d.kind==='videoinput').forEach(d=>{
        const o=document.createElement('option');
        o.value=d.deviceId; o.text=d.label||d.deviceId;
        camSel.appendChild(o);
      });
    });

    // カメラ開始
    startBtn.onclick = async ()=>{
      localStream = await navigator.mediaDevices.getUserMedia({
        video:{deviceId:{exact:camSel.value}}, audio:false});
      localV.srcObject = localStream;
      log('[INFO] カメラ開始: '+localStream.getVideoTracks()[0].label);
    };

    // 接続
    connectBtn.onclick = ()=>{
      const id = remoteIdIn.value.trim();
      if(!id||!localStream){ log('[ERROR] 接続前にカメラ開始'); return; }
      // データチャネル
      dataConn = peer.connect(id);
      dataConn.on('open', ()=>{
        log('[INFO] DataConnection開通');
        dataConn.on('data', d=>log('[INFO] ↑計算ノード→'+d));
        // まず現在モードを通知
        dataConn.send('mode_stream');
      });
      // メディア通話
      const call = peer.call(id, localStream);
      call.on('stream', s=>{ remoteV.srcObject=s; log('[INFO] 処理映像受信');});
    };

    // モード切替
    modeRads.forEach(r=>{
      r.onchange = ()=>{
        if(!dataConn||dataConn.open===false)return;
        if(r.value==='stream'){
          snapBtn.disabled=true;
          dataConn.send('mode_stream');
          log('[INFO] →ストリーミングモード要求送信');
        }else{
          snapBtn.disabled=false;
          dataConn.send('mode_snap');
          log('[INFO] →スナップショットモード要求送信');
        }
      };
    });

    // 撮影ボタン
    snapBtn.onclick = ()=>{
      if(dataConn&&dataConn.open){ dataConn.send('snap'); log('[INFO] スナップ要求送信'); }
    };
  </script>
</body>
</html>
