<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Video Stream</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    #roleSelection, #senderUI, #receiverUI { margin-top: 20px; }
    video { width: 80%; max-width: 600px; background: #000; margin-top: 10px; }
    input, button { padding: 8px 12px; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>P2P Video Stream (WebRTC + PeerJS)</h1>

  <!-- Role Selection -->
  <div id="roleSelection">
    <button id="senderBtn">送信側 (Sender)</button>
    <button id="receiverBtn">受信側 (Receiver)</button>
  </div>

  <!-- Sender UI -->
  <div id="senderUI" style="display:none;">
    <p>あなたのID (Your Peer ID): <strong id="my-id">—</strong></p>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <!-- Receiver UI -->
  <div id="receiverUI" style="display:none;">
    <input type="text" id="remoteId" placeholder="送信側のIDを入力" />
    <button id="connectBtn">接続 (Connect)</button>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <script>
    let peer = null;
    let localStream = null;

    // DOM elements
    const roleSelection = document.getElementById('roleSelection');
    const senderUI       = document.getElementById('senderUI');
    const receiverUI     = document.getElementById('receiverUI');
    const senderBtn      = document.getElementById('senderBtn');
    const receiverBtn    = document.getElementById('receiverBtn');
    const myIdElem       = document.getElementById('my-id');
    const localVideo     = document.getElementById('localVideo');
    const remoteVideo    = document.getElementById('remoteVideo');
    const remoteIdInput  = document.getElementById('remoteId');
    const connectBtn     = document.getElementById('connectBtn');

    // 送信側を選択
    senderBtn.onclick = async () => {
      roleSelection.style.display = 'none';
      senderUI.style.display = 'block';

      // PeerJS の初期化
      peer = new Peer();
      peer.on('open', id => {
        myIdElem.textContent = id;
      });

      // カメラ映像を取得
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        localVideo.srcObject = localStream;
      } catch(err) {
        alert('カメラにアクセスできませんでした: ' + err);
        console.error(err);
      }

      // 受信リクエストを待つ
      peer.on('call', call => {
        // 受信者からのストリーム要求に対し、ローカル映像を返す
        call.answer(localStream);
      });
    };

    // 受信側を選択
    receiverBtn.onclick = () => {
      roleSelection.style.display = 'none';
      receiverUI.style.display = 'block';

      // PeerJS の初期化
      peer = new Peer();
      peer.on('error', err => console.error(err));

      // フロー：接続ボタンクリックで発信
      connectBtn.onclick = () => {
        const remoteId = remoteIdInput.value.trim();
        if (!remoteId) {
          alert('送信側のIDを入力してください');
          return;
        }

        // カメラ不要なら undefined を第1引数に
        const call = peer.call(remoteId, null);
        
        // ストリーム受信時にビデオにセット
        call.on('stream', stream => {
          remoteVideo.srcObject = stream;
        });

        call.on('error', err => console.error(err));
      };

      // 受信側の Peer ID（必要な場合にログ出力）
      peer.on('open', id => {
        console.log('Receiver Peer ID:', id);
      });

      // 通話の着信ハンドラ
      peer.on('call', call => {
        // 送信側が null ストリームで発信したとき、自分で getUserMedia して answer 引数に渡す
        navigator.mediaDevices.getUserMedia({ video: false, audio: false })
          .then(emptyStream => call.answer(emptyStream))
          .catch(err => console.warn('空ストリーム用の getUserMedia に失敗:', err));
      });
    };
  </script>
</body>
</html>
