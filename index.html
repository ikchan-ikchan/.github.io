<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + ジョイスティック + 双方向ストリーミング録画</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
    #mediaArea { display: grid; grid-gap: 10px; padding: 10px; }
    #localVideo, #remoteVideo { width: 100%; height: auto; background: #000; }
    #joystick { box-sizing: border-box; width: 60px; height: 240px; margin: auto;
                position: relative; border: 4px solid #000; border-radius: 30px;
                background: #fff; touch-action: none; overscroll-behavior: contain; }
    #knob { position: absolute; left:50%; top:50%; width:40px; height:40px;
            border-radius:50%; background:#000; transform:translate(-50%,-50%);
            transition:transform 0.15s; pointer-events:none; }
    #joystickState { font-weight:bold; margin-top:4px; }
    #controls { padding:10px; }
    #controls select, #controls input, #controls button { margin:4px; }
    #log { white-space: pre-wrap; background:#f7f7f7; padding:8px;
           margin:8px; text-align:left; height:120px; overflow-y:auto;
           font-size:0.9em; }
    @media (orientation: portrait) {
      #mediaArea {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "localVideo joystick"
          "remoteVideo joystick";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick    { grid-area: joystick; }
    }
    @media (orientation: landscape) {
      #mediaArea {
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "localVideo joystick remoteVideo";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick    { grid-area: joystick; }
    }
  </style>
</head>
<body>
  <h1>WebRTC P2P + ジョイスティック + 双方向ストリーミング録画</h1>

  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline controls></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>

  <hr/>

  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>

    <div id="userControls">
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button>
      <input type="text" id="targetId" placeholder="相手のIDを入力" />
      <button id="connectBtn">接続</button>
    </div>

    <div id="computeControls" style="display:none;">
      <p>計算ノードモード：Unityカメラ取得中…</p>
    </div>

    <button id="recordBtn">録画 開始</button>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

<script>
  const params    = new URLSearchParams(location.search);
  const isCompute = params.get('role') === 'compute';

  const localVideo     = document.getElementById('localVideo');
  const remoteVideo    = document.getElementById('remoteVideo');
  const joy            = document.getElementById('joystick');
  const knob           = document.getElementById('knob');
  const stateDiv       = document.getElementById('joystickState');
  const logDiv         = document.getElementById('log');
  const myIdSpan       = document.getElementById('myId');
  const userControls   = document.getElementById('userControls');
  const computeControls= document.getElementById('computeControls');
  const videoSelect    = document.getElementById('videoSource');
  const startCamBtn    = document.getElementById('startCamera');
  const targetInput    = document.getElementById('targetId');
  const connectBtn     = document.getElementById('connectBtn');
  const recordBtn      = document.getElementById('recordBtn');

  let dataConn      = null;
  let mediaRecorder = null;

  let incomingBuffers = [];
  let incomingType    = '';

  function log(msg){
    console.log(msg);
    logDiv.textContent += '\n' + msg;
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  // — DataChannel セットアップ —
  function setupDataChannel(conn){
    dataConn = conn;
    conn.on('open',  () => log('[INFO] データチャネル開通'));
    conn.on('error', e => log(`[ERROR] データチャネル: ${e}`));
    conn.on('data',  handleData);
  }

  // — DataChannel 受信処理 —
  function handleData(d){
    if(d && d.type === 'file-info'){
      incomingBuffers = [];
      incomingType    = d.fileType;
      log('[INFO] ファイル転送開始: ' + incomingType);
    }
    else if(d instanceof ArrayBuffer){
      incomingBuffers.push(d);
      log('[INFO] チャンク受信: ' + d.byteLength + ' bytes');
    }
    else if(d && d.type === 'stop'){
      const blob = new Blob(incomingBuffers, { type: incomingType });
      remoteVideo.src = URL.createObjectURL(blob);
      log('[INFO] ファイル転送完了');
    }
    else if(d && d.type === 'joystick'){
      setKnobPosition(d.value);
    }
  }

  // — PeerJS 初期化 —
  const peer = new Peer();
  peer.on('open', id => {
    myIdSpan.textContent = id;
    log(`[INFO] PeerJS 接続完了: ${id}`);
    if(isCompute) log('[INFO] 計算ノードモード 起動');
  });
  peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

  // — モード別 初期化 —
  if(isCompute){
    userControls.style.display    = 'none';
    computeControls.style.display = 'block';

    // 最初に許可をもらってラベル取得 → Unity Virtual Camera 特定
    async function getUnityStream(){
      await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
      const devs = await navigator.mediaDevices.enumerateDevices();
      const cam = devs.find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
      if(!cam) throw new Error('Unity Virtual Camera が見つかりません');
      return navigator.mediaDevices.getUserMedia({
        video:{ deviceId:{ exact: cam.deviceId }, width:1920, height:1080 },
        audio:false
      });
    }

    getUnityStream()
      .then(stream => {
        localVideo.srcObject = stream;
        log('[INFO] Unityカメラ取得: ' + stream.getVideoTracks()[0].label);
        setupRecorder(stream);
      })
      .catch(err => log(`[ERROR] カメラ取得失敗: ${err.message}`));

    peer.on('connection', conn => {
      log('[INFO] データチャネル接続検出');
      setupDataChannel(conn);
    });

  } else {
    computeControls.style.display = 'none';
    userControls.style.display    = 'block';

    navigator.mediaDevices.enumerateDevices()
      .then(devs => {
        devs.filter(d=>d.kind==='videoinput').forEach(d=>{
          const o = document.createElement('option');
          o.value = d.deviceId;
          o.text  = d.label || d.deviceId;
          videoSelect.appendChild(o);
        });
        if(!videoSelect.options.length) log('[WARN] カメラがありません');
      });

    startCamBtn.onclick = () => {
      const id = videoSelect.value;
      if(!id){ log('[ERROR] カメラ未選択'); return; }
      navigator.mediaDevices.getUserMedia({
        video:{ deviceId:{ exact:id }, width:1920, height:1080 },
        audio:false
      })
      .then(stream => {
        localVideo.srcObject = stream;
        log('[INFO] カメラ開始: ' + stream.getVideoTracks()[0].label);
        setupRecorder(stream);
      })
      .catch(err => log(`[ERROR] カメラ取得失敗: ${err.message}`));
    };

    connectBtn.onclick = () => {
      const tgt = targetInput.value.trim();
      if(!tgt){ log('[ERROR] IDを入力してください'); return; }
      const conn = peer.connect(tgt);
      setupDataChannel(conn);
    };
  }

  // — ジョイスティック操作（共通） —
  function updateState(v){
    const lbl = v < -0.5 ? '上' : v > 0.5 ? '下' : '中心';
    stateDiv.textContent = lbl;
    if(!isCompute && dataConn && dataConn.open){
      dataConn.send({ type:'joystick', value:v });
    }
  }
  function setKnobPosition(v){
    const rect = joy.getBoundingClientRect();
    const maxY = rect.height/2 - knob.offsetHeight/2;
    const y = Math.max(-maxY, Math.min(maxY, v * maxY));
    knob.style.transition = 'transform 0.15s';
    knob.style.transform  = `translate(-50%, calc(-50% + ${y}px))`;
    stateDiv.textContent = v < -0.5 ? '上' : v > 0.5 ? '下' : '中心';
    setTimeout(()=> knob.style.transition = '', 160);
  }
  if(!isCompute){
    let dragging=false, rect, maxY;
    joy.addEventListener('pointerdown', e=>{
      e.preventDefault(); dragging=true;
      rect = joy.getBoundingClientRect();
      maxY = rect.height/2 - knob.offsetHeight/2;
      joy.setPointerCapture(e.pointerId);
      moveAndUpdate(e.clientY);
    }, { passive:false });
    joy.addEventListener('pointermove', e=>{
      if(dragging){ e.preventDefault(); moveAndUpdate(e.clientY); }
    }, { passive:false });
    joy.addEventListener('pointerup', e=>{
      e.preventDefault(); dragging=false; resetKnob();
    }, { passive:false });
    function moveAndUpdate(cy){
      let y = cy - (rect.top + rect.height/2);
      y = Math.max(-maxY, Math.min(maxY, y));
      knob.style.transition = '';
      knob.style.transform  = `translate(-50%, calc(-50% + ${y}px))`;
      updateState(y / maxY);
    }
    function resetKnob(){
      knob.style.transition = 'transform 0.15s';
      knob.style.transform  = 'translate(-50%, -50%)';
      updateState(0);
      setTimeout(()=> knob.style.transition = '', 160);
    }
  }

  // — MediaRecorder + タイムスライス + 追加チャンク —
  function setupRecorder(stream){
    mediaRecorder = new MediaRecorder(stream, {
      mimeType:'video/webm; codecs=vp9',
      videoBitsPerSecond: 5_000_000
    });
    mediaRecorder.ondataavailable = e => {
      if(e.data && e.data.size>0){
        e.data.arrayBuffer().then(buf=>{
          dataConn.send(buf);
          log('[INFO] チャンク送信: ' + buf.byteLength + ' bytes');
        });
      }
    };
    mediaRecorder.onstop = () => {
      // stop前にもう一度 flush
      mediaRecorder.requestData();
      // 完了マーカー
      dataConn.send({ type:'stop' });
      log('[INFO] stop 送信');
    };
  }

  // — 録画開始／停止 + 追加チャンク —
  recordBtn.onclick = () => {
    if(!mediaRecorder){
      log('[ERROR] 先にカメラ開始してください');
      return;
    }
    const sliceMs = 1000;
    if(mediaRecorder.state === 'inactive'){
      // ファイル情報送信
      dataConn.send({ type:'file-info', fileType: mediaRecorder.mimeType });
      log('[INFO] file-info 送信: ' + mediaRecorder.mimeType);
      // 開始
      mediaRecorder.start(sliceMs);
      // 即 flush で追加チャンク
      mediaRecorder.requestData();
      log('[INFO] 録画開始 + 追加チャンク requestData()');
      recordBtn.textContent = '録画 停止';
    } else {
      // stop前 flush
      mediaRecorder.requestData();
      log('[INFO] 録画停止前 追加チャンク requestData()');
      mediaRecorder.stop();
      recordBtn.textContent = '録画 開始';
      log('[INFO] 録画停止');
    }
  };
</script>
</body>
</html>
