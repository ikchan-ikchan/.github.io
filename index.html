<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>骨格推定 P2P デモ（仮想カメラ対応修正版）</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 45%; margin: 0 2%; background: #000; }
    #status { color: red; white-space: pre-wrap; text-align: left; max-width: 600px; margin: auto; }
  </style>
</head>
<body>
  <h1>骨格推定 P2P デモ</h1>
  <div>
    <label><input type="radio" name="role" value="compute"> 計算</label>
    <label><input type="radio" name="role" value="user"> ユーザー</label>
    部屋番号：<input type="text" id="roomCode" placeholder="1234">
    <button id="startBtn">開始</button>
    <button id="callBtn">接続</button>
  </div>
  <pre id="status">[INFO] Ready</pre>
  <p>あなたの PeerID: <span id="myId">—</span></p>
  <video id="localVideo" autoplay muted></video>
  <video id="remoteVideo" autoplay></video>

  <script>
    const log = msg => {
      console.log(msg);
      document.getElementById('status').textContent += '\n' + msg;
    };
    const status = document.getElementById('status');
    const startBtn= document.getElementById('startBtn');
    const callBtn = document.getElementById('callBtn');
    const roomIn  = document.getElementById('roomCode');
    const myId    = document.getElementById('myId');
    const localV  = document.getElementById('localVideo');
    const remoteV = document.getElementById('remoteVideo');

    let role, peer, localStream, roomCode;

    startBtn.onclick = async () => {
      status.textContent = '[INFO] Starting…';
      role = document.querySelector('input[name=role]:checked')?.value;
      roomCode = roomIn.value.trim();
      if (!role)     return log('[ERROR] 先に「計算」か「ユーザー」を選択');
      if (!roomCode) return log('[ERROR] 部屋番号を入力してください');

      peer = new Peer(`${role}-${roomCode}`, {
        host: '0.peerjs.com', secure: true, port: 443,
        config: [{ urls: 'stun:stun.l.google.com:19302' }]
      });
      peer.on('open', id => {
        myId.textContent = id;
        log(`[INFO] Peer opened: ${id}`);
      });
      peer.on('error', e => log(`[ERROR] PeerJS: ${e}`));

      if (role === 'user') {
        // ──────────── ユーザー側 ────────────
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true });
          localV.srcObject = localStream;
          log('[INFO] Local camera stream obtained');
        } catch (e) {
          return log(`[ERROR] getUserMedia failed: ${e}`);
        }
        peer.on('call', call => {
          log('[INFO] Incoming call — answering with localStream');
          call.answer(localStream);
          call.on('stream', s => {
            remoteV.srcObject = s;
            log('[INFO] Received remote stream');
          });
        });
      } else {
        // ──────────── 計算側 ────────────
        callBtn.style.display = 'none';

        peer.on('call', async call => {
          log('[INFO] Incoming call on compute side');
          // デバイス列挙
          const cams = await navigator.mediaDevices.enumerateDevices();
          const vInputs = cams.filter(d => d.kind === 'videoinput');
          log('[INFO] Available video inputs: ' + vInputs.map(d=>d.label).join(' | '));

          // ラベルで探す
          let vc = vInputs.find(d =>
            /VirtualCam|OBS Virtual Camera|Unity Video Capture/.test(d.label)
          );
          if (!vc) {
            // フォールバック：最初のビデオ入力
            vc = vInputs[0];
            log('[WARN] 仮想カメラ候補が見つかりませんでした。フォールバック: ' + vc.label);
          } else {
            log('[INFO] Using virtual cam: ' + vc.label);
          }

          try {
            localStream = await navigator.mediaDevices.getUserMedia({
              video: { deviceId: vc.deviceId }
            });
          } catch (e) {
            return log(`[ERROR] 仮想カメラ取得失敗: ${e}`);
          }
          localV.srcObject = localStream;
          log('[INFO] Virtual camera stream set as localStream');

          call.answer(localStream);
          call.on('stream', s => {
            remoteV.srcObject = s;
            log('[INFO] Received stream from user');
          });
        });
      }
    };

    callBtn.onclick = () => {
      status.textContent = '[INFO] Calling compute…';
      if (!peer || !roomCode) return log('[ERROR] 先に開始してください');
      const target = role === 'user'
        ? `compute-${roomCode}`
        : `user-${roomCode}`;
      log(`[INFO] peer.call(${target})`);
      try {
        const call = peer.call(target, localStream);
        call.on('stream', s => {
          remoteV.srcObject = s;
          log('[INFO] Received remote stream');
        });
        call.on('error', e => log(`[ERROR] call error: ${e}`));
      } catch (e) {
        log(`[ERROR] peer.call exception: ${e}`);
      }
    };
  </script>
</body>
</html>
