<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>PeerJS P2Pデモ（4桁コード版）</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family:sans-serif; text-align:center; }
    video{ width:320px; height:240px; background:#000; margin:0 12px; }
    #log { white-space:pre-wrap; text-align:left; background:#f7f7f7; padding:6px; }
  </style>
</head>
<body>
  <h2>P2P 通話ページ（計算 / ユーザー）</h2>

  <div>
    <video id="localVideo"  autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <hr/>
  <!-- ▼コントロール -->
  <div id="userUI">
    カメラ選択：<select id="videoSel"></select>
    <button id="startCam">カメラ開始</button><br/>
    相手ID: <input id="targetId" placeholder="例: compute-1234">
    <button id="callBtn">発信</button>
  </div>

  <div id="computeUI" style="display:none;">
    <p>計算ノード：Unity Video Capture を自動選択し、着信待機中…</p>
  </div>

  <p>自分のID: <span id="myId">（未接続）</span></p>
  <div id="log">[INFO] ページ読込完了\n</div>

<script>
const q       = new URLSearchParams(location.search);
const role    = q.get('role') === 'compute' ? 'compute' : 'user';   // デフォルトはユーザー
const roomCode= q.get('code')  || (''+Math.floor(Math.random()*9000+1000)); // 4桁
const peerId  = `${role}-${roomCode}`;  // 例: compute-1234 / user-1234
log(`このページは ${role} モード、部屋番号 ${roomCode}`);

const localV  = document.getElementById('localVideo');
const remoteV = document.getElementById('remoteVideo');
const videoSel= document.getElementById('videoSel');
const logDiv  = document.getElementById('log');
function log(t){ console.log(t); logDiv.textContent += t+'\n'; }

document.getElementById(role==='user' ? 'computeUI':'userUI').style.display='none';

// PeerJS 接続
const peer = new Peer(peerId,{
  host:'0.peerjs.com', secure:true, port:443,
  config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}
});
peer.on('open', id=>{ document.getElementById('myId').textContent=id; log(`PeerID: ${id}`);});
peer.on('error',e=>log('[ERROR] '+e));

/* ---------- 計算ノード ---------- */
if(role==='compute'){
  navigator.mediaDevices.enumerateDevices().then(ds=>{
    const cam = ds.find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
    if(!cam){ log('[ERROR] Unity Video Capture が見つかりません'); return; }
    return navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:cam.deviceId}},audio:false});
  })
  .then(stream=>{
    if(!stream) return;
    localV.srcObject=stream;
    log('[INFO] Unity Video Capture 取得成功');
    peer.on('call',call=>{
      log('[INFO] 着信→処理映像で応答');
      call.answer(stream);
      call.on('stream',s=>{remoteV.srcObject=s; log('[INFO] ユーザー映像受信');});
    });
  })
  .catch(e=>log('[ERROR] カメラ取得失敗: '+e));

}else{
/* ---------- ユーザー ---------- */

navigator.mediaDevices.enumerateDevices().then(ds=>{
  ds.filter(d=>d.kind==='videoinput').forEach(d=>{
    const o=document.createElement('option');
    o.value=d.deviceId; o.text=d.label||d.deviceId; videoSel.appendChild(o);
  });
});

document.getElementById('startCam').onclick=()=>{
  navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:videoSel.value}},audio:false})
  .then(s=>{ localV.srcObject=s; window.localStream=s; log('[INFO] カメラ開始');})
  .catch(e=>log('[ERROR] カメラ開始失敗:'+e));
};

document.getElementById('callBtn').onclick=()=>{
  const target=document.getElementById('targetId').value.trim();
  if(!target){ log('発信先IDを入力'); return;}
  if(!window.localStream){ log('カメラを開始してください'); return;}
  log(`発信→ ${target}`);
  const call=peer.call(target,window.localStream);
  call.on('stream',s=>{ remoteV.srcObject=s; log('[INFO] リモート映像受信');});
  call.on('error',e=>log('[ERROR] 通話:'+e));
};

peer.on('call',call=>{
  log('[INFO] 着信→自カメラで応答');
  call.answer(window.localStream||null);
  call.on('stream',s=>{remoteV.srcObject=s; log('[INFO] リモート映像受信');});
});
}
</script>
</body>
</html>
