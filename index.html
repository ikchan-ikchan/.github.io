<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>P2P ビデオ転送 + ジョイスティック</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
    #mediaArea { display: grid; grid-gap: 10px; padding: 10px; }
    #localVideo, #remoteVideo { width: 100%; height: auto; background: #000; }
    #joystick { box-sizing: border-box; width: 60px; height: 240px; margin: auto; position: relative; border: 4px solid #000; border-radius: 30px; background: #fff; touch-action: none; overscroll-behavior: contain; }
    #joystick #knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; background: #000; transform: translate(-50%, -50%); transition: transform 0.15s; pointer-events: none; }
    @media (orientation: portrait) {
      #mediaArea { grid-template-columns: 1fr auto; grid-template-rows: auto auto; grid-template-areas: "localVideo joystick" "remoteVideo joystick"; align-items: center; height: calc(100vh - 200px); }
      #localVideo { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick { grid-area: joystick; }
    }
    @media (orientation: landscape) {
      #mediaArea { grid-template-columns: 1fr auto 1fr; grid-template-rows: auto; grid-template-areas: "localVideo joystick remoteVideo"; align-items: center; height: calc(100vh - 200px); }
      #localVideo { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick { grid-area: joystick; }
    }
    #joystickState { font-weight: bold; margin-top: 4px; }
    #controls { padding: 10px; }
    #controls select, #controls input, #controls button { margin: 4px; }
    #log { white-space: pre-wrap; background: #f7f7f7; padding: 8px; margin: 8px; text-align: left; height: 120px; overflow-y: auto; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>P2P ビデオ転送 + ジョイスティック</h1>
  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" controls></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>
  <hr/>
  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>
    <div>
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button>
    </div>
    <div>
      <input type="text" id="targetId" placeholder="相手のIDを入力" />
      <button id="connectBtn">接続</button>
      <button id="recordBtn" disabled>録画開始</button>
    </div>
  </div>
  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>
<script>
  const joy       = document.getElementById('joystick');
  const knob      = document.getElementById('knob');
  const stateDiv  = document.getElementById('joystickState');
  const localVideo= document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const myIdSpan  = document.getElementById('myId');
  const logDiv    = document.getElementById('log');
  const videoSelect = document.getElementById('videoSource');
  const startCamBtn = document.getElementById('startCamera');
  const connectBtn  = document.getElementById('connectBtn');
  const recordBtn   = document.getElementById('recordBtn');
  const targetInput = document.getElementById('targetId');

  function log(msg){ logDiv.textContent += '\n' + msg; }

  // PeerJS と DataChannel 初期化
  const peer = new Peer();
  let dataConn;
  let mediaRecorder, recordedChunks = [];

  peer.on('open', id => { myIdSpan.textContent = id; log(`[INFO] 自分のID: ${id}`); });
  peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

  // カメラ列挙
  navigator.mediaDevices.enumerateDevices()
    .then(devs => {
      devs.filter(d => d.kind === 'videoinput').forEach(d => {
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.text  = d.label || d.deviceId;
        videoSelect.appendChild(o);
      });
      if(videoSelect.options.length===0) log('[WARN] カメラがありません');
    });

  // カメラ開始
  startCamBtn.onclick = () => {
    const id = videoSelect.value;
    if(!id){ log('[ERROR] カメラ未選択'); return; }
    navigator.mediaDevices.getUserMedia({ video:{ deviceId:{ exact:id } }, audio:false })
      .then(stream => {
        localVideo.srcObject = stream;
        window.localStream = stream;
        log(`[INFO] カメラ開始: ${stream.getVideoTracks()[0].label}`);
      })
      .catch(err => log(`[ERROR] カメラ取得失敗: ${err.message}`));
  };

  // P2P 接続
  connectBtn.onclick = () => {
    const tgt = targetInput.value.trim();
    if(!tgt){ log('[ERROR] 接続先IDを入力'); return; }
    dataConn = peer.connect(tgt);
    dataConn.on('open', ()=>{ log('[INFO] データチャネル開通'); recordBtn.disabled=false; });
    dataConn.on('data', d => {
      if(d instanceof Blob){
        const url = URL.createObjectURL(d);
        remoteVideo.src = url;
        remoteVideo.play();
        log('[INFO] ビデオ受信完了');
      } else if(d.type==='joystick'){
        setKnobPosition(d.value);
      }
    });
    dataConn.on('error', e=> log(`[ERROR] データチャネル: ${e}`));
  };

  // 録画 & 送信
  recordBtn.onclick = () => {
    if(recordBtn.textContent === '録画開始'){
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(window.localStream);
      mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        dataConn.send(blob);
        log('[INFO] 録画データ送信完了');
      };
      mediaRecorder.start();
      recordBtn.textContent = '録画停止';
      log('[INFO] 録画開始');
    } else {
      mediaRecorder.stop();
      recordBtn.textContent = '録画開始';
      log('[INFO] 録画停止');
    }
  };

  // ジョイスティック処理
  function updateState(v){
    const label = v < -0.5 ? '上' : v > 0.5 ? '下' : '中心';
    stateDiv.textContent = label;
    if(dataConn && dataConn.open) dataConn.send({ type:'joystick', value:v });
  }
  function setKnobPosition(v){
    const rect = joy.getBoundingClientRect();
    const maxY = rect.height/2 - knob.offsetHeight/2;
    const y = Math.max(-maxY, Math.min(maxY, v*maxY));
    knob.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
    stateDiv.textContent = v < -0.5 ? '上' : v > 0.5 ? '下' : '中心';
  }
  let dragging=false, baseRect, baseMaxY;
  joy.addEventListener('pointerdown', e=>{
    e.preventDefault(); dragging=true;
    baseRect = joy.getBoundingClientRect();
    baseMaxY = baseRect.height/2 - knob.offsetHeight/2;
    joy.setPointerCapture(e.pointerId);
  });
  joy.addEventListener('pointermove', e=>{
    if(!dragging) return;
    let y = e.clientY - (baseRect.top + baseRect.height/2);
    y = Math.max(-baseMaxY, Math.min(baseMaxY, y));
    knob.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
    updateState(y/baseMaxY);
  });
  joy.addEventListener('pointerup', e=>{
    dragging=false;
    knob.style.transform = 'translate(-50%, -50%)';
    updateState(0);
  });
</script>
</body>
</html>
