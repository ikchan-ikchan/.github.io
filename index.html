<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P デモ（スナップショット機能付き）</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 320px; height: 240px; background:#000; }
    #log { white-space: pre-wrap; background:#f7f7f7; padding:4px; margin-top:8px; text-align:left; }
    #computeControls p, #computeControls button { margin: 4px; }
  </style>
</head>
<body>
  <h1>WebRTC P2P デモ</h1>

  <div>
    <div style="display:inline-block;margin:0 20px;">
      <h3>ローカル映像</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div style="display:inline-block;margin:0 20px;">
      <h3>リモート映像</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <hr/>

  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>

    <!-- ユーザーモード UI -->
    <div id="userControls">
      <label for="videoSource">カメラ選択:</label>
      <select id="videoSource"></select>
      <button id="startCamera">カメラ開始</button><br/>
      <input type="text" id="targetId" placeholder="相手のIDを入力" />
      <button id="callBtn">発信</button>
    </div>

    <!-- 計算モード UI -->
    <div id="computeControls" style="display:none;">
      <p>計算ノードモード：Unity Video Capture を自動選択して待機します。</p>

      <!-- モード選択 -->
      <p>
        <label><input type="radio" name="processMode" value="continuous" checked> 連続処理モード</label>
        <label><input type="radio" name="processMode" value="snapshot"> スナップショットモード</label>
      </p>
      <!-- スナップショットボタン -->
      <button id="snapshotBtn">撮影</button>
    </div>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

<script>
  const params = new URLSearchParams(location.search);
  const role   = params.get('role');
  const isCompute = role === 'compute';

  const localVideo  = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const myIdSpan    = document.getElementById('myId');
  const logDiv      = document.getElementById('log');

  const userControls    = document.getElementById('userControls');
  const computeControls = document.getElementById('computeControls');
  const videoSel        = document.getElementById('videoSource');
  const startBtn        = document.getElementById('startCamera');
  const targetInput     = document.getElementById('targetId');
  const callBtn         = document.getElementById('callBtn');
  const snapshotBtn     = document.getElementById('snapshotBtn');

  function log(msg){ console.log(msg); logDiv.textContent += '\n'+msg; }

  const peer = new Peer();
  peer.on('open', id => { myIdSpan.textContent = id; log(`[INFO] 自分のID: ${id}`); });
  peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

  // スナップショットリクエスト用フラグ
  window.snapshotRequested = false;
  snapshotBtn.onclick = () => {
    window.snapshotRequested = true;
    log("[INFO] 撮影リクエストを受け付けました");
  };

  if (isCompute) {
    userControls.style.display    = 'none';
    computeControls.style.display = 'block';
    log("[INFO] 計算モード: Unity Video Capture を自動選択します");

    navigator.mediaDevices.enumerateDevices()
      .then(devs => {
        const cam = devs.find(d => d.kind==='videoinput' && d.label.includes('Unity Video Capture'));
        if (!cam) throw new Error("Unity Video Capture が見つかりません");
        log(`[INFO] 「${cam.label}」を使用します`);
        return navigator.mediaDevices.getUserMedia({
          video:{ deviceId:{ exact: cam.deviceId }}, audio:false
        });
      })
      .then(stream => {
        localVideo.srcObject = stream;
        peer.on('call', call => {
          log("[INFO] 着信: 計算ノード映像で応答します");
          call.answer(stream);
          call.on('stream', s => {
            remoteVideo.srcObject = s;
            log("[INFO] ユーザー映像を受信しました");
          });
        });
      })
      .catch(err => {
        log(`[ERROR] カメラ取得失敗: ${err.message}`);
        peer.on('call', call => {
          log("[WARN] 映像なしで応答します");
          call.answer(null);
        });
      });

  } else {
    userControls.style.display    = 'block';
    computeControls.style.display = 'none';
    log("[INFO] ユーザーモード: カメラを選択してください");

    navigator.mediaDevices.enumerateDevices().then(devs => {
      videoSel.innerHTML = '';
      devs.filter(d=>d.kind==='videoinput').forEach(d=>{
        const o = document.createElement('option');
        o.value = d.deviceId; o.text = d.label || d.deviceId;
        videoSel.appendChild(o);
      });
      if (!videoSel.options.length) log("[WARN] カメラが見つかりません");
    });

    startBtn.onclick = () => {
      const id = videoSel.value;
      if (!id) return log("[ERROR] カメラ選択してください");
      navigator.mediaDevices.getUserMedia({
        video:{ deviceId:{ exact:id }}, audio:false
      })
      .then(stream => {
        localVideo.srcObject = stream;
        window.localStream = stream;
        log(`[INFO] カメラ開始: ${stream.getVideoTracks()[0].label}`);
      })
      .catch(e => log(`[ERROR] カメラ開始失敗: ${e.message}`));
    };

    callBtn.onclick = () => {
      const target = targetInput.value.trim();
      if (!target)       return log("[ERROR] 相手IDを入力してください");
      if (!window.localStream) return log("[ERROR] カメラ開始してください");
      log(`[INFO] 発信: ${target}`);
      const call = peer.call(target, window.localStream);
      call.on('stream', s => {
        remoteVideo.srcObject = s;
        log("[INFO] リモート映像を受信しました");
      });
      call.on('error', e => log(`[ERROR] 通話エラー: ${e}`));
    };

    peer.on('call', call => {
      log("[INFO] 着信あり → 応答します");
      call.answer(window.localStream || null);
      call.on('stream', s => {
        remoteVideo.srcObject = s;
        log("[INFO] リモート映像を受信しました");
      });
    });
  }
</script>
</body>
</html>
