<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>骨格推定 P2P デモ</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 45%; margin: 0 2%; background: #000; }
    #controls { margin: 1em; }
    table { margin: 1em auto; border-collapse: collapse; width: 50%; }
    th, td { border: 1px solid #aaa; padding: 8px; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>骨格推定 P2P デモ</h1>
  <div id="controls">
    <label><input type="radio" name="role" value="compute"> 計算</label>
    <label><input type="radio" name="role" value="user"> ユーザー</label>
    <button id="startBtn">開始</button>
  </div>

  <p>あなたの PeerID: <span id="myId">—</span></p>
  <p>相手の PeerID: <input type="text" id="peerIdInput" placeholder="相手のID"></p>
  <button id="callBtn">接続する</button>

  <!-- 待機中の計算ID一覧テーブル -->
  <h2>待機中の計算（Compute）ID一覧</h2>
  <table id="computeTable">
    <thead>
      <tr><th>計算ID</th></tr>
    </thead>
    <tbody id="computeTableBody">
      <tr><td>なし</td></tr>
    </tbody>
  </table>

  <div>
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
  </div>

  <script>
    const myIdSpan = document.getElementById('myId');
    const localV = document.getElementById('localVideo');
    const remoteV = document.getElementById('remoteVideo');
    const startBtn = document.getElementById('startBtn');
    const callBtn  = document.getElementById('callBtn');
    const peerIdIn = document.getElementById('peerIdInput');
    const computeBody = document.getElementById('computeTableBody');

    let role, peer, localStream;

    startBtn.onclick = async () => {
      role = document.querySelector('input[name=role]:checked')?.value;
      if (!role) return alert('まず役割を選択してください');

      peer = new Peer({
        host: '0.peerjs.com', secure: true, port: 443,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', id => {
        myIdSpan.textContent = id;

        if (role === 'user') {
          // 定期的に計算側IDを取得して更新
          setInterval(() => {
            peer.listAllPeers(peers => {
              const others = peers.filter(pid => pid !== peer.id);
              computeBody.innerHTML = '';
              if (others.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.textContent = 'なし';
                tr.appendChild(td);
                computeBody.appendChild(tr);
              } else {
                others.forEach(pid => {
                  const tr = document.createElement('tr');
                  const td = document.createElement('td');
                  td.textContent = pid;
                  tr.appendChild(td);
                  computeBody.appendChild(tr);
                });
              }
            });
          }, 5000);
        }
      });

      if (role === 'user') {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true });
        localV.srcObject = localStream;
        peer.on('call', call => {
          call.answer(localStream);
          call.on('stream', stream => { remoteV.srcObject = stream; });
        });
      } else {
        peer.on('call', async call => {
          const cams = await navigator.mediaDevices.enumerateDevices();
          const vc = cams.find(d => d.kind==='videoinput' && /VirtualCam|v4l2loopback/.test(d.label));
          if (!vc) return alert('仮想カメラが見つかりません');
          localStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: vc.deviceId } });
          localV.srcObject = localStream;
          call.answer(localStream);
          call.on('stream', stream => { remoteV.srcObject = stream; });
        });
      }
    };

    callBtn.onclick = () => {
      const other = peerIdIn.value.trim();
      if (!other) return;
      if (role === 'user') {
        const call = peer.call(other, localStream);
        call.on('stream', stream => { remoteV.srcObject = stream; });
      } else {
        alert('計算側はユーザーからの呼び出しを待ってください');
      }
    };
  </script>
</body>
</html>
