<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P 映像通話 (ライブ/スナップショット)</title>
  <style>
    body { font-family: sans-serif; }
    #controls { margin-bottom: 1em; }
    #modeSelect label { margin-right: 1em; }
    #status { color: blue; font-weight: bold; margin-left: 1em; }
    video { width: 320px; height: 240px; background: #000; }
  </style>
</head>
<body>
  <h1>映像通話 デモ (ライブ・スナップショット対応)</h1>
  <div id="controls">
    <!-- Mode selection radio buttons -->
    <div id="modeSelect">
      <label><input type="radio" name="mode" value="live" checked> ライブモード</label>
      <label><input type="radio" name="mode" value="snapshot"> スナップショットモード</label>
    </div>
    <!-- Snapshot capture button (enabled only in snapshot mode) -->
    <button id="captureBtn" disabled>撮影</button>
    <!-- Status text -->
    <span id="status"></span>
  </div>

  <!-- Video elements for local and remote streams -->
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>

  <!-- Include PeerJS library -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.0/dist/peerjs.min.js"></script>
  <script>
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const captureBtn = document.getElementById('captureBtn');
    const statusText = document.getElementById('status');
    const modeRadio = document.getElementsByName('mode');

    // PeerJS setup: connect to PeerServer
    const peer = new Peer(null, {
      host: 'YOUR_PEERJS_SERVER_HOST',  // replace with actual PeerServer info
      port: 9000,
      path: '/peerjs'
    });
    const PROCESSING_PEER_ID = "processor-node-1";  // The fixed ID of the Python processing peer

    let dataConn = null;
    let call = null;
    let currentMode = "live";

    // Get user camera stream
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => {
        // Show local preview
        localVideo.srcObject = stream;

        // When peer connection is open, initiate the call and data connection
        peer.on('open', id => {
          console.log("My peer ID:", id);
          // Connect data channel to processing peer
          dataConn = peer.connect(PROCESSING_PEER_ID);
          dataConn.on('open', () => {
            console.log('Data connection open');
            // Send initial mode (live by default)
            dataConn.send({ type: 'mode', value: currentMode });
          });
          dataConn.on('error', err => {
            console.error('Data connection error:', err);
          });
          // Initiate media call to processing peer with our camera stream
          call = peer.call(PROCESSING_PEER_ID, stream);
          // When the processed stream is received, display it
          call.on('stream', remoteStream => {
            remoteVideo.srcObject = remoteStream;
            statusText.textContent = "";  // Clear any status when video starts
          });
          call.on('error', err => {
            console.error('Call error:', err);
            statusText.textContent = "通話エラー: " + err;
          });
        });
      })
      .catch(err => {
        console.error("Camera access error:", err);
        statusText.textContent = "カメラの起動に失敗しました: " + err.message;
      });

    // Mode radio button change handler
    for (let radio of modeRadio) {
      radio.addEventListener('change', () => {
        if (radio.checked) {
          currentMode = radio.value;
          if (currentMode === "snapshot") {
            captureBtn.disabled = false;
            statusText.textContent = ""; // clear status
          } else { // live mode
            captureBtn.disabled = true;
            statusText.textContent = "ライブモード：映像をリアルタイム処理します";
          }
          // Notify server about mode change
          if (dataConn && dataConn.open) {
            dataConn.send({ type: 'mode', value: currentMode });
          }
        }
      });
    }

    // Capture button handler (for snapshot mode)
    captureBtn.addEventListener('click', () => {
      if (currentMode !== "snapshot" || !dataConn) return;
      // Send snapshot request to processing node
      statusText.textContent = "送信済み / 処理中...";
      dataConn.send({ type: 'snapshot' });
      // We will clear or update status when new frame arrives
      // (Alternatively, use a short timeout or remoteVideo event as an indicator)
      remoteVideo.onloadeddata = () => {
        // New frame likely loaded
        statusText.textContent = ""; // processing complete (clear status)
      };
    });
  </script>
</body>
</html>
