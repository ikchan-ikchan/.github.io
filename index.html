<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>モデル読み込みテスト</title>
  </head>
  <body>
    <h3>OpenCV.js モデル読み込みテスト</h3>
    <!-- OpenCV.js の読み込み -->
    <script async src="https://docs.opencv.org/4.x/opencv.js"
            onload="onOpenCvReady();"
            onerror="console.error('OpenCV.js の読み込みに失敗しました。');"></script>
    <script>
      // 同じディレクトリにモデルファイルがある場合
      const protoFile = 'pose_deploy_linevec.prototxt';
      const weightsFile = 'pose_iter_440000.caffemodel';
      
      function onOpenCvReady() {
        console.log('OpenCV.js is ready.');
        try {
          let net = cv.readNetFromCaffe(protoFile, weightsFile);
          if (!net.empty()) {
            console.log("ネットワークの読み込みに成功しました。");
          } else {
            console.error("ネットワークが空です。モデルファイルのパスや内容を確認してください。");
          }
        } catch (err) {
          console.error("ネットワークの読み込みエラー:", err);
        }
      }
    </script>
  </body>
</html>
