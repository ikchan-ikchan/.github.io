<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe Pose Demo</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #outputCanvas { border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>MediaPipe Pose を使ったランドマーク描画</h1>
  <p>動画を選択すると、人物のランドマーク点のみが描画されます。</p>

  <!-- 動画選択 -->
  <input type="file" id="videoInput" accept="video/*">
  <br><br>

  <!-- Video 要素は非表示にして、Canvas で描画 -->
  <video id="inputVideo" style="display:none;"></video>
  <canvas id="outputCanvas"></canvas>

  <!-- MediaPipe Pose ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script>
    (async function() {
      const videoElement = document.getElementById('inputVideo');
      const canvasElement = document.getElementById('outputCanvas');
      const canvasCtx = canvasElement.getContext('2d');

      // Pose インスタンスの初期化
      const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        smoothSegmentation: false,
        selfieMode: false
      });

      // 結果コールバック
      pose.onResults((results) => {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        if (results.poseLandmarks) {
          canvasCtx.fillStyle = 'red';
          for (const landmark of results.poseLandmarks) {
            const x = landmark.x * canvasElement.width;
            const y = landmark.y * canvasElement.height;
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
            canvasCtx.fill();
          }
        }
      });

      // ファイル選択時に動画を読み込んで再生開始
      document.getElementById('videoInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        videoElement.src = url;
        videoElement.play();
      });

      // 動画再生開始時に Canvas サイズを合わせて処理開始
      videoElement.onplaying = () => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        requestAnimationFrame(processFrame);
      };

      // 各フレームごとに Pose 解析を呼び出し
      function processFrame() {
        if (videoElement.paused || videoElement.ended) return;
        pose.send({ image: videoElement });
        requestAnimationFrame(processFrame);
      }
    })();
  </script>

  <!--
    GitHub Pages へのデプロイ方法:
    1. このファイルを index.html としてリポジトリのルートに配置します。
    2. GitHub 上でリポジトリの Settings > Pages を開き、Branch: main / folder: root を選択して保存。
    3. https://<your-username>.github.io/<repository-name>/ にアクセスして動作確認。
  -->
</body>
</html>
