<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MediaPipe Pose × Three.js IK Rig (動画ファイル入力版)</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #controls { position: absolute; top: 10px; left: 10px; z-index: 1; background: rgba(255,255,255,0.8); padding: 8px; border-radius: 4px; }
    #controls label, #controls input { font-size: 14px; }
    #video { display: none; }
  </style>
</head>
<body>
<div id="controls">
  <label>動画ファイル: <input type="file" id="videoInput" accept="video/*"></label>
</div>
<video id="video" autoplay muted playsinline></video>
<canvas id="threeCanvas"></canvas>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
<!-- Three IK -->
<script src="https://cdn.jsdelivr.net/npm/three-ik@3.0.3/build/three-ik.min.js"></script>
<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script>
(async function(){
  // Three.js クロック生成
  const clock = new THREE.Clock();{
  // DOM
  const video = document.getElementById('video');
  const fileInput = document.getElementById('videoInput');
  const canvas = document.getElementById('threeCanvas');

  // Three.js scene
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  const cam = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
  cam.position.set(0, 1.6, 3);
  const controls = new THREE.OrbitControls(cam, renderer.domElement);
  controls.target.set(0,1,0);
  controls.update();
  scene.add(new THREE.GridHelper(10,10));

  // Light
  scene.add(new THREE.HemisphereLight(0xffffff,0x444444));
  const dir = new THREE.DirectionalLight(0xffffff,0.8);
  dir.position.set(3,10,10);
  scene.add(dir);

  // IK setup
  const ik = new IK();
  scene.add(ik.getRootBone());

  function buildChain(jointNames) {
    const chain = new IKChain();
    let prev = chain.add(new IKJoint(new THREE.Bone(), { constraints: [] }));
    for (let i = 1; i < jointNames.length; i++) {
      const bone = new THREE.Bone();
      prev.bone.add(bone);
      prev = chain.add(new IKJoint(bone, { constraints: [] }));
    }
    ik.addChain(chain);
    return { chain, jointNames };
  }

  const chains = [];
  chains.push(buildChain(['left_shoulder','left_elbow','left_wrist']));
  chains.push(buildChain(['right_shoulder','right_elbow','right_wrist']));
  chains.push(buildChain(['left_hip','left_knee','left_ankle']));
  chains.push(buildChain(['right_hip','right_knee','right_ankle']));
  chains.push(buildChain(['nose','left_shoulder','right_shoulder']));

  // MediaPipe Pose init
  const pose = new Pose({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
  pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
  pose.onResults(onPoseResults);

  function onPoseResults(results) {
    const lm = results.poseLandmarks;
    if (!lm) return;
    chains.forEach(({chain,jointNames})=>{
      const last = jointNames[jointNames.length-1];
      const idx = Pose.POSE_LANDMARKS[last.toUpperCase()];
      const pt = lm[idx];
      if (pt) {
        const x = (pt.x - 0.5) * 2;
        const y = (0.5 - pt.y) * 2;
        const z = -pt.z;
        chain.getIKHelper().getTargets()[0].position.set(x, y, z);
      }
    });
    ik.solve();
  }

  function animate() {
    renderer.render(scene, cam);
    requestAnimationFrame(animate);
  }

  fileInput.onchange = () => {
    const file = fileInput.files[0];
    if (!file) return;
    video.src = URL.createObjectURL(file);
    video.onloadeddata = () => {
      initializePose();
      animate();
      (async function frameLoop() {
        await pose.send({image:video});
        requestAnimationFrame(frameLoop);
      })();
    };
  };
})();
</script>
</body>
</html>
