<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MediaPipe Pose: カメラ切替 & FPS指定 デモ</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video, canvas {
        display: block;
        margin: 10px auto;
        border: 1px solid #ccc;
      }
      #controls {
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: カメラ切替 & FPS指定 デモ</h2>
    
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="30" style="width:60px;">
      
      &nbsp;&nbsp;
      <button id="startButton">開始/再起動</button>
    </div>
    
    <!-- 映像表示用 -->
    <video id="video" width="640" height="480" autoplay muted playsinline></video>
    <!-- 描画用 Canvas -->
    <canvas id="canvas" width="640" height="480"></canvas>
    
    <!-- MediaPipe Pose 本体 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <!-- 描画用ユーティリティ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- カメラ管理用ユーティリティ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <script>
      // 各種 DOM の取得
      const videoElement = document.getElementById('video');
      const canvasElement = document.getElementById('canvas');
      const ctx = canvasElement.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const startButton = document.getElementById('startButton');

      let mpPose = null;
      let camera = null;

      // カメラの列挙（利用可能なビデオ入力デバイスをドロップダウンに表示）
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = "";
          videoDevices.forEach((device, idx) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `カメラ ${idx + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (err) {
          console.error('カメラ列挙エラー:', err);
        }
      }

      // MediaPipe Pose の初期化
      function initMediaPipePose() {
        mpPose = new Pose({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
          }
        });
        mpPose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          enableSegmentation: false,
          smoothSegmentation: false,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        // 検出結果を onResults で受け取り描画
        mpPose.onResults(onResults);
      }

      // onResults で検出結果の描画
      function onResults(results) {
        // Canvas をクリアし背景映像を描画
        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
          // キーポイントとスケルトンの基本描画
          window.drawLandmarks(ctx, results.poseLandmarks, { color: 'red', radius: 4 });
          window.drawConnectors(ctx, results.poseLandmarks, Pose.POSE_CONNECTIONS,
            { color: 'lime', lineWidth: 2 });
          
          // 体幹領域（トルソー）の描画
          // 左肩：11, 右肩：12, 左股関節：23, 右股関節：24
          const leftShoulder = results.poseLandmarks[11];
          const rightShoulder = results.poseLandmarks[12];
          const leftHip = results.poseLandmarks[23];
          const rightHip = results.poseLandmarks[24];
          
          if (leftShoulder && rightShoulder && leftHip && rightHip) {
            ctx.beginPath();
            ctx.moveTo(leftShoulder.x * canvasElement.width, leftShoulder.y * canvasElement.height);
            ctx.lineTo(rightShoulder.x * canvasElement.width, rightShoulder.y * canvasElement.height);
            ctx.lineTo(rightHip.x * canvasElement.width, rightHip.y * canvasElement.height);
            ctx.lineTo(leftHip.x * canvasElement.width, leftHip.y * canvasElement.height);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0, 0, 255, 0.2)';
            ctx.fill();
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 2;
            ctx.stroke();
          
            // 両肩の直線から体の向きを算出
            const dx = (rightShoulder.x - leftShoulder.x) * canvasElement.width;
            const dy = (rightShoulder.y - leftShoulder.y) * canvasElement.height;
            const angleRad = Math.atan2(dy, dx);
            const angleDeg = angleRad * (180 / Math.PI);
            ctx.font = "20px Arial";
            ctx.fillStyle = 'yellow';
            ctx.fillText(`向き: ${angleDeg.toFixed(1)}°`, 10, 30);
          }
        }
      }

      // カメラを起動（既存カメラがあれば停止してから再初期化）
      async function startCameraWithMediaPipe() {
        // 既存のストリームがあれば停止
        if (camera) {
          camera.stop();
        }
        const selectedDeviceId = cameraSelect.value;
        const desiredFps = parseInt(frameRateInput.value) || 30;
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: desiredFps }
          }
        };
        camera = new Camera(videoElement, {
          onFrame: async () => {
            await mpPose.send({ image: videoElement });
          },
          video: constraints.video
        });
        camera.start();
      }

      // 開始/再起動ボタン押下時の処理
      startButton.addEventListener('click', async () => {
        if (!mpPose) {
          initMediaPipePose();
        }
        await startCameraWithMediaPipe();
      });

      // ページ読み込み時にカメラを列挙
      enumerateCameras();
    </script>
  </body>
</html>
