<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC DataChannel Video Streaming</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: auto; }
    video { width: 100%; background: #000; margin-bottom: 1em; }
    textarea { width: 100%; height: 5em; }
    button { margin: .5em 0; padding: .5em 1em; }
  </style>
</head>
<body>
  <h1>WebRTC DataChannel Video Streaming</h1>

  <h2>ローカルプレビュー</h2>
  <video id="localVideo" autoplay muted playsinline></video>

  <h2>相手プレビュー</h2>
  <video id="remoteVideo" autoplay playsinline controls></video>

  <h3>シグナリング</h3>
  <p>１．「Create Offer」を押して Offer SDP を生成し、下欄テキストを相手に送信します。</p>
  <textarea id="offer" placeholder="Offer SDP will appear here"></textarea>
  <button id="createOffer">Create Offer</button>

  <p>２．相手から返ってきた Answer SDP を下欄にペーストし、「Set Answer」を押します。</p>
  <textarea id="answer" placeholder="Paste Answer SDP here"></textarea>
  <button id="setAnswer">Set Answer</button>

  <script>
    const pc = new RTCPeerConnection({
      iceServers: [ { urls: 'stun:stun.l.google.com:19302' } ]
    });
    let dc, mediaRecorder;
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const offerTextarea = document.getElementById('offer');
    const answerTextarea = document.getElementById('answer');

    // --- 1. 映像取得＆MediaRecorder 起動 ---
    async function startCapture() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = stream;
      startRecording(stream);
    }
    startCapture();

    function startRecording(stream) {
      // VP8/Opus コンテナで小さめのチャンクを定期生成
      mediaRecorder = new MediaRecorder(stream, {
        mimeType: 'video/webm; codecs=vp8,opus'
      });
      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0 && dc && dc.readyState === 'open') {
          // Blob をそのまま送信（binaryType=arraybuffer）
          e.data.arrayBuffer().then(buffer => dc.send(buffer));
        }
      };
      // 200ms ごとにチャンクを生成
      mediaRecorder.start(200);
    }

    // --- 2. DataChannel のセットアップ ---
    function setupDataChannel(channel) {
      dc = channel;
      dc.binaryType = 'arraybuffer';
      dc.onopen = () => console.log('DataChannel open');
      dc.onmessage = e => {
        appendToBuffer(new Uint8Array(e.data));
      };
    }

    // 呼び側が Offer を作る
    document.getElementById('createOffer').onclick = async () => {
      const channel = pc.createDataChannel('video');
      setupDataChannel(channel);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      offerTextarea.value = JSON.stringify(pc.localDescription);
    };

    // 受け側が DataChannel を受け取る
    pc.ondatachannel = event => {
      setupDataChannel(event.channel);
    };

    // Offer/Answer の流し込み
    document.getElementById('setAnswer').onclick = async () => {
      const answer = JSON.parse(answerTextarea.value);
      await pc.setRemoteDescription(answer);
    };

    // ICE candidate は本番ではシグナリング経由で送受信してください
    pc.onicecandidate = e => {
      if (e.candidate) {
        console.log('New ICE candidate:', e.candidate);
      }
    };

    // --- 3. MediaSource Extensions で再生 ---
    const mediaSource = new MediaSource();
    let sourceBuffer;
    const queue = [];
    remoteVideo.src = URL.createObjectURL(mediaSource);

    mediaSource.addEventListener('sourceopen', () => {
      sourceBuffer = mediaSource.addSourceBuffer('video/webm; codecs="vp8,opus"');
      sourceBuffer.mode = 'segments';
      sourceBuffer.addEventListener('updateend', () => {
        if (queue.length > 0 && !sourceBuffer.updating) {
          sourceBuffer.appendBuffer(queue.shift());
        }
      });
    });

    function appendToBuffer(chunk) {
      if (sourceBuffer && !sourceBuffer.updating) {
        sourceBuffer.appendBuffer(chunk);
      } else {
        queue.push(chunk);
      }
    }
  </script>
</body>
</html>
