<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>P2P ビデオ通話 - ジョイスティック制御版</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
    #video-area { display: flex; justify-content: center; align-items: center; margin: 15px; }
    video, img { background: #000; border: 2px solid #333; }
    #localVideo { width: 320px; height: 240px; margin: 5px; }
    #outputBox  { position: relative; width: 320px; height: 240px; margin: 5px; }
    #outputBox video, #outputBox img { width: 100%; height: 100%; object-fit: contain; }
    #joyBox { display: flex; flex-direction: column; align-items: center; margin: 0 15px; }
    #joyBox button { font-size: 16px; padding: 10px 22px; margin: 10px 0; cursor: pointer; }
    #vidCtrl { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,.6);
               padding: 4px; display: flex; gap: 4px; }
    #vidCtrl button { font-size: 12px; padding: 3px 8px; cursor: pointer; }
    #status { color: green; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>P2P ビデオ通話（ジョイスティック操作で静止画 / 動画送信）</h2>

  <div id="video-area">
    <video id="localVideo" autoplay muted playsinline></video>

    <!-- ジョイスティック操作をボタンで代用 -->
    <div id="joyBox">
      <button id="snapBtn">📸 上（静止画）</button>
      <button id="recBtn">🔴 下（長押し）</button>
    </div>

    <!-- 処理結果表示枠（静止画も動画も共通）-->
    <div id="outputBox">
      <img   id="outputImg"  alt="処理済み画像" style="display:none;">
      <video id="outputVid" playsinline style="display:none;"></video>

      <!-- 動画用カスタムコントロール -->
      <div id="vidCtrl" style="display:none;">
        <button id="playBtn">▶ 再生</button>
        <button id="stopBtn">■ 停止</button>
        <button id="loopBtn">ループ: いいえ</button>
      </div>
    </div>
  </div>

  <div id="status">カメラ初期化中…</div>

  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    /********* DOM 取得 *********/
    const localVideo  = document.getElementById('localVideo');
    const outputImg   = document.getElementById('outputImg');
    const outputVid   = document.getElementById('outputVid');
    const vidCtrl     = document.getElementById('vidCtrl');
    const playBtn     = document.getElementById('playBtn');
    const stopBtn     = document.getElementById('stopBtn');
    const loopBtn     = document.getElementById('loopBtn');
    const statusTxt   = document.getElementById('status');
    const snapBtn     = document.getElementById('snapBtn');
    const recBtn      = document.getElementById('recBtn');

    /********* グローバル状態 *********/
    let localStream = null;         // ユーザーのカメラ映像
    let peer = null;                // PeerJS インスタンス
    let conn = null;                // DataConnection
    let waitType = null;            // "image" | "video" | null
    let recording = false;          // 録画中フラグ
    let recTimeout = null;          // 30秒自動停止
    const videoType = "video/webm"; // 受信動画の MIME

    /********* カメラ取得 *********/
    navigator.mediaDevices.getUserMedia({ video:true, audio:false })
      .then(stream => {
        localStream = stream;
        localVideo.srcObject = stream;
        status("カメラ準備完了。接続中…");
        initPeer();
      })
      .catch(e => {
        err("カメラ取得失敗: "+e.message);
      });

    /********* PeerJS 初期化 *********/
    function initPeer(){
      peer = new Peer(null, { debug:1 });
      peer.on('open', id=>{
        console.log("自分の PeerID:", id);
        conn = peer.connect("compute123");   // 計算側ID
        conn.on('open', ()=> {
          status("計算側と接続しました");
          conn.on('data', onData);
        });
        conn.on('error', e=> err("接続エラー: "+e));
      });
      peer.on('error', e=> err("PeerJS エラー: "+e));
    }

    /********* ステータス表示 *********/
    function status(t){ statusTxt.style.color="green"; statusTxt.textContent=t; }
    function err(t){ statusTxt.style.color="red"; statusTxt.textContent=t; }

    /********* スナップ送信 *********/
    snapBtn.onclick = ()=> {
      if(!conn?.open) return;
      takeSnapshot();   // 静止画撮影＆送信
    };

    function takeSnapshot(){
      const [w,h] = getVideoSize();
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(localVideo,0,0,w,h);
      canvas.toBlob(blob=>{
        waitType="image";
        conn.send("SNAP");
        conn.send(blob);
        status("静止画を送信しました。処理待ち…");
      },'image/jpeg',0.8);
    }

    /********* 録画送信 *********/
    recBtn.addEventListener('pointerdown', ()=> {
      if(recording||!conn?.open) return;
      startRecord();
    });
    recBtn.addEventListener('pointerup', stopRecord);
    recBtn.addEventListener('pointerleave', stopRecord);

    function startRecord(){
      recording = true;
      status("録画開始（最大30秒）…");
      conn.send("VIDEO_START");
      captureLoop();
      recTimeout = setTimeout(stopRecord, 30000);
    }
    function stopRecord(){
      if(!recording) return;
      recording=false;
      clearTimeout(recTimeout);
      conn.send("VIDEO_END");
      waitType="video";
      status("録画終了。処理待ち…");
    }
    function captureLoop(){
      if(!recording) return;
      const [w,h] = getVideoSize();
      const cv = document.createElement('canvas');
      cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(localVideo,0,0,w,h);
      cv.toBlob(b=>{
        if(recording) conn.send(b);
      },'image/jpeg',0.7);
      setTimeout(captureLoop, 66); // 約15fps
    }

    /********* データ受信 *********/
    function onData(d){
      if(typeof d==="string"){
        if(d==="SNAP_RESULT")  waitType="image";
        else if(d==="VIDEO_RESULT") waitType="video";
        return;
      }
      // Blob/ArrayBuffer
      if(waitType==="image"){
        const blob = d instanceof Blob ? d : new Blob([d],{type:'image/jpeg'});
        showImage(blob);
      }else if(waitType==="video"){
        const blob = d instanceof Blob ? d : new Blob([d],{type:videoType});
        showVideo(blob);
      }
      waitType=null;
    }

    /********* 表示ヘルパ *********/
    function showImage(blob){
      outputVid.style.display="none"; outputVid.pause();
      vidCtrl.style.display="none";
      outputImg.style.display="block";
      outputImg.src = URL.createObjectURL(blob);
      status("処理済み静止画を表示中");
    }
    function showVideo(blob){
      outputImg.style.display="none";
      outputVid.style.display="block";
      outputVid.src = URL.createObjectURL(blob);
      outputVid.load();
      vidCtrl.style.display="flex";
      status("処理済み動画を受信。再生できます");
    }
    /********* カスタム動画コントロール *********/
    playBtn.onclick = ()=> outputVid.play();
    stopBtn.onclick = ()=> { outputVid.pause(); outputVid.currentTime=0; };
    loopBtn.onclick = ()=> {
      outputVid.loop = !outputVid.loop;
      loopBtn.textContent = "ループ: "+(outputVid.loop?"はい":"いいえ");
    };

    /********* 動画サイズ取得 *********/
    function getVideoSize(){
      const vSet = localStream.getVideoTracks()[0].getSettings();
      return [vSet.width||640, vSet.height||480];
    }
  </script>
</body>
</html>
