<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFC Read / Write</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      line-height: 1.6;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    .card {
      background: white;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button, select, textarea, input {
      font-size: 16px;
      margin-top: 8px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      box-sizing: border-box;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #eee;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>NFC Read / Write</h1>

  <div class="card">
    <h2>読み取り</h2>
    <button id="startScan">読み取り開始</button>
    <button id="stopScan" disabled>停止</button>
    <pre id="readOutput">まだ読み取っていません</pre>
  </div>

  <div class="card">
    <h2>書き込み</h2>

    <label>
      書き込む形式：
      <select id="writeType">
        <option value="text">テキスト</option>
        <option value="url">URL</option>
        <option value="json">JSON</option>
      </select>
    </label>

    <textarea id="writeData">こんにちは NFC</textarea>

    <label>
      <input type="checkbox" id="overwrite" checked>
      既存データを上書きする
    </label>

    <br>

    <button id="writeButton">タグに書き込む</button>

    <pre id="writeOutput">まだ書き込んでいません</pre>
  </div>

  <div class="card">
    <h2>注意</h2>
    <p>
      Android Chromeで開いてください。NFCをONにしてください。
      対応するのは基本的にNDEF形式のNFCタグです。
    </p>
  </div>

  <script>
    const readOutput = document.getElementById("readOutput");
    const writeOutput = document.getElementById("writeOutput");
    const startScanButton = document.getElementById("startScan");
    const stopScanButton = document.getElementById("stopScan");
    const writeButton = document.getElementById("writeButton");

    let abortController = null;

    function checkSupport() {
      if (!("NDEFReader" in window)) {
        const message = "このブラウザはWeb NFCに対応していません。Android版Chromeで開いてください。";
        readOutput.textContent = message;
        writeOutput.textContent = message;
        startScanButton.disabled = true;
        writeButton.disabled = true;
        return false;
      }
      return true;
    }

    function dataViewToHex(dataView) {
      if (!dataView) return "";
      const bytes = new Uint8Array(
        dataView.buffer,
        dataView.byteOffset,
        dataView.byteLength
      );
      return Array.from(bytes)
        .map(b => b.toString(16).padStart(2, "0").toUpperCase())
        .join(" ");
    }

    function decodeRecord(record) {
      if (!record.data) {
        return "(データなし)";
      }

      try {
        if (record.recordType === "text") {
          const decoder = new TextDecoder(record.encoding || "utf-8");
          return decoder.decode(record.data);
        }

        if (record.recordType === "url" || record.recordType === "absolute-url") {
          const decoder = new TextDecoder();
          return decoder.decode(record.data);
        }

        if (record.recordType === "mime") {
          const decoder = new TextDecoder();
          const text = decoder.decode(record.data);

          if (record.mediaType === "application/json") {
            return JSON.stringify(JSON.parse(text), null, 2);
          }

          return text;
        }

        const decoder = new TextDecoder();
        return decoder.decode(record.data);
      } catch (e) {
        return "デコード不可。HEX: " + dataViewToHex(record.data);
      }
    }

    startScanButton.addEventListener("click", async () => {
      if (!checkSupport()) return;

      try {
        abortController = new AbortController();

        const ndef = new NDEFReader();
        await ndef.scan({ signal: abortController.signal });

        startScanButton.disabled = true;
        stopScanButton.disabled = false;

        readOutput.textContent = "読み取り待機中。NFCタグをスマホの背面にかざしてください。";

        ndef.addEventListener("reading", event => {
          let text = "";

          text += "読み取り成功\n";
          text += "Serial Number: " + event.serialNumber + "\n";
          text += "Record数: " + event.message.records.length + "\n\n";

          event.message.records.forEach((record, index) => {
            text += "----- Record " + (index + 1) + " -----\n";
            text += "recordType: " + record.recordType + "\n";
            text += "mediaType: " + (record.mediaType || "") + "\n";
            text += "id: " + (record.id || "") + "\n";
            text += "encoding: " + (record.encoding || "") + "\n";
            text += "lang: " + (record.lang || "") + "\n";
            text += "data:\n" + decodeRecord(record) + "\n\n";
          });

          readOutput.textContent = text;
        });

        ndef.addEventListener("readingerror", () => {
          readOutput.textContent = "読み取りエラー。タグをもう一度かざしてください。";
        });

      } catch (error) {
        readOutput.textContent = "読み取り開始エラー:\n" + error;
      }
    });

    stopScanButton.addEventListener("click", () => {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }

      startScanButton.disabled = false;
      stopScanButton.disabled = true;
      readOutput.textContent += "\n\n読み取りを停止しました。";
    });

    writeButton.addEventListener("click", async () => {
      if (!checkSupport()) return;

      const type = document.getElementById("writeType").value;
      const data = document.getElementById("writeData").value;
      const overwrite = document.getElementById("overwrite").checked;

      if (!data.trim()) {
        writeOutput.textContent = "書き込む内容を入力してください。";
        return;
      }

      try {
        const ndef = new NDEFReader();

        writeOutput.textContent = "書き込み待機中。NFCタグをスマホの背面にかざしてください。";

        if (type === "text") {
          await ndef.write(data, { overwrite });
        }

        if (type === "url") {
          await ndef.write({
            records: [
              {
                recordType: "url",
                data: data
              }
            ]
          }, { overwrite });
        }

        if (type === "json") {
          const parsed = JSON.parse(data);
          const encoder = new TextEncoder();

          await ndef.write({
            records: [
              {
                recordType: "mime",
                mediaType: "application/json",
                data: encoder.encode(JSON.stringify(parsed))
              }
            ]
          }, { overwrite });
        }

        writeOutput.textContent = "書き込み成功";

      } catch (error) {
        writeOutput.textContent = "書き込みエラー:\n" + error;
      }
    });

    checkSupport();
  </script>
</body>
</html>
