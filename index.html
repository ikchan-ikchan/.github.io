<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Classroom Canvas (Supabase 無料版)</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#0b0c10;color:#e8ecf1;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.card{background:#12151b;border:1px solid #ffffff14;border-radius:12px;padding:12px;margin:12px 0}
button,input{background:#161a22;color:#e8ecf1;border:1px solid #ffffff26;border-radius:10px;padding:8px 10px}
button{cursor:pointer}
canvas{background:#fff;border-radius:12px;border:1px solid #00000022;width:100%;max-width:900px}
.hidden{display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #ffffff26;margin-left:6px;font-size:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <h2>クラス用キャンバス（Supabase 無料）<span id="badge" class="badge">init…</span></h2>

  <div class="card" id="roleCard">
    <p>役割を選択</p>
    <button id="asTeacher">先生</button>
    <button id="asStudent">生徒</button>
  </div>

  <div class="card hidden" id="teacherCard">
    <p>
      部屋名 <input id="roomName" placeholder="ex) class-2A-math" />
      <button id="startRoom">部屋を立ち上げ</button>
      <span id="roomInfo" class="badge">room: -</span>
    </p>
    <p>ベース（PDF/画像） <input type="file" id="baseFile" accept=".pdf,image/*" /></p>
    <canvas id="tCanvas" width="1280" height="720"></canvas>
    <p>
      <button id="penBtn">ペン</button>
      <button id="eraserBtn">消しゴム</button>
    </p>
  </div>

  <div class="card hidden" id="studentCard">
    <p>
      部屋名 <input id="joinName" placeholder="先生からの部屋名" />
      <button id="joinRoom">入室</button>
      <span id="joinInfo" class="badge">not joined</span>
    </p>
    <canvas id="sCanvas" width="1280" height="720"></canvas>
  </div>
</div>

<script>
/* ====== 1) Supabase 接続 ====== */
const SUPABASE_URL = "https://gskmzbuomlwzdrbaazaj.supabase.co";   // ← あなたのURL
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdza216YnVvbWx3emRyYmFhemFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwOTY0NDAsImV4cCI6MjA3NjY3MjQ0MH0.fvL6qrnPAavf5l9QjjUx-GBPsz3xjxHyBeY1YYXZlBo";            // ← あなたのanon key
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
document.getElementById('badge').textContent = 'connected';

/* ====== 2) 状態 ====== */
let role = null;
let room = null;
let channel = null;
let tool = 'pen';
let drawing = false;
const tCanvas = document.getElementById('tCanvas');
const sCanvas = document.getElementById('sCanvas');
const tctx = tCanvas.getContext('2d');
const sctx = sCanvas.getContext('2d');

/* ====== 3) 役割切替 ====== */
document.getElementById('asTeacher').onclick = () => {
  role = 'teacher';
  document.getElementById('roleCard').classList.add('hidden');
  document.getElementById('teacherCard').classList.remove('hidden');
};
document.getElementById('asStudent').onclick = () => {
  role = 'student';
  document.getElementById('roleCard').classList.add('hidden');
  document.getElementById('studentCard').classList.remove('hidden');
};

/* ====== 4) チャンネル接続 ====== */
async function joinChannel(r) {
  if (channel) await channel.unsubscribe();
  channel = sb.channel('room:'+r, { config: { broadcast: { ack: true } } });
  await channel.subscribe((status) => {
    // console.log('realtime status:', status);
  });
}

/* ====== 5) 先生フロー ====== */
document.getElementById('startRoom').onclick = async () => {
  const name = document.getElementById('roomName').value.trim();
  if (!name) return alert('部屋名を入力');
  room = name;
  document.getElementById('roomInfo').textContent = 'room: ' + room;
  await joinChannel(room);
  alert('部屋を立ち上げました（Supabase Realtime）');
};

document.getElementById('baseFile').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  if (!room) return alert('先に部屋を立ち上げてください');

  // ストレージへアップロード（rooms バケット / {room}/...）
  const filePath = `${room}/${Date.now()}-${file.name}`;
  const up = await sb.storage.from('rooms').upload(filePath, file, { upsert: true, cacheControl: '3600' });
  if (up.error) { alert('Upload error: ' + up.error.message); return; }
  const pub = sb.storage.from('rooms').getPublicUrl(filePath).data.publicUrl;

  // 表示（画像は直接 / PDFは簡易ラスタライズ）
  const isPDF = file.name.toLowerCase().endsWith('.pdf');
  if (!isPDF) {
    const img = new Image(); img.onload = () => {
      fitDraw(tctx, img, tCanvas);
    }; img.src = pub;
  } else {
    // PDFはブラウザの <embed> で描画したPNGを使う簡易法でもOKだが、
    // 最小構成としては「PDFはそのまま配布（URL共有）」にして、画像はCanvas表示にする。
    // ここでは教師キャンバスにも概要を置くため、埋め込み画像を生成せず、簡単なサムネ代替：
    tctx.fillStyle = '#fff'; tctx.fillRect(0,0,tCanvas.width,tCanvas.height);
    tctx.fillStyle = '#222'; tctx.fillText('PDF を配布中: ' + file.name, 20, 40);
  }

  // 生徒へベースURLを配信
  await channel.send({ type: 'broadcast', event: 'base', payload: { url: pub, name: file.name } });
};

// 描画ツール
document.getElementById('penBtn').onclick = () => tool = 'pen';
document.getElementById('eraserBtn').onclick = () => tool = 'eraser';

tCanvas.addEventListener('mousedown', (e) => { if (!room) return; drawing = true; drawPoint(tctx, e.offsetX, e.offsetY, tool); sendPoint(e.offsetX, e.offsetY, tool); });
tCanvas.addEventListener('mousemove', (e) => { if (!room || !drawing) return; drawPoint(tctx, e.offsetX, e.offsetY, tool); sendPoint(e.offsetX, e.offsetY, tool); });
['mouseup','mouseleave'].forEach(ev => tCanvas.addEventListener(ev, () => drawing = false));

function drawPoint(ctx, x, y, mode){
  ctx.save();
  if (mode === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill(); }
  else { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();
}
async function sendPoint(x, y, mode){
  await channel.send({ type: 'broadcast', event: 'draw', payload: { x, y, mode } });
}

/* ====== 6) 生徒フロー ====== */
document.getElementById('joinRoom').onclick = async () => {
  const name = document.getElementById('joinName').value.trim();
  if (!name) return alert('部屋名を入力');
  room = name;
  document.getElementById('joinInfo').textContent = 'joined: ' + room;
  await joinChannel(room);

  channel.on('broadcast', (msg) => {
    if (msg.event === 'base') {
      const { url, name } = msg.payload;
      const isPDF = (name||'').toLowerCase().endsWith('.pdf');
      if (!isPDF) {
        const img = new Image(); img.onload = () => { fitDraw(sctx, img, sCanvas); }; img.src = url;
      } else {
        sctx.fillStyle = '#fff'; sctx.fillRect(0,0,sCanvas.width,sCanvas.height);
        sctx.fillStyle = '#222'; sctx.fillText('PDF 受信: ' + name, 20, 40);
        // PDFはURLを開けば生徒がそのまま高画質で閲覧できます
        console.log('PDF URL:', url);
      }
    }
    if (msg.event === 'draw') {
      const { x, y, mode } = msg.payload;
      drawPoint(sctx, x, y, mode);
    }
  });
};

/* ====== 7) 共通：画像フィット描画 ====== */
function fitDraw(ctx, img, canvas){
  const r = Math.min(canvas.width / img.width, canvas.height / img.height);
  const w = img.width * r, h = img.height * r;
  const x = (canvas.width - w) / 2, y = (canvas.height - h) / 2;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img, x, y, w, h);
}
</script>
</body>
</html>
