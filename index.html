<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Virtual Camera Test</title>
</head>
<body>
  <h2>仮想カメラ取得テスト</h2>
  <p>カメラを選択：
    <select id="camSelect"></select>
    <button id="startBtn">開始</button>
  </p>
  <video id="video" autoplay playsinline style="width:640px; height:360px; background:#000"></video>

  <script>
    async function listCams() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      const sel = document.getElementById('camSelect');
      cams.forEach(c => {
        const o = document.createElement('option');
        o.value = c.deviceId;
        o.text = c.label || c.deviceId;
        sel.appendChild(o);
      });
    }

    async function startStream() {
      const sel = document.getElementById('camSelect');
      const vid = document.getElementById('video');
      if (window.stream) {
        window.stream.getTracks().forEach(t => t.stop());
      }
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: sel.value }
        });
        window.stream = s;
        vid.srcObject = s;
      } catch (e) {
        console.error(e);
        alert('カメラ取得に失敗しました: ' + e.message);
      }
    }

    document.getElementById('startBtn').onclick = startStream;
    listCams();
  </script>
</body>
</html>
