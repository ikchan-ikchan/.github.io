<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Classroom Canvas (Supabase 無料・RLS対応・PDF描画修正・座標ずれ解消)</title>
<style>
  :root{--bg:#0b0c10;--panel:#12151b;--ink:#e8ecf1;--muted:#9aa4b2}
  html,body{height:100%}
  body{margin:0;background:#0b0c10;color:var(--ink);font-family:system-ui,Segoe UI,Inter,Roboto,Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .card{background:var(--panel);border:1px solid #ffffff17;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .stack{display:flex;flex-direction:column;gap:8px}
  button,input{background:#161a22;color:var(--ink);border:1px solid #ffffff26;border-radius:10px;padding:8px 10px}
  button{cursor:pointer}
  button.primary{background:linear-gradient(180deg,#1f6feb,#3168ff);border-color:#2b5cff}
  button.ghost{background:transparent}
  canvas{background:#fff;border:1px solid #00000022;border-radius:12px;width:100%;max-width:920px;touch-action:none}
  .hidden{display:none}
  .badge{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:999px;border:1px solid #ffffff26;margin-left:6px;font-size:12px}
  .muted{color:var(--muted);font-size:12px}
  .toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .swatch{width:18px;height:18px;border-radius:6px;border:1px solid #ffffff33;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#111a;border:1px solid #ffffff2a;padding:8px 12px;border-radius:10px;display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.js" crossorigin="anonymous"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.worker.min.js';</script>
</head>
<body>
<div class="wrap">
  <h2>クラス用キャンバス（Supabase 無料）
    <span id="badge" class="badge">init…</span>
    <span id="roomPill" class="badge">room: -</span>
  </h2>

  <div class="card" id="roleCard">
    <div class="stack">
      <div class="row">
        <button id="asTeacher" class="primary">先生</button>
        <button id="asStudent" class="ghost">生徒</button>
        <span class="badge muted">バケット: <code>rooms</code>（Public）</span>
      </div>
      <div class="muted">※ 事前に Storage バケット <code>rooms</code> を作成し、SQLエディタで RLS ポリシー（select/insert/update）を追加してください。</div>
    </div>
  </div>

  <div class="card hidden" id="teacherCard">
    <div class="stack">
      <div class="row">
        <label>部屋名</label>
        <input id="roomName" placeholder="ex) class-2A-math"/>
        <button id="startRoom" class="primary">部屋を立ち上げ</button>
      </div>
      <div class="row">
        <input type="file" id="baseFile" accept=".pdf,image/*"/>
        <span class="muted">PDFは1ページ目をキャンバスに描画＆無劣化URLを配布、画像はフィット描画。</span>
      </div>
      <canvas id="tCanvas" width="1280" height="720"></canvas>
      <div class="toolrow">
        <button id="penBtn">ペン</button>
        <button id="eraserBtn">消しゴム</button>
        <label>太さ <input id="sizeRange" type="range" min="1" max="24" value="5"/></label>
        <label>滑らかさ <input id="smoothRange" type="range" min="0" max="0.9" step="0.05" value="0.5"/></label>
        <div class="swatch" data-color="#111" style="background:#111"></div>
        <div class="swatch" data-color="#e53935" style="background:#e53935"></div>
        <div class="swatch" data-color="#1e88e5" style="background:#1e88e5"></div>
        <div class="swatch" data-color="#43a047" style="background:#43a047"></div>
      </div>
    </div>
  </div>

  <div class="card hidden" id="studentCard">
    <div class="stack">
      <div class="row">
        <label>部屋名</label>
        <input id="joinName" placeholder="先生からの部屋名"/>
        <button id="joinRoom" class="primary">入室</button>
      </div>
      <canvas id="sCanvas" width="1280" height="720"></canvas>
      <div class="muted">PDF は無劣化URLでも閲覧可能（コンソールにURLを出力）。</div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/************ 1) Supabase 接続（必ず置換） ************/
const SUPABASE_URL = "https://gskmzbuomlwzdrbaazaj.supabase.co"; // ← あなたのURL
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdza216YnVvbWx3emRyYmFhemFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEwOTY0NDAsImV4cCI6MjA3NjY3MjQ0MH0.fvL6qrnPAavf5l9QjjUx-GBPsz3xjxHyBeY1YYXZlBo
";                    // ← あなたのanon key
const BUCKET = 'rooms';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const badge = document.getElementById('badge');
badge.textContent = 'connected';

/************ 2) DOM / State ************/
let role=null, room=null, roomSlug=null, channel=null;
let tool='pen', baseSize=5, smoothK=0.5, penColor='#111';
let drawing=false, stroke=[];
const tCanvas=document.getElementById('tCanvas');
const sCanvas=document.getElementById('sCanvas');
const tctx=tCanvas.getContext('2d');
const sctx=sCanvas.getContext('2d');
const roomPill=document.getElementById('roomPill');
const toastEl=document.getElementById('toast');
function toast(msg, ms=2200){ toastEl.textContent=msg; toastEl.style.display='block'; setTimeout(()=>toastEl.style.display='none', ms); }

/************ 3) サニタイズ（S3安全キー） ************/
function slugRoom(name){
  return String(name||'')
    .normalize('NFKC')
    .replace(/[\s/\\]+/g,'-')
    .replace(/[^\p{L}\p{N}_.-]+/gu,'-')
    .replace(/-+/g,'-').replace(/^-|-$/g,'')
    .toLowerCase() || 'room';
}
function safeFileName(name){
  const nk = String(name||'').normalize('NFKC');
  const idx = nk.lastIndexOf('.');
  let base = (idx>0? nk.slice(0,idx):nk)
    .replace(/\s+/g,'-')
    .replace(/[\\/#?\[\]*<>:"|%]+/g,'-')
    .replace(/[^\p{L}\p{N}_.-]+/gu,'-')
    .replace(/-+/g,'-').replace(/^-|-$/g,'');
  let ext = (idx>0? nk.slice(idx).toLowerCase():'').replace(/\s+/g,'');
  if(!/^\.[a-z0-9]{1,8}$/.test(ext)) ext='';
  if(!base) base='file';
  return base+ext;
}

/************ 4) 役割UI ************/
document.getElementById('asTeacher').onclick=()=>{role='teacher';toggleCards();};
document.getElementById('asStudent').onclick=()=>{role='student';toggleCards();};
function toggleCards(){
  document.getElementById('roleCard').classList.add('hidden');
  document.getElementById(role==='teacher'?'teacherCard':'studentCard').classList.remove('hidden');
}

/************ 5) Realtime ************/
async function joinChannel(r){
  if(channel) await channel.unsubscribe();
  channel = sb.channel('room:'+r,{config:{broadcast:{ack:true}}});
  await channel.subscribe();
}

/************ 6) 先生：部屋＆ファイル ************/
document.getElementById('startRoom').onclick = async ()=>{
  const name = document.getElementById('roomName').value.trim();
  if(!name) return alert('部屋名を入力');
  room = name; roomSlug = slugRoom(room);
  roomPill.textContent='room: '+roomSlug;
  await joinChannel(roomSlug);
  toast('部屋を立ち上げました');
};

document.getElementById('baseFile').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return; if(!roomSlug) return alert('先に部屋を立ち上げ');
  const safeName = safeFileName(file.name);
  const filePath = `${roomSlug}/${Date.now()}-${safeName}`;
  try{
    const up = await sb.storage.from(BUCKET).upload(filePath, file, { upsert:false });
    if(up.error){ toast('Upload error: '+up.error.message); return; }
    const pubUrl = sb.storage.from(BUCKET).getPublicUrl(filePath).data.publicUrl;
    if(/\.pdf$/i.test(safeName)){
      await renderPdfPageToCanvas(pubUrl, 1, tCanvas, tctx);
    } else {
      const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>fitDraw(tctx,img,tCanvas); img.src=pubUrl;
    }
    await channel.send({ type:'broadcast', event:'base', payload:{ url: pubUrl, name: safeName } });
    toast('共有しました');
  }catch(e){ console.error(e); toast('Failed to fetch: URL/KEY/HTTP配信を確認'); }
};

/************ 7) ペン/消しゴム：なめらか＆座標ずれ解消 ************/
function lerp(a,b,t){ return a + (b-a)*t; }
function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.hypot(dx,dy); }

// CSS px → Canvas px 変換（レスポンシブでも正確）
function canvasPointFromEvent(e, canvas){
  const r = canvas.getBoundingClientRect();
  const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
  const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
  const sx = canvas.width / r.width;
  const sy = canvas.height / r.height;
  return { x: cx * sx, y: cy * sy };
}

function drawSmoothStroke(ctx, pts, color, size){
  if(pts.length<2){ const p=pts[0]; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p.x,p.y,size/2,0,Math.PI*2); ctx.fill(); return; }
  ctx.save(); ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=color; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1]||pts[i];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2]||p2;
    const cp1x = p1.x + (p2.x - p0.x)/6;
    const cp1y = p1.y + (p2.y - p0.y)/6;
    const cp2x = p2.x - (p3.x - p1.x)/6;
    const cp2y = p2.y - (p3.y - p1.y)/6;
    if(i===0) ctx.moveTo(p1.x, p1.y);
    const sp = Math.max(0.001, (p2.t - p1.t));
    const v = dist(p1,p2) / sp;
    const w1 = Math.max(1, size * (1/(1+v*0.6)) * (p1.p||1));
    const w2 = Math.max(1, size * (1/(1+v*0.6)) * (p2.p||1));
    ctx.lineWidth = (w1+w2)/2;
    ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,p2.x,p2.y);
  }
  ctx.stroke();
  ctx.restore();
}
function drawEraser(ctx, from, to, radius){
  ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='rgba(0,0,0,1)'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=radius*2; ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y); ctx.stroke(); ctx.restore();
}

function bindBetterDrawing(canvas, ctx, isTeacher){
  let last=null; let rafId=null; let localPts=[]; 
  const send = ()=>{ if(!channel||!isTeacher||localPts.length===0) return; const batch=localPts; localPts=[]; channel.send({type:'broadcast',event:'draw',payload:{pts:batch}}); };

  const start = (e)=>{ if(!roomSlug) return; drawing=true; stroke=[]; last=null; handle(e); e.preventDefault(); };
  const move  = (e)=>{ if(!drawing) return; handle(e); e.preventDefault(); };
  const end   = ()=>{ drawing=false; send(); };

  function handle(e){
    const ptAbs = canvasPointFromEvent(e, canvas);
    const now = performance.now();
    const pVal = (e.pressure && e.pressure>0? e.pressure: 0.7);
    const pt = {x:ptAbs.x, y:ptAbs.y, t:now, p:pVal};
    if(last){
      const d = dist(last, pt); const step = Math.max(1, 1+Math.floor(d * (1-smoothK)));
      for(let i=1;i<=step;i++){
        const t=i/step; stroke.push({x:lerp(last.x,pt.x,t), y:lerp(last.y,pt.y,t), t:lerp(last.t,pt.t,t), p:lerp(last.p,pt.p,t)});
      }
      if(tool==='eraser'){
        drawEraser(ctx, last, pt, baseSize*1.2);
      } else {
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(()=>{ drawSmoothStroke(ctx, stroke.slice(-Math.max(6, step*2)), penColor, baseSize); });
      }
    } else {
      stroke.push(pt);
    }
    last = pt; localPts.push({x:pt.x,y:pt.y,mode:tool,size:baseSize,color:penColor,t:pt.t,p:pt.p}); if(localPts.length>64) send();
  }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove',  move,  {passive:false});
  window.addEventListener('touchend',   end);
}

bindBetterDrawing(tCanvas, tctx, true);

// UI調整
['penBtn','eraserBtn'].forEach(id=>document.getElementById(id).onclick=()=>{ tool=(id==='eraserBtn'?'eraser':'pen'); });
document.getElementById('sizeRange').oninput=(e)=> baseSize=+e.target.value;
document.getElementById('smoothRange').oninput=(e)=> smoothK=+e.target.value;
Array.from(document.querySelectorAll('.swatch')).forEach(el=> el.addEventListener('click',()=>{ penColor = el.dataset.color; }));

/************ 8) 生徒受信 ************/
document.getElementById('joinRoom').onclick = async ()=>{
  const name = document.getElementById('joinName').value.trim(); if(!name) return alert('部屋名を入力');
  room = name; roomSlug = slugRoom(room); roomPill.textContent='room: '+roomSlug;
  await joinChannel(roomSlug);
  channel.on('broadcast',(msg)=>{
    if(msg.event==='base'){
      const {url,name} = msg.payload||{};
      if(/\.pdf$/i.test(name||'')){
        renderPdfPageToCanvas(url, 1, sCanvas, sctx);
        console.log('PDF URL:', url);
      } else {
        const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>fitDraw(sctx,img,sCanvas); img.src=url;
      }
    }
    if(msg.event==='draw'){
      const pts=(msg.payload&&msg.payload.pts)||[];
      const chunk=[]; let last=null;
      for(const p of pts){
        if(last){ const d=dist(last,p); const step=Math.max(1, 1+Math.floor(d*(1-smoothK))); for(let i=1;i<=step;i++){ const t=i/step; chunk.push({x:lerp(last.x,p.x,t), y:lerp(last.y,p.y,t), t:lerp(last.t||0,p.t||0,t), p:lerp(last.p||1,p.p||1,t)}); } }
        else { chunk.push({x:p.x,y:p.y,t:p.t||0,p:p.p||1}); }
        last=p;
      }
      if((pts[0]||{}).mode==='eraser'){
        for(let i=1;i<chunk.length;i++){ drawEraser(sctx, chunk[i-1], chunk[i], (pts[0].size||baseSize)*1.2); }
      } else {
        drawSmoothStroke(sctx, chunk, (pts[0]&&pts[0].color)||penColor, (pts[0]&&pts[0].size)||baseSize);
      }
    }
  });
  toast('入室しました');
};

/************ 9) 画像フィット / PDF描画 ************/
function fitDraw(ctx,img,canvas){
  const r=Math.min(canvas.width/img.width, canvas.height/img.height);
  const w=img.width*r, h=img.height*r; const x=(canvas.width-w)/2, y=(canvas.height-h)/2;
  ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,x,y,w,h);
}
async function renderPdfPageToCanvas(url, pageNum, canvas, ctx){
  try{
    const doc=await pdfjsLib.getDocument(url).promise; const page=await doc.getPage(pageNum);
    const viewport=page.getViewport({scale:1});
    const scale=Math.min(canvas.width/viewport.width, canvas.height/viewport.height);
    const v2=page.getViewport({scale});
    const tmp=document.createElement('canvas'); tmp.width=v2.width; tmp.height=v2.height;
    await page.render({canvasContext: tmp.getContext('2d'), viewport:v2}).promise;
    const x=(canvas.width-v2.width)/2, y=(canvas.height-v2.height)/2; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(tmp,x,y);
  }catch(err){ console.error('PDF render error', err); }
}
</script>
</body>
</html>
