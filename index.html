<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + ジョイスティック + 双方向録画ストリーミング</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    /* ----- レイアウト (前バージョンと同じ) ----- */
    body{font-family:sans-serif;text-align:center;margin:0;padding:0}
    #mediaArea{display:grid;grid-gap:10px;padding:10px}
    #localVideo,#remoteVideo{width:100%;height:auto;background:#000}
    #joystick{box-sizing:border-box;width:60px;height:240px;margin:auto;position:relative;border:4px solid #000;border-radius:30px;background:#fff;touch-action:none;overscroll-behavior:contain}
    #knob{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:#000;transform:translate(-50%,-50%);transition:transform .15s;pointer-events:none}
    #joystickState{font-weight:bold;margin-top:4px}
    #controls{padding:10px} #controls select,#controls input,#controls button{margin:4px}
    #log{white-space:pre-wrap;background:#f7f7f7;padding:8px;margin:8px;text-align:left;height:120px;overflow-y:auto;font-size:.9em}
    @media(orientation:portrait){#mediaArea{grid-template-columns:1fr auto;grid-template-rows:auto auto;grid-template-areas:"localVideo joystick""remoteVideo joystick";align-items:center;height:calc(100vh - 200px)}#localVideo{grid-area:localVideo}#remoteVideo{grid-area:remoteVideo}#joystick{grid-area:joystick}}
    @media(orientation:landscape){#mediaArea{grid-template-columns:1fr auto 1fr;grid-template-rows:auto;grid-template-areas:"localVideo joystick remoteVideo";align-items:center;height:calc(100vh - 200px)}#localVideo{grid-area:localVideo}#remoteVideo{grid-area:remoteVideo}#joystick{grid-area:joystick}}
  </style>
</head>
<body>
<h1>WebRTC P2P + ジョイスティック + 録画ストリーミング</h1>

<div id="mediaArea">
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline controls></video>
  <div id="joystick"><div id="knob"></div></div>
</div>
<div id="joystickState">中心</div>
<hr/>

<div id="controls">
  <p>自分のID: <span id="myId">―</span></p>

  <!-- ユーザーモード -->
  <div id="userControls">
    <label>カメラ選択:
      <select id="videoSource"></select>
    </label>
    <button id="startCamera">カメラ開始</button>
    <input type="text" id="targetId" placeholder="相手のIDを入力" />
    <button id="connectBtn">接続</button>
  </div>

  <!-- 計算ノード -->
  <div id="computeControls" style="display:none;">
    <p id="computeMsg">計算ノードモード：Unity カメラ検出中…</p>
    <div id="fallbackUI" style="display:none;">
      <label>カメラ手動選択:
        <select id="computeVideoSel"></select>
      </label>
      <button id="retryBtn">再検出</button>
      <button id="computeStartBtn">このカメラで開始</button>
    </div>
  </div>

  <button id="recordBtn" disabled>録画 開始</button>
</div>

<h3>ログ</h3>
<div id="log">[INFO] ページ読み込み完了</div>

<script>
/* =============== 共通ユーティリティ =============== */
const qs=id=>document.getElementById(id);
const params = new URLSearchParams(location.search);
const isCompute = params.get('role') === 'compute';
function log(t){console.log(t);qs('log').textContent+='\n'+t;qs('log').scrollTop=qs('log').scrollHeight;}

/* =============== DOM 参照 =============== */
const localVideo=qs('localVideo'),remoteVideo=qs('remoteVideo');
const joy=qs('joystick'),knob=qs('knob'),stateDiv=qs('joystickState');
const userControls=qs('userControls'),computeControls=qs('computeControls');
const videoSel=qs('videoSource'),startBtn=qs('startCamera');
const tgtInput=qs('targetId'),connBtn=qs('connectBtn'),recBtn=qs('recordBtn');

/* =============== PeerJS =============== */
const peer=new Peer();
peer.on('open',id=>{qs('myId').textContent=id;log('[INFO] Peer open: '+id);});
peer.on('error',e=>log('[ERROR] Peer: '+e));

/* =============== DataChannel =============== */
let dataConn=null;
let recvBuf=[],recvType='';

function setupDataChannel(c){
  dataConn=c;
  c.on('open',()=>log('[INFO] DataChannel open'));
  c.on('error',e=>log('[ERROR] DC: '+e));
  c.on('data',d=>{
    if(d instanceof ArrayBuffer){recvBuf.push(d);log('[INFO] chunk '+d.byteLength);}
    else if(d?.type==='file-info'){recvType=d.fileType;recvBuf=[];log('[INFO] file-info '+recvType);}
    else if(d?.type==='stop'){
      const blob=new Blob(recvBuf,{type:recvType});
      remoteVideo.src=URL.createObjectURL(blob);
      log('[INFO] 完了 '+blob.size+' bytes');
    }else if(d?.type==='joystick'){setKnobPos(d.value);}
  });
}

/* =============== ジョイスティック =============== */
function setLabel(v){stateDiv.textContent=v<-0.5?'上':v>0.5?'下':'中心';}
function sendJoy(v){dataConn?.open&&dataConn.send({type:'joystick',value:v});}
function setKnobPos(v){
  const r=joy.getBoundingClientRect(),max=r.height/2-knob.offsetHeight/2;
  const y=Math.max(-max,Math.min(max,v*max));
  knob.style.transform=`translate(-50%,calc(-50%+${y}px))`;
  setLabel(v);
}

/* drag on user side */
if(!isCompute){
  let drag=false,r,max;
  joy.addEventListener('pointerdown',e=>{
    drag=true;r=joy.getBoundingClientRect();max=r.height/2-knob.offsetHeight/2;
    joy.setPointerCapture(e.pointerId);move(e);
  },{passive:false});
  joy.addEventListener('pointermove',e=>drag&&move(e),{passive:false});
  joy.addEventListener('pointerup',()=>{drag=false;reset();},{passive:false});
  function move(e){
    const y=e.clientY-(r.top+r.height/2);
    knob.style.transform=`translate(-50%,calc(-50%+${Math.max(-max,Math.min(max,y))}px))`;
    const v=y/max;setLabel(v);sendJoy(v);
  }
  function reset(){knob.style.transform='translate(-50%,-50%)';setLabel(0);sendJoy(0);}
}

/* =============== MediaRecorder =============== */
let recorder=null,pending=0,stopped=false;
function setupRecorder(stream){
  recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5_000_000});
  const SLICE=1000;
  recorder.ondataavailable=async e=>{
    if(!e.data.size) return;
    pending++;
    const buf=await e.data.arrayBuffer();
    dataConn.send(buf);
    pending--;
    if(stopped&&pending===0){dataConn.send({type:'stop'});stopped=false;}
  };
  recorder.onstart=()=>{dataConn.send({type:'file-info',fileType:recorder.mimeType});log('[INFO] record start');};
  recorder.onstop=()=>{stopped=true;if(pending===0){dataConn.send({type:'stop'});stopped=false;}};
  recBtn.disabled=false;
}

/* =============== ユーザーモード =============== */
if(!isCompute){
  computeControls.style.display='none';
  navigator.mediaDevices.enumerateDevices().then(devs=>{
    devs.filter(d=>d.kind==='videoinput').forEach(d=>{
      const o=document.createElement('option');o.value=d.deviceId;o.text=d.label||d.deviceId;
      videoSel.appendChild(o);});
  });
  startBtn.onclick=()=>{
    const id=videoSel.value;if(!id){log('[ERR] no cam');return;}
    navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id},width:1920,height:1080},audio:true})
      .then(s=>{localVideo.srcObject=s;setupRecorder(s);log('[INFO] cam start');})
      .catch(e=>log('[ERR] gUM '+e.message));
  };
  connBtn.onclick=()=>{const t=tgtInput.value.trim();if(!t){log('[ERR] ID');return;}
    setupDataChannel(peer.connect(t));};
}

/* =============== 計算ノードモード (Unity カメラ再試行付) =============== */
if(isCompute){
  userControls.style.display='none';computeControls.style.display='block';
  const msg=qs('computeMsg'),fb=qs('fallbackUI'),sel=qs('computeVideoSel');
  async function waitUnity(max=6,iv=1500){
    for(let i=0;i<max;i++){
      const cam=(await navigator.mediaDevices.enumerateDevices())
        .find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
      if(cam) return cam;
      await new Promise(r=>setTimeout(r,iv));
    } return null;
  }
  function fillList(){sel.innerHTML='';navigator.mediaDevices.enumerateDevices()
    .then(d=>d.filter(x=>x.kind==='videoinput').forEach(x=>{
      const o=document.createElement('option');o.value=x.deviceId;o.text=x.label||x.deviceId;sel.appendChild(o);}));}
  async function startCam(id){
    try{
      const s=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id},width:1920,height:1080},audio:true});
      localVideo.srcObject=s;setupRecorder(s);msg.textContent='カメラ起動';fb.style.display='none';
    }catch(e){log('[ERR] cam '+e.message);}
  }
  (async ()=>{const cam=await waitUnity();if(cam)startCam(cam.deviceId);else{msg.textContent='Unity カメラ無し';fb.style.display='block';fillList();}})();
  navigator.mediaDevices.ondevicechange=async ()=>{
    if(localVideo.srcObject) return;
    const cam=(await navigator.mediaDevices.enumerateDevices())
      .find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
    if(cam) startCam(cam.deviceId);
  };
  qs('retryBtn').onclick=async ()=>{fb.style.display='none';msg.textContent='再検出…';
    const cam=await waitUnity(5,1000);if(cam)startCam(cam.deviceId);else{msg.textContent='手動選択を使用';fb.style.display='block';fillList();}};
  qs('computeStartBtn').onclick=()=>startCam(sel.value);
  peer.on('connection',c=>setupDataChannel(c));
}

/* =============== 録画ボタン =============== */
recBtn.onclick=()=>{
  if(!recorder){log('[ERR] no recorder');return;}
  if(!dataConn||!dataConn.open){log('[ERR] 接続なし');return;}
  if(recorder.state==='inactive'){recorder.start(1000);recBtn.textContent='録画 停止';}
  else{recorder.stop();recBtn.textContent='録画 開始';}
};
</script>
</body>
</html>
