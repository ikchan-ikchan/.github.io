<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 記録＆3D描画デモ</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video, canvas {
        display: block;
        margin: 10px auto;
      }
      #controls {
        margin: 10px;
      }
      #maxResolutionInfo, #poseCoordinates {
        margin-top: 5px;
        font-size: 0.9em;
        color: #555;
      }
      table {
        margin: auto;
        border-collapse: collapse;
      }
      table, th, td {
        border: 1px solid #aaa;
        padding: 4px;
      }
      /* 3D描画用コンテナ */
      #threejsContainer {
        width: 400px;
        height: 300px;
        margin: 20px auto;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 記録＆3D描画デモ</h2>
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
      &nbsp;&nbsp;
      <label for="resPercentInput">解像度 (%):</label>
      <input type="number" id="resPercentInput" min="1" max="100" value="100" style="width:60px;">
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
      &nbsp;&nbsp;
      <button id="captureButton">記録</button>
      <div id="maxResolutionInfo"></div>
    </div>
    
    <!-- カメラ映像（内部利用：Canvas に描画するため非表示） -->
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <!-- 描画用キャンバス -->
    <canvas id="outputCanvas"></canvas>
    <!-- 座標表示（テーブル） -->
    <div id="poseCoordinates"></div>
    <!-- 3D描画用コンテナ -->
    <div id="threejsContainer"></div>
    
    <!-- MediaPipe Pose と Drawing Utils の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- Three.js の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    
    <script>
      // ここでPOSE_CONNECTIONSを定義します
      const POSE_CONNECTIONS = [
        [0, 1],
        [1, 2], [2, 3], [3, 7],
        [0, 4],
        [4, 5], [5, 6], [6, 8],
        [9, 10],
        [11, 12],
        [11, 13], [13, 15], [15, 17], [15, 19], [15, 21],
        [17, 19],
        [12, 14], [14, 16], [16, 18], [16, 20], [16, 22],
        [18, 20],
        [11, 23], [12, 24],
        [23, 24], [23, 25], [24, 26],
        [25, 27], [26, 28]
      ];
      
      const video = document.getElementById('video');
      const outputCanvas = document.getElementById('outputCanvas');
      const canvasCtx = outputCanvas.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const resPercentInput = document.getElementById('resPercentInput');
      const startButton = document.getElementById('startButton');
      const captureButton = document.getElementById('captureButton');
      const maxResolutionInfo = document.getElementById('maxResolutionInfo');
      const poseCoordinatesDiv = document.getElementById('poseCoordinates');
      const threejsContainer = document.getElementById('threejsContainer');
      
      let pose = null;
      let processingLoopId = null;
      let latestResults = null;
      
      // ① 利用可能なカメラを列挙する
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `カメラ ${index + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (error) {
          console.error('カメラの列挙に失敗:', error);
        }
      }
      
      // ② MediaPipe Pose の初期化
      function initializePose() {
        pose = new Pose({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
          }
        });
        pose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        // onResults で描画および最新結果の保存
        pose.onResults((results) => {
          latestResults = results;
          canvasCtx.save();
          canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
          canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
          if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: 'lime', lineWidth: 2 });
            drawLandmarks(canvasCtx, results.poseLandmarks, { color: 'red', lineWidth: 1 });
          }
          canvasCtx.restore();
        });
      }
      
      // ③ 選択したカメラで、最大解像度の何％かを指定して映像を取得する
      async function startCamera() {
        const selectedDeviceId = cameraSelect.value;
        const tempConstraints = { video: { deviceId: { exact: selectedDeviceId } } };
        let tempStream;
        try {
          tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
        } catch (error) {
          console.error('初回ストリームの取得に失敗:', error);
          return;
        }
        const videoTrack = tempStream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        let maxWidth = (capabilities.width && capabilities.width.max) || 640;
        let maxHeight = (capabilities.height && capabilities.height.max) || 480;
        maxResolutionInfo.innerText = `このカメラの最大解像度: ${maxWidth} x ${maxHeight}`;
        tempStream.getTracks().forEach(track => track.stop());
        
        const resPercent = parseInt(resPercentInput.value) || 100;
        const desiredWidth = Math.floor(maxWidth * (resPercent / 100));
        const desiredHeight = Math.floor(maxHeight * (resPercent / 100));
        const frameRate = parseInt(frameRateInput.value) || 15;
        
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { exact: desiredWidth },
            height: { exact: desiredHeight },
            frameRate: { ideal: frameRate }
          }
        };
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          return new Promise(resolve => {
            video.onloadedmetadata = () => {
              outputCanvas.width = video.videoWidth;
              outputCanvas.height = video.videoHeight;
              video.play();
              resolve();
            };
          });
        } catch (error) {
          console.error('カメラ映像の取得に失敗:', error);
        }
      }
      
      // ④ 映像フレームを MediaPipe Pose に送信するループ
      async function processVideo() {
        const frameRate = parseInt(frameRateInput.value) || 15;
        const interval = 1000 / frameRate;
        async function sendFrame() {
          if (!video.paused && !video.ended) {
            await pose.send({ image: video });
          }
          processingLoopId = setTimeout(sendFrame, interval);
        }
        sendFrame();
      }
      
      // ⑤ 「開始」ボタン押下時の処理：カメラ起動、Pose 初期化、ループ開始
      startButton.addEventListener('click', async () => {
        await startCamera();
        initializePose();
        processVideo();
      });
      
      // ⑥ 「記録」ボタン押下時の処理：ループ停止、座標テーブルと3D描画を実行
      captureButton.addEventListener('click', () => {
        clearTimeout(processingLoopId);
        if (latestResults && latestResults.poseLandmarks) {
          let html = '<h3>記録された座標 (x, y, z)</h3>';
          html += '<table>';
          html += '<tr><th>Index</th><th>x</th><th>y</th><th>z</th></tr>';
          latestResults.poseLandmarks.forEach((landmark, index) => {
            html += `<tr>
                        <td>${index}</td>
                        <td>${landmark.x.toFixed(3)}</td>
                        <td>${landmark.y.toFixed(3)}</td>
                        <td>${landmark.z.toFixed(3)}</td>
                     </tr>`;
          });
          html += '</table>';
          poseCoordinatesDiv.innerHTML = html;
          update3DPlot(latestResults.poseLandmarks);
        } else {
          poseCoordinatesDiv.innerHTML = '<p>まだポーズが検出されていません。</p>';
        }
      });
      
      // ⑦ Three.js を使って 3D 描画する関数
      function update3DPlot(landmarks) {
        while (threejsContainer.firstChild) {
          threejsContainer.removeChild(threejsContainer.firstChild);
        }
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera3D = new THREE.PerspectiveCamera(45, threejsContainer.clientWidth / threejsContainer.clientHeight, 0.1, 1000);
        camera3D.position.set(0, 0, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(threejsContainer.clientWidth, threejsContainer.clientHeight);
        threejsContainer.appendChild(renderer.domElement);
        
        const axesHelper = new THREE.AxesHelper(1.5);
        scene.add(axesHelper);
        
        const landmarkGroup = new THREE.Group();
        const scaleFactor = 10;
        const sphereGeometry = new THREE.SphereGeometry(0.05, 16, 16);
        const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const points = [];
        landmarks.forEach(landmark => {
          const x = (landmark.x - 0.5) * scaleFactor;
          const y = -(landmark.y - 0.5) * scaleFactor;
          const z = -landmark.z * scaleFactor;
          const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
          sphere.position.set(x, y, z);
          landmarkGroup.add(sphere);
          points.push(new THREE.Vector3(x, y, z));
        });
        scene.add(landmarkGroup);
        
        // ランドマーク間の接続を、先ほど定義した POSE_CONNECTIONS を利用して描画
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00 });
        POSE_CONNECTIONS.forEach(pair => {
          const idx1 = pair[0], idx2 = pair[1];
          if (landmarks[idx1] && landmarks[idx2]) {
            const geometry = new THREE.BufferGeometry().setFromPoints([points[idx1], points[idx2]]);
            const line = new THREE.Line(geometry, lineMaterial);
            scene.add(line);
          }
        });
        
        renderer.render(scene, camera3D);
      }
      
      enumerateCameras();
    </script>
  </body>
</html>
