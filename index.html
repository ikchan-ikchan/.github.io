<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>1コマだけ検出デモ (Pose + BodyPix + Plotly.js)</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video, canvas { display: block; margin: 10px auto; }
    #controls { margin: 10px; }
    #maxResolutionInfo, #poseCoordinates { margin-top: 5px; font-size: 0.9em; color: #555; }
    table { margin: auto; border-collapse: collapse; }
    table, th, td { border: 1px solid #aaa; padding: 4px; }
    #plotly3d { width: 640px; height: 300px; margin: 10px auto; }
  </style>
</head>
<body>
  <h2>記録ボタンで1コマのみ処理 デモ</h2>
  <div id="controls">
    <label>カメラ:</label>
    <select id="cameraSelect"></select>
    &nbsp;<label>fps:</label>
    <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
    &nbsp;<label>解像度%:</label>
    <input type="number" id="resPercentInput" min="1" max="100" value="100" style="width:60px;">
    &nbsp;<button id="startButton">開始</button>
    &nbsp;<button id="captureButton">記録</button>
    <div id="maxResolutionInfo"></div>
  </div>

  <video id="video" autoplay muted playsinline style="display:none;"></video>
  <canvas id="outputCanvas"></canvas>

  <div id="poseCoordinates"></div>
  <div id="plotly3d"></div>

  <!-- ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <script>
    const video       = document.getElementById('video');
    const outputCanvas= document.getElementById('outputCanvas');
    const ctx         = outputCanvas.getContext('2d');
    const cameraSelect= document.getElementById('cameraSelect');
    const frameRateIn = document.getElementById('frameRateInput');
    const resPercentIn= document.getElementById('resPercentInput');
    const startBtn    = document.getElementById('startButton');
    const captureBtn  = document.getElementById('captureButton');
    const maxResInfo  = document.getElementById('maxResolutionInfo');
    const poseDiv     = document.getElementById('poseCoordinates');

    let pose, bodyPixModel;

    // カメラ列挙
    async function enumerateCameras(){
      const devices = await navigator.mediaDevices.enumerateDevices();
      devices.filter(d=>d.kind==='videoinput')
             .forEach((d,i)=> cameraSelect.innerHTML+=
               `<option value="${d.deviceId}">${d.label||'Camera '+(i+1)}</option>`
             );
    }

    // MediaPipe Pose 初期化
    function initPose(){
      pose = new Pose({ locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
      pose.setOptions({
        modelComplexity:1, smoothLandmarks:true,
        minDetectionConfidence:0.5, minTrackingConfidence:0.5
      });
    }

    // カメラ起動
    async function startCamera(){
      const deviceId = cameraSelect.value;
      // 一時取得→capabilities→停止
      let tmp = await navigator.mediaDevices.getUserMedia({video:{deviceId}});
      const track= tmp.getVideoTracks()[0];
      const caps = track.getCapabilities();
      tmp.getTracks().forEach(t=>t.stop());
      const maxW = caps.width?.max||640, maxH = caps.height?.max||480;
      maxResInfo.innerText = `最大解像度: ${maxW}×${maxH}`;

      const p = parseInt(resPercentIn.value)||100;
      const w = Math.floor(maxW*p/100), h = Math.floor(maxH*p/100);
      const fps = parseInt(frameRateIn.value)||15;

      const stream = await navigator.mediaDevices.getUserMedia({
        video:{deviceId, width:{exact:w}, height:{exact:h}, frameRate:{ideal:fps}}
      });
      video.srcObject = stream;
      await new Promise(r=>video.onloadedmetadata=r);
      outputCanvas.width=video.videoWidth;
      outputCanvas.height=video.videoHeight;
    }

    // １コマだけPose検出
    function detectPoseOnce(){
      return new Promise(resolve=>{
        pose.onResults(results=> resolve(results));
        pose.send({image:video});
      });
    }

    // 記録時処理
    captureBtn.onclick = async ()=>{
      // BodyPixロード
      if(!bodyPixModel) bodyPixModel = await bodyPix.load({architecture:'MobileNetV1'});
      // Pose検出１回
      const poseRes = await detectPoseOnce();

      // 2D描画と座標テーブル
      ctx.save();
      ctx.clearRect(0,0,outputCanvas.width,outputCanvas.height);
      ctx.drawImage(poseRes.image,0,0,outputCanvas.width,outputCanvas.height);
      let html=`<h3>座標(x,y,z)</h3><table><tr><th>i</th><th>x</th><th>y</th><th>z</th></tr>`;
      if(poseRes.poseLandmarks){
        drawConnectors(ctx, poseRes.poseLandmarks, Pose.POSE_CONNECTIONS, {color:'lime',lineWidth:2});
        drawLandmarks(ctx, poseRes.poseLandmarks, {color:'red',lineWidth:1});
        poseRes.poseLandmarks.forEach((p,i)=>{
          html+=`<tr><td>${i}</td><td>${p.x.toFixed(3)}</td>
            <td>${p.y.toFixed(3)}</td><td>${p.z.toFixed(3)}</td></tr>`;
        });
      }
      html+='</table>';
      poseDiv.innerHTML = html;
      ctx.restore();

      // BodyPixでマスク取得
      const seg = await bodyPixModel.segmentPerson(video,{
        internalResolution:'medium', segmentationThreshold:0.7
      });
      const {data, width, height} = seg;

      // mask→z行列
      const z = [];
      for(let y=0; y<height; y++){
        const row = [];
        for(let x=0; x<width; x++){
          row.push(data[y*width + x]);
        }
        z.push(row);
      }

      // Plotly surface
      Plotly.newPlot('plotly3d',[{
        z, type:'surface', showscale:false,
        colorscale:[['0','gray'],['1','gray']]
      }],{
        margin:{l:0,r:0,b:0,t:0},
        scene:{ xaxis:{title:'X'}, yaxis:{title:'Y'}, zaxis:{title:'Mask'} }
      });
    };

    // 開始ボタン
    startBtn.onclick = async ()=>{
      await startCamera();
      initPose();
    };

    enumerateCameras();
  </script>
</body>
</html>
