<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MediaPipe Pose + Plotly.js 3D 表示（凹形状）デモ</title>
    <style>
      body { font-family:sans-serif; text-align:center; }
      canvas, video { display:block; margin:10px auto; }
      #controls { margin:10px; }
      #threeContainer { width:640px; height:300px; margin:10px auto; }
      table { margin:auto; border-collapse:collapse; }
      th,td { border:1px solid #aaa; padding:4px; }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: 記録時のみ 3D プロット（凹形状）デモ</h2>
    <div id="controls">
      <label>カメラ: <select id="cameraSelect"></select></label>
      <label>FPS: <input id="frameRateInput" type="number" min="1" value="15" style="width:50px"></label>
      <label>解像度%: <input id="resPercentInput" type="number" min="1" max="100" value="100" style="width:50px"></label>
      <button id="startButton">開始</button>
      <button id="captureButton">記録</button>
      <div id="maxResolutionInfo" style="font-size:0.9em;color:#555"></div>
    </div>

    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <canvas id="outputCanvas"></canvas>
    <div id="poseCoordinates"></div>
    <div id="threeContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <script>
    const video=document.getElementById('video'),
          outC=document.getElementById('outputCanvas'),
          ctx=outC.getContext('2d'),
          camSel=document.getElementById('cameraSelect'),
          fpsIn=document.getElementById('frameRateInput'),
          resIn=document.getElementById('resPercentInput'),
          startBtn=document.getElementById('startButton'),
          capBtn=document.getElementById('captureButton'),
          maxInfo=document.getElementById('maxResolutionInfo'),
          coordDiv=document.getElementById('poseCoordinates'),
          threeDiv=document.getElementById('threeContainer');
    let pose, loopId, latest=null;

    // カメラ列挙
    async function enumCams(){
      const devs=await navigator.mediaDevices.enumerateDevices();
      camSel.innerHTML='';
      devs.filter(d=>d.kind==='videoinput')
          .forEach((d,i)=>{
            const o=new Option(d.label||`Cam${i+1}`,d.deviceId);
            camSel.add(o);
          });
    }

    function initPose(){
      pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
      pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
      pose.onResults(r=>{
        latest=r;
        ctx.save();
        ctx.clearRect(0,0,outC.width,outC.height);
        ctx.drawImage(r.image,0,0,outC.width,outC.height);
        if(r.poseLandmarks){
          drawConnectors(ctx,r.poseLandmarks,Pose.POSE_CONNECTIONS,{color:'lime',lineWidth:2});
          drawLandmarks(ctx,r.poseLandmarks,{color:'red',lineWidth:1});
        }
        ctx.restore();
      });
    }

    // カメラ開始
    async function startCam(){
      const id=camSel.value;
      let tmp=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id}}});
      const cap=tmp.getVideoTracks()[0].getCapabilities();
      const maxW=cap.width?.max||640, maxH=cap.height?.max||480;
      maxInfo.textContent=`最大解像度: ${maxW}×${maxH}`;
      tmp.getTracks().forEach(t=>t.stop());
      const p=parseInt(resIn.value)||100, w=Math.floor(maxW*p/100), h=Math.floor(maxH*p/100),
            fps=parseInt(fpsIn.value)||15;
      const strm=await navigator.mediaDevices.getUserMedia({
        video:{deviceId:{exact:id},width:{exact:w},height:{exact:h},frameRate:{ideal:fps}}
      });
      video.srcObject=strm;
      await new Promise(r=>video.onloadedmetadata=()=>{ 
        outC.width=video.videoWidth;
        outC.height=video.videoHeight;
        video.play(); r();
      });
    }

    // ループ
    async function procLoop(){
      const fps=parseInt(fpsIn.value)||15, iv=1000/fps;
      async function f(){
        if(!video.paused&&!video.ended) await pose.send({image:video});
        loopId=setTimeout(f,iv);
      }
      f();
    }

    // 3D プロット修正
    function draw3DPlot(lms){
      const sx=[],sy=[],sz=[];
      lms.forEach(l=>{ if(l){ sx.push((l.x-0.5)*100); sy.push((0.5-l.y)*100); sz.push(l.z*100); }});
      const pts={x:sx,y:sy,z:sz,mode:'markers',type:'scatter3d',marker:{size:4,color:'red'}};
      const mesh={x:sx,y:sy,z:sz,type:'mesh3d',alphahull:5,opacity:0.5,color:'lightgray'};
      const layout={margin:{l:0,r:0,b:0,t:0},scene:{aspectmode:'auto'}};
      Plotly.newPlot(threeDiv,[mesh,pts],layout);
    }

    // イベント
    startBtn.onclick=async()=>{
      await startCam(); initPose(); procLoop();
    };
    capBtn.onclick=()=>{
      clearTimeout(loopId);
      if(latest?.poseLandmarks){
        let t=`<h3>記録された座標</h3><table><tr><th>Idx</th><th>x</th><th>y</th><th>z</th></tr>`;
        latest.poseLandmarks.forEach((l,i)=>{
          t+=`<tr><td>${i}</td><td>${l.x.toFixed(3)}</td><td>${l.y.toFixed(3)}</td><td>${l.z.toFixed(3)}</td></tr>`;
        });
        coordDiv.innerHTML=t+'</table>';
        draw3DPlot(latest.poseLandmarks);
      } else {
        coordDiv.innerHTML='<p>ポーズ未検出</p>'; threeDiv.innerHTML='';
      }
    };

    enumCams();
    </script>
  </body>
</html>
