<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>弓道射形確認ツール - 修正版</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }
    #videoElement, #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <!-- カメラ映像表示用 -->
  <video id="videoElement" autoplay muted playsinline></video>
  <!-- 描画用Canvas -->
  <canvas id="overlayCanvas"></canvas>

  <!-- ml5.js CDN（PoseNet利用のため） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ml5/0.6.0/ml5.min.js"></script>
  <script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    let poseNet;
    let poses = [];

    // Canvasサイズをウィンドウサイズに合わせる
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // カメラ映像の取得
    async function startVideo() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
      } catch (err) {
        console.error("カメラ映像の取得に失敗しました:", err);
      }
    }
    startVideo();

    // 動画のメタデータ（サイズ情報）が利用可能になったらログ出力
    video.addEventListener('loadedmetadata', () => {
      console.log('Video dimensions:', video.videoWidth, video.videoHeight);
    });

    // PoseNetモデルのロードと初期化
    video.addEventListener('loadeddata', () => {
      poseNet = ml5.poseNet(video, { flipHorizontal: true }, () => {
        console.log('PoseNet モデルロード完了');
      });

      // ポーズ検出結果の更新
      poseNet.on('pose', results => {
        poses = results;
      });

      // アニメーションループでCanvas上に描画
      requestAnimationFrame(drawOverlay);
    });

    // オーバーレイの描画
    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      poses.forEach(poseObj => {
        const pose = poseObj.pose;

        // キーポイント描画（信頼度 0.3 以上）
        pose.keypoints.forEach(keypoint => {
          if (keypoint.score > 0.3) {
            const { x, y } = convertCoordinates(keypoint.position);
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = "#ff0000";
            ctx.fill();
          }
        });

        // adjacentKeyPoints を用いたボーン（線）の描画
        const adjacentKeyPoints = ml5.poseNet.getAdjacentKeyPoints(pose.keypoints, 0.3);
        // 出力内容をデバッグ用にコンソールへ出力（必要に応じてコメントアウト）
        // console.log('adjacentKeyPoints:', adjacentKeyPoints);
        adjacentKeyPoints.forEach(pair => {
          const [{ position: posA }, { position: posB }] = pair;
          const a = convertCoordinates(posA);
          const b = convertCoordinates(posB);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#00ff00";
          ctx.stroke();
        });
      });

      requestAnimationFrame(drawOverlay);
    }

    // 座標変換：動画の実サイズと画面サイズの違いに対応
    function convertCoordinates(pos) {
      // video.videoWidth と video.videoHeight が 0 でないことを前提とする
      const scaleX = window.innerWidth / video.videoWidth;
      const scaleY = window.innerHeight / video.videoHeight;
      return {
        x: pos.x * scaleX,
        y: pos.y * scaleY
      };
    }
  </script>
</body>
</html>
