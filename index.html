<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>骨格推定 P2P（VCキャプチャ修正版）</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width:45%; margin:0 2%; background:#000 }
    #controls { margin:1em; }
    #status { color:red; white-space:pre-wrap; text-align:left; }
  </style>
</head>
<body>
  <h1>骨格推定 P2P（VCキャプチャ修正版）</h1>
  <div id="controls">
    <label><input type="radio" name="role" value="compute"> 計算</label>
    <label><input type="radio" name="role" value="user"> ユーザー</label><br>
    部屋番号：<input type="text" id="roomCode" placeholder="1234"><br>
    <button id="startBtn">開始</button>
    <button id="callBtn">接続</button>
  </div>
  <div id="status">[INFO] Ready</div>
  <p>あなたの PeerID: <span id="myId">—</span></p>
  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <script>
    const log      = msg => {
      console.log(msg);
      document.getElementById('status').textContent += '\n'+msg;
    };
    const startBtn = document.getElementById('startBtn');
    const callBtn  = document.getElementById('callBtn');
    const roomIn   = document.getElementById('roomCode');
    const myId     = document.getElementById('myId');
    const localV   = document.getElementById('localVideo');
    const remoteV  = document.getElementById('remoteVideo');

    let role, peer, localStream, roomCode;

    startBtn.onclick = async () => {
      role     = document.querySelector('input[name=role]:checked')?.value;
      roomCode = roomIn.value.trim();
      if (!role)     return log('[ERROR] 先に「計算」か「ユーザー」を選択してください');
      if (!roomCode) return log('[ERROR] 部屋番号を入力してください');

      peer = new Peer(`${role}-${roomCode}`, {
        host:'0.peerjs.com', secure:true, port:443,
        config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}
      });
      peer.on('open', id => {
        myId.textContent = id;
        log(`[INFO] Peer opened: ${id}`);
      });
      peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

      if (role === 'compute') {
        // 計算側：仮想カメラを選んで取得
        callBtn.style.display = 'none';

        // enumerateDevices→ラベル付きリスト取得
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        const vc = cams.find(d =>
          /OBS Virtual Camera|Unity Capture|VirtualCam/.test(d.label)
        );
        if (!vc) {
          return log('[ERROR] 仮想カメラが見つかりません');
        }
        log(`[INFO] Found virtual camera: ${vc.label}`);

        try {
          // deviceId を exact で指定
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { deviceId: { exact: vc.deviceId } },
            audio: false
          });
          localV.srcObject = localStream;
          // 明示的に再生開始
          await localV.play();
          log('[INFO] Virtual camera stream playing');
        } catch (e) {
          return log(`[ERROR] VC getUserMedia failed: ${e}`);
        }

        peer.on('call', call => {
          log('[INFO] Incoming call, answering with VC stream');
          call.answer(localStream);
          call.on('stream', s => {
            remoteV.srcObject = s;
            remoteV.play();
            log('[INFO] Received user stream');
          });
        });

      } else {
        // ユーザー側：自分のカメラを取得
        callBtn.style.display = 'inline-block';
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: true, audio: false
          });
          localV.srcObject = localStream;
          await localV.play();
          log('[INFO] User camera stream playing');
        } catch (e) {
          return log(`[ERROR] getUserMedia failed: ${e}`);
        }

        peer.on('call', call => {
          log('[INFO] Incoming call, answering with user camera');
          call.answer(localStream);
          call.on('stream', s => {
            remoteV.srcObject = s;
            remoteV.play();
            log('[INFO] Received remote (compute) stream');
          });
        });
      }
    };

    callBtn.onclick = () => {
      if (!peer || !roomCode) return log('[ERROR] 先に開始してください');
      const target = role === 'user' ?
                     `compute-${roomCode}` :
                     `user-${roomCode}`;
      log(`[INFO] Calling ${target}`);
      const call = peer.call(target, localStream);
      call.on('stream', s => {
        remoteV.srcObject = s;
        remoteV.play();
        log('[INFO] Received remote stream via call');
      });
      call.on('error', e => log(`[ERROR] call failed: ${e}`));
    };
  </script>
</body>
</html>
