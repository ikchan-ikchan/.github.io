<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>オンデマンド カメラ処理 + ジョイスティック</title>
  <style>
    /* ── レイアウト ── */
    #videoContainer {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    #videoContainer video,
    #videoContainer img {
      width: 320px;
      height: 240px;
      background: #000;
    }
    #controlContainer {
      text-align: center;
      margin-bottom: 10px;
    }
    #joystick {
      width: 200px;
    }
  </style>
</head>
<body>
  <h1>オンデマンド カメラ処理 + ジョイスティック</h1>

  <!-- 映像表示エリア -->
  <div id="videoContainer">
    <!-- ライブカメラ -->
    <video id="localVideo" autoplay muted playsinline></video>
    <!-- 処理後静止画 -->
    <img id="outputImage" style="display:none;" />
    <!-- 処理後動画 -->
    <video id="outputVideo" controls style="display:none;"></video>
  </div>

  <!-- コントロール -->
  <div id="controlContainer">
    <!-- ジョイスティック（0=上端,50=中央,100=下端） -->
    <input id="joystick" type="range" min="0" max="100" value="50">
    <!-- ループ再生トグル -->
    <label>
      <input type="checkbox" id="loopToggle"> ループ再生
    </label>
  </div>

  <script>
    // 要素取得
    const localVideo   = document.getElementById('localVideo');
    const outputImage  = document.getElementById('outputImage');
    const outputVideo  = document.getElementById('outputVideo');
    const joystick     = document.getElementById('joystick');
    const loopToggle   = document.getElementById('loopToggle');

    // 状態管理
    let stream = null;
    let recorder = null;
    let chunks = [];
    let isRecording = false;
    let snapshotSent = false;

    // 1) カメラストリームを常時取得
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(s => {
        stream = s;
        localVideo.srcObject = s;
      })
      .catch(err => {
        console.error('カメラ取得エラー:', err);
        alert('カメラを取得できませんでした。');
      });

    // 2) ジョイスティック操作で送信開始/停止
    joystick.addEventListener('input', () => {
      const val = parseInt(joystick.value);

      // ── 上スライド: 静止画スナップショット送信 ──
      if (val < 10 && !snapshotSent) {
        snapshotSent = true;
        // Canvasに描画してPNG化
        const canvas = document.createElement('canvas');
        canvas.width  = localVideo.videoWidth;
        canvas.height = localVideo.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          const formData = new FormData();
          formData.append('image', blob, 'snapshot.png');
          // サーバーへPOST
          fetch('/process_image', { method: 'POST', body: formData })
            .then(res => res.blob())
            .then(processedBlob => {
              // 結果の静止画を表示
              outputVideo.style.display = 'none';
              outputVideo.pause();
              outputImage.style.display = 'block';
              outputImage.src = URL.createObjectURL(processedBlob);
            })
            .catch(err => console.error('静止画処理エラー:', err));
        }, 'image/png');
      }
      if (val >= 10) {
        snapshotSent = false;
      }

      // ── 下スライド: 録画開始 ──
      if (val > 90 && !isRecording) {
        isRecording = true;
        chunks = [];
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        recorder.ondataavailable = e => {
          if (e.data.size > 0) chunks.push(e.data);
        };
        recorder.onstop = () => {
          // 録画終了時にまとめてサーバーへ送信
          const blob = new Blob(chunks, { type: 'video/webm' });
          const formData = new FormData();
          formData.append('video', blob, 'recording.webm');
          fetch('/process_video', { method: 'POST', body: formData })
            .then(res => res.blob())
            .then(processedBlob => {
              // 結果の動画を表示
              outputImage.style.display = 'none';
              outputVideo.style.display = 'block';
              outputVideo.src = URL.createObjectURL(processedBlob);
              outputVideo.loop = loopToggle.checked;
              outputVideo.play();
            })
            .catch(err => console.error('動画処理エラー:', err));
        };
        recorder.start();
      }

      // ── 中央戻し: 録画停止 ──
      if (isRecording && val <= 60) {
        isRecording = false;
        recorder.stop();
      }
    });

    // 3) ループトグルで動画再生ループON/OFF
    loopToggle.addEventListener('change', () => {
      outputVideo.loop = loopToggle.checked;
    });
  </script>
</body>
</html>
