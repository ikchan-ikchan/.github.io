<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Video File → MediaPipe Pose → VNect-style IK</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #controls {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(255,255,255,0.8); padding: 8px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label>動画ファイルを選択: <input id="fileInput" type="file" accept="video/*"></label>
  </div>
  <!-- 隠しビデオ要素 -->
  <video id="video" style="display:none;" playsinline muted></video>
  <!-- Three.js レンダラーが差し込まれる要素 -->
  <div id="threeContainer"></div>

  <!-- MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
  <!-- three-ik -->
  <script src="https://cdn.jsdelivr.net/npm/three-ik@1.1.0/dist/three-ik.min.js"></script>

  <script>
  // --- グローバル変数 ---
  let pose, video, renderer, scene, camera, ik, clock;

  // 1) Three.js + IK シーンのセットアップ
  function initThree() {
    const container = document.getElementById('threeContainer');
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(0, 5, 5);
    scene.add(light);

    // IK リグのセットアップ（例: 上半身＋腕チェーン）
    ik = new IK();
    // ここでは簡単のため、肩→肘→手首のチェーンを作成
    const shoulder = new IKJoint(new THREE.Bone(), { constraints: [] });
    const elbow   = new IKJoint(new THREE.Bone(), { constraints: [] });
    const wrist   = new IKJoint(new THREE.Bone(), { constraints: [] });
    shoulder.bone.position.set(0, 1.4, 0);
    elbow.bone.position.set(0.3, 1.2, 0);
    wrist.bone.position.set(0.6, 1.0, 0);
    ik.add(shoulder).add(elbow).add(wrist);

    scene.add(shoulder.bone);
    scene.add(shoulder.bone.children[0]);
    scene.add(shoulder.bone.children[0].children[0]);

    clock = new THREE.Clock();
  }

  // 2) MediaPipe Pose の初期化
  function initPose() {
    pose = new Pose({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onPoseResults);
  }

  // 3) ファイル選択 → video にセット
  document.getElementById('fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (window.stream) {
      // もし以前のストリームを止める必要があれば
      video.srcObject.getTracks().forEach(t=>t.stop());
    }
    video.src = URL.createObjectURL(file);
    await video.play();
    startProcessing();
  });

  // 4) 動画を MediaPipe に送るループ
  async function startProcessing() {
    const FPS = 30;
    const interval = 1000/FPS;
    async function loop() {
      await pose.send({ image: video });
      setTimeout(loop, interval);
    }
    loop();
    animateThree();
  }

  // 5) MediaPipe の結果を受け取り IK ターゲットにセット
  function onPoseResults(results) {
    if (!results.poseLandmarks) return;
    // 例：肩(11), 肘(13), 手首(15) のランドマークを使う
    const lm = results.poseLandmarks;
    const v3 = (pt) => new THREE.Vector3(
      (pt.x - 0.5) * 2,  // 中心合わせ
      (1-pt.y) * 2,      // 上下反転＆スケール
      (pt.z)             // zは相対的奥行き
    );
    const targetPositions = [
      v3(lm[11]), // Lshoulder
      v3(lm[13]), // Lelbow
      v3(lm[15])  // Lwrist
    ];
    // IK のターゲットを更新
    ik.getChain(0).joints.forEach((joint, i) => {
      joint.bone.position.copy(targetPositions[i]);
    });
    ik.solve();
  }

  // 6) Three.js レンダーループ
  function animateThree() {
    requestAnimationFrame(animateThree);
    const delta = clock.getDelta();
    renderer.render(scene, camera);
  }

  // 初期化
  window.addEventListener('load', () => {
    video = document.getElementById('video');
    initThree();
    initPose();
  });
  </script>
</body>
</html>
