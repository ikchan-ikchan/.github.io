<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D Rig Pose Editor</n  <style>
    body { margin: 0; overflow: hidden; }
    #ui {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(255,255,255,0.8); padding: 8px; border-radius: 4px;
      font-family: sans-serif;
    }
    button { display: block; margin-bottom: 6px; padding: 4px 8px; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="resetBtn">リセット ポーズ</button>
  </div>

  <!-- Three.js core -->
  <script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>
  <!-- Load controls and loader -->
  <script src="https://unpkg.com/three@0.159.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.159.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://unpkg.com/three@0.159.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    let scene, camera, renderer;
    let orbitCtrl, transformCtrl;
    let skeleton, skeletonHelper, model;

    init();
    animate();

    function init() {
      // シーンとカメラ
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xeeeeee);
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(1.5, 1.5, 3);

      // レンダラー
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // オービットコントロール
      orbitCtrl = new THREE.OrbitControls(camera, renderer.domElement);
      orbitCtrl.target.set(0, 1, 0);
      orbitCtrl.update();

      // ライティング
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(5, 10, 7.5);
      scene.add(dirLight);

      // グリッド
      scene.add(new THREE.GridHelper(10, 10));

      // モデル読み込み
      const loader = new THREE.GLTFLoader();
      loader.load(
        'https://rawcdn.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/RiggedSimple/glTF-Binary/RiggedSimple.glb',
        gltf => {
          model = gltf.scene;
          scene.add(model);
          model.traverse(obj => {
            if (obj.isSkinnedMesh) {
              skeleton = obj.skeleton;
            }
          });
          // 骨格ヘルパー
          skeletonHelper = new THREE.SkeletonHelper(model);
          scene.add(skeletonHelper);
          setupBoneHandles();
        }
      );

      // トランスフォームコントロール
      transformCtrl = new THREE.TransformControls(camera, renderer.domElement);
      transformCtrl.setMode('rotate');
      transformCtrl.addEventListener('dragging-changed', e => {
        orbitCtrl.enabled = !e.value;
      });
      scene.add(transformCtrl);

      // リセットボタン
      document.getElementById('resetBtn').addEventListener('click', () => {
        if (skeleton) skeleton.pose();
      });

      window.addEventListener('resize', onWindowResize);
    }

    function setupBoneHandles() {
      // 各ボーンにハンドル用スフィアを付与
      skeleton.bones.forEach(bone => {
        const handle = new THREE.Mesh(
          new THREE.SphereGeometry(0.02),
          new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        bone.add(handle);
        handle.userData.bone = bone;
      });

      // ピッキング用レイキャスター
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      renderer.domElement.addEventListener('pointerdown', event => {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        for (let i = 0; i < intersects.length; i++) {
          const obj = intersects[i].object;
          if (obj.userData.bone) {
            transformCtrl.attach(obj);
            break;
          }
        }
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
