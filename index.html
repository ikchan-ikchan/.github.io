<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>P2P + Joystick ステップ2</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family:sans-serif; text-align:center; margin:0; padding:0 }
    #mediaArea { display:grid; grid-gap:10px; padding:10px }
    #localVideo, #remoteVideo {
      width:100%; height:auto; background:#000;
    }
    #joystick {
      box-sizing:border-box;
      width:60px; height:240px; margin:auto;
      position:relative;
      border:4px solid #000; border-radius:30px;
      background:#fff;
      touch-action:none; overscroll-behavior:contain;
    }
    #knob {
      position:absolute; left:50%; top:50%;
      width:40px; height:40px; margin:-20px 0 0 -20px;
      border-radius:50%; background:#000;
      transform:translate(0,0);
      transition:transform .15s;
      pointer-events:none;
    }
    @media (orientation:portrait) {
      #mediaArea {
        grid-template-areas:
          "localVideo joystick"
          "remoteVideo joystick";
        grid-template-columns:1fr auto;
        grid-template-rows:1fr 1fr;
        align-items:center;
        height:calc(100vh - 200px);
      }
      #localVideo  { grid-area:localVideo; }
      #remoteVideo { grid-area:remoteVideo; }
      #joystick    { grid-area:joystick; }
    }
    @media (orientation:landscape) {
      #mediaArea {
        grid-template-areas:"localVideo joystick remoteVideo";
        grid-template-columns:1fr auto 1fr;
        align-items:center;
        height:calc(100vh - 200px);
      }
      #localVideo  { grid-area:localVideo; }
      #remoteVideo { grid-area:remoteVideo; }
      #joystick    { grid-area:joystick; }
    }
    #joystickState { font-weight:bold; margin-top:4px }
    #controls { padding:10px }
    #controls select,#controls input,#controls button { margin:4px }
    #playbackControls { margin:10px }
    #playbackControls button { margin:0 4px }
    #log {
      white-space:pre-wrap; background:#f7f7f7;
      padding:8px; margin:8px; text-align:left;
      height:120px; overflow-y:auto; font-size:.9em;
    }
    /* offscreen canvas */
    #captureCanvas { display:none }
  </style>
</head>
<body>
  <h1>P2P + Joystick ステップ2</h1>

  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline controls></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>

  <div id="playbackControls" style="display:none;">
    <button id="playBtn">再生</button>
    <button id="pauseBtn">停止</button>
    <label><input type="checkbox" id="loopChk">ループ</label>
  </div>

  <hr/>

  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>
    <div id="userControls">
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button><br/>
      <input type="text" id="targetId" placeholder="計算ノードのIDを入力">
    </div>
    <div id="computeControls" style="display:none;">
      <p>計算ノードモード：Unity Video Capture を自動選択して待機します。</p>
    </div>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>
  <canvas id="captureCanvas"></canvas>

<script>
  // ===== ユーティリティ =====
  const logDiv = document.getElementById('log');
  function log(msg){
    console.log(msg);
    logDiv.textContent += '\n' + msg;
  }

  // ===== 変数 =====
  const params    = new URLSearchParams(location.search);
  const role      = params.get('role');
  const isCompute = role==='compute';

  let peer, callConn;

  // 動画録画用
  let mediaRecorder, recordedBlobs;

  // DOM 要素
  const localV   = document.getElementById('localVideo');
  const remoteV  = document.getElementById('remoteVideo');
  const myIdSp   = document.getElementById('myId');
  const userC    = document.getElementById('userControls');
  const compC    = document.getElementById('computeControls');
  const vidSel   = document.getElementById('videoSource');
  const startBtn = document.getElementById('startCamera');
  const targetId = document.getElementById('targetId');
  const playBtn  = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const loopChk  = document.getElementById('loopChk');

  const joy   = document.getElementById('joystick');
  const knob  = document.getElementById('knob');
  const state = document.getElementById('joystickState');
  const canvas= document.getElementById('captureCanvas');

  let dragging=false, rect, maxY;

  // ===== ジョイスティック制御 =====
  function updateState(v){
    state.textContent = v< -0.5? '上': v>0.5? '下':'中心';
  }
  function centerKnob(){
    knob.style.transition='transform .15s';
    knob.style.transform='translate(-50%,-50%)';
    updateState(0);
    setTimeout(()=>knob.style.transition='',160);
  }

  // 静止画送信
  function sendStatic(){
    if(!window.localStream){ log('[WARN] カメラ未起動'); return; }
    // キャプチャして canvas へ
    const vw=localV.videoWidth, vh=localV.videoHeight;
    canvas.width=vw; canvas.height=vh;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(localV,0,0,vw,vh);
    const cs=canvas.captureStream(1);
    // コール
    const pid=targetId.value.trim(); if(!pid){ log('[ERROR] ID未入力'); return; }
    log(`[INFO] 上 → 静止画送信 to compute-${pid}`);
    if(callConn) callConn.close();
    callConn = peer.call(`compute-${pid}`, cs);
    callConn.on('stream', s=>{
      remoteV.srcObject = s;
      // 動画UIは不要
      document.getElementById('playbackControls').style.display='none';
      log('[INFO] 静止画受信');
    });
  }

  // 動画録画開始
  function startRecording(){
    recordedBlobs = [];
    const options = { mimeType: 'video/webm; codecs=vp8' };
    try {
      mediaRecorder = new MediaRecorder(window.localStream, options);
    } catch(e){
      log('[ERROR] MediaRecorder作成失敗: '+e);
      return;
    }
    mediaRecorder.ondataavailable = e=>{
      if(e.data && e.data.size>0) recordedBlobs.push(e.data);
    };
    mediaRecorder.onstop = sendRecording;
    mediaRecorder.start();
    log('[INFO] 動画録画開始');
    // UI 非表示
    document.getElementById('playbackControls').style.display='none';
  }
  // 動画送信
  function sendRecording(){
    const blob = new Blob(recordedBlobs, { type:'video/webm' });
    const stream = blobToStream(blob);
    const pid=targetId.value.trim(); if(!pid){ log('[ERROR] ID未入力'); return; }
    log(`[INFO] 下 → 動画送信 to compute-${pid}`);
    if(callConn) callConn.close();
    callConn = peer.call(`compute-${pid}`, stream);
    callConn.on('stream', s=>{
      // 返送ストリームは MediaStream。remoteV へセットして再生UI表示
      remoteV.srcObject=null;
      remoteV.src = URL.createObjectURL(new Blob()); // clear
      remoteV.srcObject=s;
      remoteV.onloadedmetadata = ()=>{
        remoteV.play();
        document.getElementById('playbackControls').style.display='block';
      };
      log('[INFO] 動画処理済みストリーム受信');
    });
  }
  // Blob→MediaStream
  function blobToStream(blob){
    const url = URL.createObjectURL(blob);
    const vid = document.createElement('video');
    vid.src = url;
    vid.muted = true;
    vid.play();
    return vid.captureStream();
  }

  // ポインターイベント登録
  ['pointerdown','pointermove','pointerup'].forEach(evt=>{
    joy.addEventListener(evt, e=>{
      e.preventDefault();
      if(evt==='pointerdown'){
        dragging=true;
        rect=joy.getBoundingClientRect();
        maxY=rect.height/2 - knob.offsetHeight/2;
      }
      if(evt==='pointermove'&&dragging){
        let y=e.clientY-(rect.top+rect.height/2);
        y=Math.max(-maxY,Math.min(maxY,y));
        knob.style.transition='';
        knob.style.transform=`translate(-50%,calc(-50%+${y}px))`;
        updateState(y/maxY);
        // 下スライド検知
        if(y/maxY>0.5 && !mediaRecorder) startRecording();
      }
      if(evt==='pointerup'){
        // pointerup直前の state
        const v = state.textContent;
        if(v==='上') sendStatic();
        if(mediaRecorder){
          mediaRecorder.stop();
          mediaRecorder=null;
        }
        dragging=false;
        centerKnob();
      }
    }, { passive:false });
  });

  // ===== PeerJS P2P 設定 =====
  peer = new Peer();
  peer.on('open', id=>{
    myIdSp.textContent = id;
    log(`[INFO] 自ID: ${id}`);
  });
  peer.on('error', e=> log(`[ERROR] PeerJS: ${e}`));

  if(isCompute){
    // 計算モード
    userC.style.display = 'none'; compC.style.display='block';
    log('[INFO] 計算モード起動');
    navigator.mediaDevices.enumerateDevices()
      .then(devs=>{
        const cam=devs.find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
        if(!cam){ log('[ERROR] 仮想カメラ未発見'); throw '';
        }
        return navigator.mediaDevices.getUserMedia({
          video:{deviceId:{exact:cam.deviceId}}, audio:false
        });
      })
      .then(stream=>{
        localV.srcObject=stream; log('[INFO] VC開始');
        peer.on('call', call=>{
          // call.stream はユーザー静止/動画ストリーム
          call.on('stream', s=>{
            // screenshot→invert or frame-by-frame invert
            // static: 1fps screenshot; dynamic: screenshot at rate 15fps
            const fps = (s.getVideoTracks()[0].label==='video')?15:1;
            import_process_loop(call, fps);
          });
        });
      })
      .catch(err=>{ log('[ERROR] カメラ失敗:'+err); peer.on('call',c=>c.answer(null)); });

    // 計算処理ループ
    function import_process_loop(call, fps){
      // Pythonサイドで処理、こちらは受けるだけ
      // compute_processor.py が VirtualCam 経由で返送
    }

  } else {
    // ユーザーモード
    userC.style.display = 'block'; compC.style.display='none';
    log('[INFO] ユーザーモード');
    navigator.mediaDevices.enumerateDevices()
      .then(devs=>{
        vidSel.innerHTML='';
        devs.filter(d=>d.kind==='videoinput').forEach(d=>{
          const o=document.createElement('option');
          o.value=d.deviceId; o.text=d.label||d.deviceId;
          vidSel.appendChild(o);
        });
      });
    startBtn.onclick = ()=>{
      const id=vidSel.value; if(!id){log('[ERROR] カメラ未選択');return;}
      navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id}},audio:false})
      .then(s=>{ localV.srcObject=s; window.localStream=s; log('[INFO] カメラ開始'); })
      .catch(e=>log('[ERROR] '+e));
    };
  }

  // ===== 再生UI制御 =====
  playBtn.onclick  = ()=> remoteV.play();
  pauseBtn.onclick = ()=> remoteV.pause();
  loopChk.onchange = ()=> remoteV.loop = loopChk.checked;

</script>
</body>
</html>
