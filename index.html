<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 3Dキャプチャデモ</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video {
        display: none;
      }
      #outputCanvas {
        display: block;
        margin: 10px auto;
        border: 1px solid #ccc;
        /* 初期は標準の境界線 */
      }
      #controls {
        margin: 10px;
      }
      #maxResolutionInfo {
        margin-top: 5px;
        font-size: 0.9em;
        color: #555;
      }
      /* 3D 表示領域用 */
      #threeContainer {
        width: 640px;
        height: 480px;
        margin: 10px auto;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 3Dキャプチャデモ</h2>
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
      &nbsp;&nbsp;
      <label for="resPercentInput">解像度 (%):</label>
      <input type="number" id="resPercentInput" min="1" max="100" value="100" style="width:60px;">
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
      &nbsp;&nbsp;
      <button id="captureButton">キャプチャ</button>
      <div id="maxResolutionInfo"></div>
    </div>
    
    <!-- カメラ映像（内部利用：表示はCanvas側に描画） -->
    <video id="video" autoplay muted playsinline></video>
    <!-- 2D 描画用キャンバス（MediaPipe Pose の結果表示用） -->
    <canvas id="outputCanvas"></canvas>
    <!-- 3D 表示用領域（キャプチャしたランドマークを Three.js で描画） -->
    <div id="threeContainer"></div>
    
    <!-- MediaPipe Pose と Drawing Utils の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- Three.js と OrbitControls の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
      // 画面系の要素
      const video = document.getElementById('video');
      const outputCanvas = document.getElementById('outputCanvas');
      const canvasCtx = outputCanvas.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const resPercentInput = document.getElementById('resPercentInput');
      const startButton = document.getElementById('startButton');
      const captureButton = document.getElementById('captureButton');
      const maxResolutionInfo = document.getElementById('maxResolutionInfo');
      const threeContainer = document.getElementById('threeContainer');
      
      // MediaPipe Pose インスタンスおよび最新結果
      let pose = null;
      let latestPoseResult = null;
      
      // --- 追加: 2D キャンバスで拡大／縮小／パンのためのグローバル変数 ---
      let canvasScale = 1;
      let canvasTranslateX = 0;
      let canvasTranslateY = 0;
      let isDragging = false;
      let dragStartX = 0, dragStartY = 0;
      let initialTranslateX = 0, initialTranslateY = 0;
      
      // ① 利用可能なカメラを列挙する
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `カメラ ${index + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (error) {
          console.error('カメラの列挙に失敗:', error);
        }
      }
      
      // ② MediaPipe Pose の初期化
      function initializePose() {
        pose = new Pose({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });
        pose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);
      }
      
      // ③ 結果を 2D キャンバスに描画するコールバック
      function onResults(results) {
        latestPoseResult = results;  // 最新結果を保存
        
        canvasCtx.save();
        // --- 追加: キャンバスの拡大／縮小とパンを反映 ---
        canvasCtx.setTransform(canvasScale, 0, 0, canvasScale, canvasTranslateX, canvasTranslateY);
        canvasCtx.clearRect(-canvasTranslateX/canvasScale, -canvasTranslateY/canvasScale, outputCanvas.width/canvasScale, outputCanvas.height/canvasScale);
        // 背景に入力映像を描画
        canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
        if (results.poseLandmarks) {
          drawConnectors(canvasCtx, results.poseLandmarks, Pose.POSE_CONNECTIONS, { color: 'lime', lineWidth: 2 });
          drawLandmarks(canvasCtx, results.poseLandmarks, { color: 'red', lineWidth: 1 });
        }
        canvasCtx.restore();
      }
      
      // ④ 選択したカメラで、最大解像度の何％かを指定して映像を取得する
      async function startCamera() {
        const selectedDeviceId = cameraSelect.value;
        // 一度制約なしで最大解像度を求める
        const tempConstraints = { video: { deviceId: { exact: selectedDeviceId } } };
        let tempStream;
        try {
          tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
        } catch (error) {
          console.error('初回ストリームの取得に失敗:', error);
          return;
        }
        const videoTrack = tempStream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        let maxWidth = (capabilities.width && capabilities.width.max) || 640;
        let maxHeight = (capabilities.height && capabilities.height.max) || 480;
        maxResolutionInfo.innerText = `このカメラの最大解像度: ${maxWidth} x ${maxHeight}`;
        tempStream.getTracks().forEach(track => track.stop());
        
        const resPercent = parseInt(resPercentInput.value) || 100;
        const desiredWidth = Math.floor(maxWidth * (resPercent / 100));
        const desiredHeight = Math.floor(maxHeight * (resPercent / 100));
        const frameRate = parseInt(frameRateInput.value) || 15;
        // 厳密な解像度指定のため「exact」を使用（環境によっては「ideal」に変更）
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { exact: desiredWidth },
            height: { exact: desiredHeight },
            frameRate: { ideal: frameRate }
          }
        };
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          return new Promise(resolve => {
            video.onloadedmetadata = () => {
              // 実際の取得サイズに合わせてキャンバスサイズを更新
              outputCanvas.width = video.videoWidth;
              outputCanvas.height = video.videoHeight;
              video.play();
              resolve();
            };
          });
        } catch (error) {
          console.error('カメラ映像の取得に失敗:', error);
        }
      }
      
      // ⑤ 映像フレームを MediaPipe Pose に送信するループ
      async function processVideo() {
        const frameRate = parseInt(frameRateInput.value) || 15;
        const interval = 1000 / frameRate;
        async function sendFrame() {
          if (!video.paused && !video.ended) {
            await pose.send({ image: video });
          }
          setTimeout(sendFrame, interval);
        }
        sendFrame();
      }
      
      // --- 追加: 2Dキャンバスでの拡大／縮小とパン操作 ---
      outputCanvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        // ホイールの上ならズームイン、下ならズームアウト
        const zoomFactor = 0.1;
        if (e.deltaY < 0) {
          canvasScale = Math.min(canvasScale + zoomFactor, 3);
        } else {
          canvasScale = Math.max(canvasScale - zoomFactor, 0.5);
        }
      });
      
      outputCanvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        initialTranslateX = canvasTranslateX;
        initialTranslateY = canvasTranslateY;
      });
      
      outputCanvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          canvasTranslateX = initialTranslateX + dx;
          canvasTranslateY = initialTranslateY + dy;
        }
      });
      
      outputCanvas.addEventListener('mouseup', () => {
        isDragging = false;
      });
      
      outputCanvas.addEventListener('mouseleave', () => {
        isDragging = false;
      });
      
      // ⑥ キャプチャボタン押下時の処理
      captureButton.addEventListener('click', () => {
        if (latestPoseResult && latestPoseResult.poseLandmarks) {
          // キャプチャ時、2Dキャンバス枠を一瞬赤くフラッシュする
          outputCanvas.style.border = "5px solid red";
          setTimeout(() => { outputCanvas.style.border = "1px solid #ccc"; }, 200);
          
          // 3D 表示領域に「処理中」と表示
          threeContainer.innerHTML = "<h3>処理中</h3>";
          // キャプチャした結果を Three.js で描画
          render3DPose(latestPoseResult.poseLandmarks);
        } else {
          console.warn('まだ有効な pose 結果がありません。');
        }
      });
      
      // ⑦ Three.js を用いてキャプチャした 3D ランドマークを表示する関数
      function render3DPose(landmarks) {
        // 既存の内容をクリア
        while (threeContainer.firstChild) {
          threeContainer.removeChild(threeContainer.firstChild);
        }
        
        const width = threeContainer.clientWidth;
        const height = threeContainer.clientHeight;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        // カメラ位置はシーン全体が見渡せるよう調整
        camera.position.set(0, 0, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        threeContainer.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        // MediaPipe のランドマークは x,y が [0,1]（画像内の位置）
        // ここでは、キャンバスの幅・高さを元に中心を 0 にして変換、z は適宜スケール
        const geometry = new THREE.BufferGeometry();
        const points = [];
        landmarks.forEach(pt => {
          const x = (pt.x - 0.5) * width;
          const y = -(pt.y - 0.5) * height;  // 上下反転して調整
          const z = pt.z * 500; // スケールは必要に応じて調整
          points.push(x, y, z);
        });
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
        const material = new THREE.PointsMaterial({ color: 0xff0000, size: 8 });
        const pointCloud = new THREE.Points(geometry, material);
        scene.add(pointCloud);
        // 軸ヘルパーで座標軸表示（任意）
        const axesHelper = new THREE.AxesHelper(200);
        scene.add(axesHelper);
        
        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      }
      
      // ⑧ 開始ボタン押下時の処理（カメラ開始、Pose 初期化、映像送信開始）
      startButton.addEventListener('click', async () => {
        // リセット：キャンバスの拡大／縮小・パンの状態を初期化
        canvasScale = 1;
        canvasTranslateX = 0;
        canvasTranslateY = 0;
        await startCamera();
        initializePose();
        processVideo();
      });
      
      // ページ読み込み時にカメラデバイスを列挙
      enumerateCameras();
    </script>
  </body>
</html>
