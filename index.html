<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + Joystick 同期版</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    /* ... 既存のスタイルは省略せずそのまま ... */
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
    #mediaArea { display: grid; grid-gap: 10px; padding: 10px; }
    #localVideo, #remoteVideo { width: 100%; height: auto; background: #000; }
    #joystick { box-sizing: border-box; width: 60px; height: 240px; margin: auto; position: relative; border: 4px solid #000; border-radius: 30px; background: #fff; touch-action: none; overscroll-behavior: contain; }
    #joystick #knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; background: #000; transform: translate(-50%, -50%); transition: transform 0.15s; pointer-events: none; }
    /* Portrait & Landscape メディアクエリ同様に */
    @media (orientation: portrait) { /* ... */ }
    @media (orientation: landscape) { /* ... */ }
    #joystickState { font-weight: bold; margin-top: 4px; }
    #controls { padding: 10px; }
    #controls select, #controls input, #controls button { margin: 4px; }
    #log { white-space: pre-wrap; background: #f7f7f7; padding: 8px; margin: 8px; text-align: left; height: 120px; overflow-y: auto; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>WebRTC P2P + ジョイスティック 同期版</h1>
  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>
  <hr/>
  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>
    <div id="userControls">
      <label>カメラ選択:<select id="videoSource"></select></label>
      <button id="startCamera">カメラ開始</button><br/>
      <input type="text" id="targetId" placeholder="相手のIDを入力" />
      <button id="callBtn">発信</button>
    </div>
    <div id="computeControls" style="display:none;">
      <p>計算ノードモード：Unity Video Capture を自動取得して待機します。</p>
    </div>
  </div>
  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>
<script>
  const params    = new URLSearchParams(location.search);
  const role      = params.get('role');
  const isCompute = role === 'compute';

  const joy      = document.getElementById('joystick');
  const knob     = document.getElementById('knob');
  const stateDiv = document.getElementById('joystickState');
  const localVideo  = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const myIdSpan    = document.getElementById('myId');
  const logDiv      = document.getElementById('log');
  const userControls    = document.getElementById('userControls');
  const computeControls = document.getElementById('computeControls');
  const videoSelect = document.getElementById('videoSource');
  const startCamBtn = document.getElementById('startCamera');
  const targetInput = document.getElementById('targetId');
  const callBtn     = document.getElementById('callBtn');

  function log(msg){ logDiv.textContent += '\n' + msg; }

  const peer = new Peer();
  let dataConn = null;
  peer.on('open', id => { myIdSpan.textContent = id; log(`[INFO] 接続完了。ID: ${id}`); });
  peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

  // フレーム送信用の関数
  function sendCurrentFrame() {
    if(!localVideo.videoWidth || !localVideo.videoHeight) return;
    const c = document.createElement('canvas');
    c.width  = localVideo.videoWidth;
    c.height = localVideo.videoHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(localVideo, 0, 0, c.width, c.height);
    const dataURL = c.toDataURL('image/png');
    if(dataConn && dataConn.open) {
      dataConn.send({ type:'frame', image: dataURL });
      log('[INFO] フレーム送信');
    }
  }

  // ジョイスティック状態更新
  let sentUp = false;
  function updateState(v) {
    const label = v < -0.5 ? '上' : v > 0.5 ? '下' : '中心';
    stateDiv.textContent = label;
    if(!isCompute && dataConn && dataConn.open) dataConn.send({ type:'joystick', value:v });
    // 上に移動した瞬間にフレーム送信
    if(label === '上' && !sentUp) {
      sendCurrentFrame(); sentUp = true;
    } else if(label !== '上') {
      sentUp = false;
    }
  }

  function setKnobPosition(v) {
    const rect = joy.getBoundingClientRect();
    const maxY = rect.height/2 - knob.offsetHeight/2;
    const y    = Math.max(-maxY, Math.min(maxY, v*maxY));
    knob.style.transition = 'transform 0.15s';
    knob.style.transform  = `translate(-50%, calc(-50% + ${y}px))`;
    updateState(v);
    setTimeout(() => knob.style.transition = '', 160);
  }

  if(!isCompute) {
    let dragging = false, rect, maxY;
    joy.addEventListener('pointerdown', e => {
      e.preventDefault(); dragging = true;
      rect = joy.getBoundingClientRect(); maxY = rect.height/2 - knob.offsetHeight/2;
      moveAndUpdate(e.clientY);
      joy.setPointerCapture(e.pointerId);
    }, { passive:false });
    joy.addEventListener('pointermove', e => { if(dragging) moveAndUpdate(e.clientY); }, { passive:false });
    joy.addEventListener('pointerup', e => { dragging = false; resetKnob(); }, { passive:false });
    function moveAndUpdate(clientY) {
      let y = clientY - (rect.top + rect.height/2);
      y = Math.max(-maxY, Math.min(maxY, y));
      knob.style.transition=''; knob.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
      updateState(y/maxY);
    }
    function resetKnob() {
      knob.style.transition='transform 0.15s'; knob.style.transform='translate(-50%, -50%)';
      updateState(0); setTimeout(() => knob.style.transition='', 160);
    }
  }

  peer.on('connection', conn => {
    dataConn = conn;
    conn.on('data', d => {
      if(d.type==='joystick') setKnobPosition(d.value);
      else if(d.type==='frame') {
        log('[INFO] フレーム受信');
        // 受信したPNGデータは d.image にbase64形式で格納
        // 必要に応じて表示や処理を実装
      }
    });
    conn.on('open', () => log('[INFO] データチャネル接続完了'));
  });

  // 以下、カメラ選択＆通話部分は元のまま
  if(isCompute) {
    userControls.style.display = 'none'; computeControls.style.display = 'block';
    log("[INFO] 計算モード：仮想カメラ自動取得");
    /*...*/
  } else {
    userControls.style.display = 'block'; computeControls.style.display = 'none';
    log("[INFO] ユーザーモード：カメラ選択");
    /*...*/
  }
</script>
</body>
</html>
