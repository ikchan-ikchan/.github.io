<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>IK Rig Demo</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #info { position: absolute; top: 10px; left: 10px; color: #fff; }
  </style>
</head>
<body>
  <div id="info">ドラッグで赤いターゲットを動かし、Arm の IK を操作できます。</div>
  <script src="https://unpkg.com/three@0.152.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.152.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-ik@0.2.2/dist/three-ik.min.js"></script>
  <script>
    // シーン、カメラ、ライト
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(2, 2, 5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0x888888));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5,10,7);
    scene.add(dirLight);

    // コントロール
    const orbit = new THREE.OrbitControls(camera, renderer.domElement);

    // IK セットアップ
    const ik = new THREE.IK();

    // Arm を構成するボーンを３つ作成
    const bones = [];
    let prevBone = new THREE.Bone();
    prevBone.position.set(0, 0, 0);
    bones.push(prevBone);
    for (let i = 1; i <= 2; i++) {
      const bone = new THREE.Bone();
      bone.position.y = 0.8;  // 各ボーンの長さ
      prevBone.add(bone);
      bones.push(bone);
      prevBone = bone;
    }
    scene.add(bones[0]);

    // Bone の可視化（デバッグ用）
    const skeletonHelper = new THREE.SkeletonHelper(bones[0]);
    skeletonHelper.material.linewidth = 2;
    scene.add(skeletonHelper);

    // IKChain にボーンを追加
    const chain = new THREE.IKChain();
    bones.forEach((bone, idx) => {
      // 最終ボーン（手首）は Free、他は回転制限をつけても OK
      chain.add(new THREE.IKJoint(bone, {
        constraints: idx < bones.length - 1
          ? [ new THREE.IKBallConstraint(180) ]
          : []
      }));
    });
    ik.addChain(chain);

    // IK ターゲット（赤い球）
    const targetGeo = new THREE.SphereGeometry(0.1, 16, 16);
    const targetMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const target = new THREE.Mesh(targetGeo, targetMat);
    target.position.copy(bones[bones.length-1].getWorldPosition(new THREE.Vector3()));
    scene.add(target);

    // IK にターゲットを設定
    chain.setTarget(target);

    // TransformControls でドラッグ可能に
    const transform = new THREE.TransformControls(camera, renderer.domElement);
    transform.attach(target);
    transform.setMode('translate');
    transform.addEventListener('dragging-changed', e => {
      orbit.enabled = !e.value;
    });
    transform.addEventListener('change', () => {
      ik.solve();  // ターゲット動かしたら IK 解く
    });
    scene.add(transform);

    // アニメーションループ
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // ウィンドウリサイズ対応
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
