<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MediaPipe 3D Skeleton + IK Demo</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video,
      canvas {
        display: block;
        margin: 10px auto;
      }
      #threeCanvas {
        width: 640px;
        height: 480px;
      }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose + 3D 骨長フィッティング ＋ 平滑化デモ</h2>
    <video
      id="video"
      autoplay
      muted
      playsinline
      style="display:none"
    ></video>
    <canvas id="outputCanvas"></canvas>
    <canvas id="threeCanvas"></canvas>

    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <script>
      // ---- HTML エレメント ----
      const video = document.getElementById("video");
      const outputCanvas = document.getElementById("outputCanvas");
      const ctx2d = outputCanvas.getContext("2d");
      const threeCanvas = document.getElementById("threeCanvas");

      // ---- Three.js シーンセットアップ ----
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        threeCanvas.clientWidth / threeCanvas.clientHeight,
        0.1,
        1000
      );
      camera.position.set(0, 200, 400);
      const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas });
      renderer.setSize(
        threeCanvas.clientWidth,
        threeCanvas.clientHeight
      );
      // ライト
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(0, 200, 100).normalize();
      scene.add(light);

      // ボーン接続リスト (Mediapipe の 33 点から代表 24 本)
      const POSE_CONNECTIONS = [
        [0, 1], [1, 2], [2, 3], [3, 7],
        [0, 4], [4, 5], [5, 6], [6, 8],
        [9,10],[11,12],[11,13],[13,15],
        [12,14],[14,16],[15,17],[16,18],
        [11,23],[12,24],[23,24],[23,25],
        [24,26],[25,27],[26,28]
      ];

      // Three.js で線オブジェクトを用意
      const boneLines = [];
      POSE_CONNECTIONS.forEach(() => {
        const mat = new THREE.LineBasicMaterial({ color: 0x00ff00 });
        const geom = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(),
          new THREE.Vector3()
        ]);
        const line = new THREE.Line(geom, mat);
        scene.add(line);
        boneLines.push(line);
      });

      // ---- 状態変数 ----
      let initialBoneLengths = null; // [[parentIdx, childIdx, length],...]
      let prevSmoothed = []; // jointごとの smoothed ポジション
      const smoothAlpha = 0.7; // 平滑化係数（小さくするほど滑らか）

      // ---- MediaPipe Pose の初期化 ----
      const pose = new Pose({
        locateFile: (file) =>
          `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
      });
      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });
      pose.onResults(onResults);

      // カメラ開始
      async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
        });
        video.srcObject = stream;
        await new Promise((r) => (video.onloadedmetadata = r));
        outputCanvas.width = video.videoWidth;
        outputCanvas.height = video.videoHeight;
      }

      // 1フレーム処理
      async function onResults(results) {
        // 2D 描画
        ctx2d.save();
        ctx2d.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        ctx2d.drawImage(
          results.image,
          0,
          0,
          outputCanvas.width,
          outputCanvas.height
        );
        if (results.poseLandmarks) {
          drawConnectors(
            ctx2d,
            results.poseLandmarks,
            POSE_CONNECTIONS,
            { color: "lime", lineWidth: 2 }
          );
          drawLandmarks(ctx2d, results.poseLandmarks, {
            color: "red",
            lineWidth: 1,
          });
        }
        ctx2d.restore();

        // worldLandmarks (meters 単位)
        const w = results.worldLandmarks;
        if (!w) return;

        // 初期フレームで骨長を計算
        if (!initialBoneLengths) {
          initialBoneLengths = POSE_CONNECTIONS.map(([p, c]) => {
            const a = new THREE.Vector3(
              w[p].x,
              w[p].y * -1,
              w[p].z * -1
            );
            const b = new THREE.Vector3(
              w[c].x,
              w[c].y * -1,
              w[c].z * -1
            );
            return [p, c, a.distanceTo(b)];
          });
          // 初期 prevSmoothed を設定
          prevSmoothed = w.map((lm) =>
            new THREE.Vector3(
              lm.x,
              lm.y * -1,
              lm.z * -1
            )
          );
        }

        // ボーン長フィッティング＋平滑化
        const smoothed = prevSmoothed.map((v) => v.clone());
        // まず rawPositions を取り込む
        const raw = w.map((lm) =>
          new THREE.Vector3(
            lm.x,
            lm.y * -1,
            lm.z * -1
          )
        );
        // ボーンごとに長さを固定
        initialBoneLengths.forEach(([p, c, L]) => {
          const parent = smoothed[p];
          const dir = raw[c].clone().sub(raw[p]).normalize();
          const fitted = parent.clone().add(dir.multiplyScalar(L));
          smoothed[c].copy(
            fitted.lerp(prevSmoothed[c], 1 - smoothAlpha)
          );
        });
        // 根元（0）だけ平滑化
        smoothed[0].copy(
          raw[0].clone().lerp(prevSmoothed[0], 1 - smoothAlpha)
        );

        // Three.js のライン更新
        boneLines.forEach((line, idx) => {
          const [p, c] = POSE_CONNECTIONS[idx];
          const pa = smoothed[p]
            .clone()
            .multiplyScalar(100); // m→cm スケーリング
          const cb = smoothed[c].clone().multiplyScalar(100);
          const posArr = new Float32Array([
            pa.x, pa.y, pa.z,
            cb.x, cb.y, cb.z,
          ]);
          line.geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(posArr, 3)
          );
          line.geometry.attributes.position.needsUpdate = true;
        });

        // 次フレーム用に保存
        prevSmoothed = smoothed;

        // レンダリング
        renderer.render(scene, camera);
      }

      // メインループ
      async function run() {
        await startCamera();
        async function frameLoop() {
          await pose.send({ image: video });
          requestAnimationFrame(frameLoop);
        }
        frameLoop();
      }

      run();
    </script>
  </body>
</html>
