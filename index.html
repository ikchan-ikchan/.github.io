<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 記録 + 3D表示（線・面付き・回転可能・タッチ対応）デモ</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video, canvas {
        display: block;
        margin: 10px auto;
      }
      #controls {
        margin: 10px;
      }
      #maxResolutionInfo, #poseCoordinates {
        margin-top: 5px;
        font-size: 0.9em;
        color: #555;
      }
      table {
        margin: auto;
        border-collapse: collapse;
      }
      table, th, td {
        border: 1px solid #aaa;
        padding: 4px;
      }
      /* 3D 表示エリアのスタイル */
      #threeContainer {
        margin: 10px auto;
        width: 640px;
        height: 300px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: カメラ選択, FPS, 解像度指定 & 記録 + 3D表示（線・面付き・回転可能・タッチ対応）デモ</h2>
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
      &nbsp;&nbsp;
      <label for="resPercentInput">解像度 (%):</label>
      <input type="number" id="resPercentInput" min="1" max="100" value="100" style="width:60px;">
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
      &nbsp;&nbsp;
      <button id="captureButton">記録</button>
      <div id="maxResolutionInfo"></div>
    </div>
    
    <!-- カメラ映像（内部利用：Canvas に描画） -->
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <!-- 描画用キャンバス（2D 表示） -->
    <canvas id="outputCanvas"></canvas>
    
    <!-- Pose 座標表示用 -->
    <div id="poseCoordinates"></div>
    <!-- 3D 表示用コンテナ -->
    <div id="threeContainer"></div>
    
    <!-- MediaPipe Pose と Drawing Utils の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- Three.js の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls (非モジュール版) の読み込み -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- ConvexGeometry の読み込み（面生成用） -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/geometries/ConvexGeometry.js"></script>
    
    <script>
      const video = document.getElementById('video');
      const outputCanvas = document.getElementById('outputCanvas');
      const canvasCtx = outputCanvas.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const resPercentInput = document.getElementById('resPercentInput');
      const startButton = document.getElementById('startButton');
      const captureButton = document.getElementById('captureButton');
      const maxResolutionInfo = document.getElementById('maxResolutionInfo');
      const poseCoordinatesDiv = document.getElementById('poseCoordinates');
      const threeContainer = document.getElementById('threeContainer');
      
      let pose = null;
      let processingLoopId = null;
      // 最新の検出結果を保持するグローバル変数
      let latestResults = null;
      
      // ① 利用可能なカメラの列挙
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `カメラ ${index + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (error) {
          console.error('カメラの列挙に失敗:', error);
        }
      }
      
      // ② MediaPipe Pose の初期化
      function initializePose() {
        pose = new Pose({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
          }
        });
        pose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        // onResults 内で描画と最新結果の保存
        pose.onResults((results) => {
          latestResults = results;
          canvasCtx.save();
          canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
          canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
          if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, Pose.POSE_CONNECTIONS, { color: 'lime', lineWidth: 2 });
            drawLandmarks(canvasCtx, results.poseLandmarks, { color: 'red', lineWidth: 1 });
          }
          canvasCtx.restore();
        });
      }
      
      // ③ 選択したカメラで、最大解像度の何％かを指定して映像を取得する
      async function startCamera() {
        const selectedDeviceId = cameraSelect.value;
        const tempConstraints = { video: { deviceId: { exact: selectedDeviceId } } };
        let tempStream;
        try {
          tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
        } catch (error) {
          console.error('初回ストリームの取得に失敗:', error);
          return;
        }
        const videoTrack = tempStream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        let maxWidth = (capabilities.width && capabilities.width.max) || 640;
        let maxHeight = (capabilities.height && capabilities.height.max) || 480;
        maxResolutionInfo.innerText = `このカメラの最大解像度: ${maxWidth} x ${maxHeight}`;
        tempStream.getTracks().forEach(track => track.stop());
        
        const resPercent = parseInt(resPercentInput.value) || 100;
        const desiredWidth = Math.floor(maxWidth * (resPercent / 100));
        const desiredHeight = Math.floor(maxHeight * (resPercent / 100));
        const frameRate = parseInt(frameRateInput.value) || 15;
        
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { exact: desiredWidth },
            height: { exact: desiredHeight },
            frameRate: { ideal: frameRate }
          }
        };
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          return new Promise(resolve => {
            video.onloadedmetadata = () => {
              outputCanvas.width = video.videoWidth;
              outputCanvas.height = video.videoHeight;
              video.play();
              resolve();
            };
          });
        } catch (error) {
          console.error('カメラ映像の取得に失敗:', error);
        }
      }
      
      // ④ 映像フレームを MediaPipe Pose に送信するループ
      async function processVideo() {
        const frameRate = parseInt(frameRateInput.value) || 15;
        const interval = 1000 / frameRate;
        async function sendFrame() {
          if (!video.paused && !video.ended) {
            await pose.send({ image: video });
          }
          processingLoopId = setTimeout(sendFrame, interval);
        }
        sendFrame();
      }
      
      // ⑤ 「開始」ボタン押下時の処理
      startButton.addEventListener('click', async () => {
        await startCamera();
        initializePose();
        processVideo();
      });
      
      // ⑥ 「記録」ボタン押下時の処理：ループ停止、座標テーブルおよび 3D 表示を更新
      captureButton.addEventListener('click', () => {
        clearTimeout(processingLoopId);
        if (latestResults && latestResults.poseLandmarks) {
          let html = '<h3>記録された座標 (x, y, z)</h3>';
          html += '<table>';
          html += '<tr><th>Index</th><th>x</th><th>y</th><th>z</th></tr>';
          latestResults.poseLandmarks.forEach((landmark, index) => {
            html += `<tr>
                        <td>${index}</td>
                        <td>${landmark.x.toFixed(3)}</td>
                        <td>${landmark.y.toFixed(3)}</td>
                        <td>${landmark.z.toFixed(3)}</td>
                     </tr>`;
          });
          html += '</table>';
          poseCoordinatesDiv.innerHTML = html;
          draw3DPoints(latestResults.poseLandmarks);
        } else {
          poseCoordinatesDiv.innerHTML = '<p>まだポーズが検出されていません。</p>';
          threeContainer.innerHTML = '';
        }
      });
      
      // ⑦ Three.js を用いた 3D 表示関数（OrbitControls により回転・タッチ操作可能、灰色地面付き、線・面付き）
      function draw3DPoints(landmarks) {
        // 既存シーンのクリア
        threeContainer.innerHTML = '';
        
        // シーン、カメラ、レンダラーの作成
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        threeContainer.appendChild(renderer.domElement);
        
        // OrbitControls の設定（タッチ操作にも対応、ダンピング有効）
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.screenSpacePanning = true;
        
        // 環境光を追加
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        // 灰色の地面（グラウンドプレーン）を追加
        const planeGeometry = new THREE.PlaneGeometry(400, 400);
        const planeMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -50;
        scene.add(plane);
        
        // 各ランドマークを小さな球体として追加
        const pointGeometry = new THREE.SphereGeometry(2, 16, 16);
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const landmarkPositions = [];  // すべての点の位置情報を保持
        landmarks.forEach(landmark => {
          if (landmark) {
            const sphere = new THREE.Mesh(pointGeometry, pointMaterial);
            const posX = (landmark.x - 0.5) * 100;
            const posY = (0.5 - landmark.y) * 100;
            const posZ = landmark.z * 100;
            sphere.position.set(posX, posY, posZ);
            scene.add(sphere);
            landmarkPositions.push(new THREE.Vector3(posX, posY, posZ));
          }
        });
        
        // 線で体の構造を分かりやすく（Pose.POSE_CONNECTIONS を使用）
        if (typeof Pose !== "undefined" && Pose.POSE_CONNECTIONS) {
          const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
          const linePoints = [];
          Pose.POSE_CONNECTIONS.forEach(pair => {
            const i = pair[0];
            const j = pair[1];
            if (landmarks[i] && landmarks[j]) {
              const p1 = new THREE.Vector3(
                (landmarks[i].x - 0.5) * 100,
                (0.5 - landmarks[i].y) * 100,
                landmarks[i].z * 100
              );
              const p2 = new THREE.Vector3(
                (landmarks[j].x - 0.5) * 100,
                (0.5 - landmarks[j].y) * 100,
                landmarks[j].z * 100
              );
              linePoints.push(p1, p2);
            }
          });
          if (linePoints.length > 0) {
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(linePoints);
            const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(lineSegments);
          }
        }
        
        // 面（凸包）を追加（全ランドマークから）
        if (landmarkPositions.length > 0) {
          try {
            const convexGeometry = new THREE.ConvexGeometry(landmarkPositions);
            const convexMaterial = new THREE.MeshLambertMaterial({
              color: 0x00ffff,
              opacity: 0.3,
              transparent: true,
              side: THREE.DoubleSide
            });
            const convexMesh = new THREE.Mesh(convexGeometry, convexMaterial);
            scene.add(convexMesh);
          } catch (e) {
            console.warn("ConvexGeometry の生成に失敗:", e);
          }
        }
        
        // カメラ位置を設定（全体が見渡せる位置に）
        camera.position.set(0, 0, 150);
        
        // アニメーションループ（OrbitControls によりマウス・タッチ操作で回転、ズーム可能）
        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      }
      
      // ページ読み込み時にカメラを列挙
      enumerateCameras();
    </script>
  </body>
</html>
