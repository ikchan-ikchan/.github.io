<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Pose + Segmentation デモ</title>
    <style>
      body { font-family: sans-serif; text-align: center; }
      video, canvas { display: block; margin: 10px auto; }
      #controls { margin: 10px; }
      #maxResolutionInfo { font-size:0.9em; color:#555; }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose ＋ Selfie Segmentation デモ</h2>
    <div id="controls">
      <label>カメラ:
        <select id="cameraSelect"></select>
      </label>
      <label>fps:
        <input type="number" id="frameRateInput" value="15" style="width:60px;">
      </label>
      <label>解像度%:
        <input type="number" id="resPercentInput" value="100" style="width:60px;">
      </label>
      <button id="startButton">開始</button>
      <div id="maxResolutionInfo"></div>
    </div>

    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <!-- このキャンバスに：①動画、②マスク、③Pose描画 を重ねます -->
    <canvas id="outputCanvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const camSelect = document.getElementById('cameraSelect');
    const fpsInput = document.getElementById('frameRateInput');
    const resInput = document.getElementById('resPercentInput');
    const startBtn = document.getElementById('startButton');
    const maxInfo = document.getElementById('maxResolutionInfo');

    let pose, seg, loopId;

    // カメラ列挙
    navigator.mediaDevices.enumerateDevices().then(devs=>{
      devs.filter(d=>d.kind==='videoinput')
          .forEach((d,i)=> camSelect.innerHTML+=
            `<option value="${d.deviceId}">${d.label||'カメラ'+(i+1)}</option>`
          );
    });

    // Pose 初期化
    function initPose(){
      pose = new Pose({ locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}` });
      pose.setOptions({ modelComplexity:1, smoothLandmarks:true, minDetectionConfidence:0.5 });
      pose.onResults(onResults);
    }
    // Segmentation 初期化
    function initSeg(){
      seg = new SelfieSegmentation({ locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}` });
      seg.setOptions({ modelSelection:1 });
      seg.onResults(onResults);
    }

    // 両方の結果を同じコールバックで受ける
    function onResults(results){
      // 1) マスクを動画の上に
      ctx.save();
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      if(results.segmentationMask){
        ctx.globalCompositeOperation = 'source-atop';
        ctx.fillStyle = 'rgba(128,128,128,0.5)';
        ctx.drawImage(
          results.segmentationMask, 0, 0,
          canvas.width, canvas.height
        );
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.globalCompositeOperation = 'source-over';
      }
      // 2) Pose を上書き描画
      if(results.poseLandmarks){
        drawConnectors(ctx, results.poseLandmarks, Pose.POSE_CONNECTIONS,
                       {color:'lime', lineWidth:2});
        drawLandmarks(ctx, results.poseLandmarks,
                      {color:'red', lineWidth:1});
      }
      ctx.restore();
    }

    // カメラ開始
    async function start(){
      // 解像度調査
      const devId = camSelect.value;
      let tmp = await navigator.mediaDevices.getUserMedia({video:{deviceId:devId}});
      const track = tmp.getVideoTracks()[0];
      const caps = track.getCapabilities();
      const maxW = caps.width?.max||640, maxH = caps.height?.max||480;
      maxInfo.innerText=`最大解像度: ${maxW}×${maxH}`;
      tmp.getTracks().forEach(t=>t.stop());

      // 希望解像度＆fps
      const p=+resInput.value, w=Math.floor(maxW*p/100), h=Math.floor(maxH*p/100);
      const fps=+fpsInput.value;
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ deviceId:devId, width:{exact:w}, height:{exact:h}, frameRate:{ideal:fps} }
      });
      video.srcObject = stream;
      await new Promise(r=>video.onloadedmetadata=r);
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;

      initPose();
      initSeg();

      // ループ実行
      (function loop(){
        pose.send({image:video});
        seg.send({image:video});
        loopId = setTimeout(loop,1000/fps);
      })();
    }

    startBtn.onclick = ()=>{
      clearTimeout(loopId);
      start();
    };
    </script>
  </body>
</html>
