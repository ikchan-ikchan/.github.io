<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + ジョイスティック + 双方向録画＆スナップショット</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
    #mediaArea { display: grid; grid-gap: 10px; padding: 10px; }
    #localVideo, #remoteVideo, #snapshotImg { width: 100%; height: auto; background: #000; }
    #joystick { box-sizing: border-box; width: 60px; height: 240px; margin: auto;
                position: relative; border: 4px solid #000; border-radius: 30px;
                background: #fff; touch-action: none; overscroll-behavior: contain; }
    #knob { position: absolute; left:50%; top:50%; width:40px; height:40px;
            border-radius:50%; background:#000; transform:translate(-50%,-50%);
            transition:transform .15s; pointer-events:none; }
    #joystickState { font-weight:bold; margin-top:4px; }
    #controls { padding:10px; }
    #controls select, #controls input, #controls button { margin:4px; }
    #log { white-space: pre-wrap; background:#f7f7f7; padding:8px;
           margin:8px; text-align:left; height:120px; overflow-y:auto;
           font-size:0.9em; }
    /* Portrait */
    @media (orientation: portrait) {
      #mediaArea {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "localVideo joystick"
          "remoteMedia joystick";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo   { grid-area: localVideo; }
      #remoteVideo, #snapshotImg { grid-area: remoteMedia; }
      #joystick     { grid-area: joystick; }
    }
    /* Landscape */
    @media (orientation: landscape) {
      #mediaArea {
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "localVideo joystick remoteMedia";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo   { grid-area: localVideo; }
      #remoteVideo, #snapshotImg { grid-area: remoteMedia; }
      #joystick     { grid-area: joystick; }
    }
  </style>
</head>
<body>
  <h1>WebRTC P2P + ジョイスティック + 双方向録画＆スナップ</h1>

  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline controls style="display:none;"></video>
    <img id="snapshotImg" style="display:none;" />
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>
  <hr/>

  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>

    <div id="userControls">
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button><br/>
      <input type="text" id="targetId" placeholder="相手のIDを入力" />
      <button id="connectBtn">接続</button>
    </div>

    <div id="computeControls" style="display:none;">
      <p id="computeMsg">計算ノードモード：Unity カメラ検出中…</p>
      <div id="fallbackUI" style="display:none;">
        <label>カメラ手動選択:
          <select id="computeVideoSel"></select>
        </label>
        <button id="retryBtn">再検出</button>
        <button id="computeStartBtn">このカメラで開始</button>
      </div>
    </div>

    <!-- 録画ボタン非表示 -->
    <button id="recordBtn" style="display:none;"></button>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

<script>
// — ヘルパー —
const $        = id => document.getElementById(id);
const log      = msg => { console.log(msg); $('log').textContent += '\n'+msg; $('log').scrollTop = $('log').scrollHeight; };
const params   = new URLSearchParams(location.search);
const isCompute= params.get('role')==='compute';

// — DOM —
const localVideo   = $('localVideo');
const remoteVideo  = $('remoteVideo');
const snapshotImg  = $('snapshotImg');
const joy          = $('joystick');
const knob         = $('knob');
const stateDiv     = $('joystickState');
const myIdSpan     = $('myId');
const videoSelect  = $('videoSource');
const startCamBtn  = $('startCamera');
const targetInput  = $('targetId');
const connectBtn   = $('connectBtn');

// — PeerJS —
const peer = new Peer();
peer.on('open', id => { myIdSpan.textContent = id; log('[INFO] PeerJS open: '+id); });
peer.on('error', e  => log('[ERROR] PeerJS: '+e));

// — DataChannel —
let dataConn = null;
function setupDataChannel(conn){
  dataConn = conn;
  conn.on('open',  ()=> log('[INFO] DC open'));
  conn.on('error', e=> log('[ERROR] DC: '+e));
  conn.on('data',  handleData);
}

// — 受信ロジック —
let recvBuf=[], recvType='', idleTimer=null;
const IDLE_TIMEOUT_MS = 2000;
let inSnapshot=false;

function finishReceive(){
  if(!recvBuf.length) return;
  const blob = new Blob(recvBuf, { type: recvType });
  if(inSnapshot){
    // スナップショット表示
    remoteVideo.style.display   = 'none';
    snapshotImg.src             = URL.createObjectURL(blob);
    snapshotImg.style.display   = 'block';
    log('[INFO] スナップショット受信完了 ('+blob.size+'b)');
    inSnapshot = false;
  } else {
    // 動画再生
    snapshotImg.style.display   = 'none';
    remoteVideo.pause();
    remoteVideo.srcObject       = null;
    remoteVideo.src             = URL.createObjectURL(blob);
    remoteVideo.muted           = true;
    remoteVideo.style.display   = 'block';
    remoteVideo.play().catch(()=>{});
    log('[INFO] 動画受信完了 ('+blob.size+'b)');
  }
  recvBuf = [];
  recvType = '';
}

function handleData(d){
  if(typeof d==='object' && d.type==='file-info'){
    recvType   = d.fileType;
    inSnapshot = false;
    recvBuf    = [];
    return;
  }
  if(typeof d==='object' && d.type==='snapshot-info'){
    recvType   = d.fileType;
    inSnapshot = true;
    recvBuf    = [];
    return;
  }
  if(d instanceof ArrayBuffer){
    recvBuf.push(d);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(finishReceive, IDLE_TIMEOUT_MS);
    return;
  }
  if(typeof d==='object' && d.type==='joystick'){
    // 相手側ノブ位置更新のみ
    const v = d.value;
    const rect = joy.getBoundingClientRect();
    const maxY = rect.height/2 - knob.offsetHeight/2;
    const y    = Math.max(-maxY, Math.min(maxY, v*maxY));
    knob.style.transition='transform .15s';
    knob.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
    stateDiv.textContent = v<-0.5?'上':v>0.5?'下':'中心';
    setTimeout(()=>knob.style.transition='',160);
  }
}

// — MediaRecorder —
let mediaRecorder = null;
function setupRecorder(stream){
  mediaRecorder = new MediaRecorder(stream, {
    mimeType:'video/webm;codecs=vp9',
    videoBitsPerSecond:5_000_000
  });
  mediaRecorder.onstart = ()=>{};
  mediaRecorder.ondataavailable = async e=>{
    if(e.data && e.data.size){
      const buf = await e.data.arrayBuffer();
      dataConn && dataConn.send(buf);
    }
  };
}

// — スナップショット送信関数 —
function sendSnapshot(){
  if(!dataConn||!dataConn.open) return;
  const canvas = document.createElement('canvas');
  canvas.width  = localVideo.videoWidth;
  canvas.height = localVideo.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async blob=>{
    const buf = await blob.arrayBuffer();
    dataConn.send({type:'snapshot-info', fileType: blob.type});
    dataConn.send(buf);
    log('[INFO] スナップショット送信 ('+buf.byteLength+'b)');
  }, 'image/png');
}

// — 録画機能 —
function setupRecorderAndSignal(stream){
  setupRecorder(stream);
  // 省略（録画はジョイスティック下倒しで制御する場合は別実装）
}

// — ジョイスティック操作（両モード有効） —
let dragging=false, rect, maxY;
let prevUp=false;
joy.addEventListener('pointerdown',e=>{
  e.preventDefault(); dragging=true;
  rect=joy.getBoundingClientRect();
  maxY=rect.height/2 - knob.offsetHeight/2;
  joy.setPointerCapture(e.pointerId);
  moveAndUpdate(e.clientY);
},{passive:false});
joy.addEventListener('pointermove',e=>{
  if(dragging){ e.preventDefault(); moveAndUpdate(e.clientY); }
},{passive:false});
joy.addEventListener('pointerup',e=>{
  e.preventDefault(); dragging=false;
  knob.style.transition='transform .15s';
  knob.style.transform='translate(-50%,-50%)';
  setTimeout(()=>knob.style.transition='',160);
  updateState(0);
},{passive:false});

function moveAndUpdate(cy){
  let y = cy - (rect.top + rect.height/2);
  y = Math.max(-maxY, Math.min(maxY, y));
  knob.style.transition = '';
  knob.style.transform  = `translate(-50%, calc(-50% + ${y}px))`;
  const v = y / maxY;
  updateState(v);
}

function updateState(v){
  stateDiv.textContent = v<-0.5?'上':v>0.5?'下':'中心';
  // 送信側もジョイスティック位置を相手に通知
  if(dataConn && dataConn.open){
    dataConn.send({type:'joystick', value:v});
  }
  // 上倒し時：スナップショット送信 on edge
  if(v < -0.5){
    if(!prevUp){
      sendSnapshot();
      prevUp = true;
    }
  } else {
    prevUp = false;
  }
}

// — モード別初期化 —
if(!isCompute){
  // ユーザーモード
  $('computeControls').style.display='none';
  navigator.mediaDevices.enumerateDevices().then(devs=>{
    devs.filter(d=>d.kind==='videoinput').forEach(d=>{
      const o=document.createElement('option');
      o.value=d.deviceId; o.text=d.label||d.deviceId;
      $('videoSource').appendChild(o);
    });
  });
  $('startCamera').onclick = ()=>{
    const id = $('videoSource').value;
    if(!id){ log('[ERROR] カメラ未選択'); return; }
    navigator.mediaDevices.getUserMedia({
      video:{deviceId:{exact:id},width:1920,height:1080},
      audio:true
    }).then(stream=>{
      localVideo.srcObject = stream;
      setupRecorder(stream);
      log('[INFO] カメラ開始: '+stream.getVideoTracks()[0].label);
    }).catch(e=>log('[ERROR] getUserMedia:'+e.message));
  };
  $('connectBtn').onclick = ()=>{
    const tgt = $('targetId').value.trim();
    if(!tgt){ log('[ERROR] IDを入力'); return; }
    setupDataChannel(peer.connect(tgt));
  };
} else {
  // 計算ノードモード
  $('userControls').style.display    = 'none';
  $('computeControls').style.display = 'block';
  const computeMsg = $('computeMsg'),
        fbUI       = $('fallbackUI'),
        sel        = $('computeVideoSel'),
        retryBtn   = $('retryBtn'),
        computeBtn = $('computeStartBtn');
  function fillList(){
    sel.innerHTML = '';
    navigator.mediaDevices.enumerateDevices().then(devs=>{
      devs.filter(d=>d.kind==='videoinput').forEach(d=>{
        const o=document.createElement('option');
        o.value=d.deviceId; o.text=d.label||d.deviceId;
        sel.appendChild(o);
      });
    });
  }
  async function waitUnity(max=6,intv=1500){
    for(let i=0;i<max;i++){
      const devs=await navigator.mediaDevices.enumerateDevices();
      const cam=devs.find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
      if(cam) return cam;
      await new Promise(r=>setTimeout(r,intv));
    }
    return null;
  }
  async function startComputeCam(id){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({
        video:{deviceId:{exact:id},width:1920,height:1080},
        audio:true
      });
      localVideo.srcObject = stream;
      setupRecorder(stream);
      computeMsg.textContent='カメラ起動完了';
      fbUI.style.display='none';
      log('[INFO] Compute camera started');
    }catch(e){ log('[ERROR] compute cam:'+e.message); }
  }
  (async ()=>{
    const cam=await waitUnity();
    if(cam) startComputeCam(cam.deviceId);
    else{
      computeMsg.textContent='Unity カメラ未検出。手動選択してください';
      fbUI.style.display='block'; fillList();
    }
  })();
  navigator.mediaDevices.ondevicechange = async ()=>{
    if(localVideo.srcObject) return;
    const devs=await navigator.mediaDevices.enumerateDevices();
    const cam=devs.find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
    if(cam) startComputeCam(cam.deviceId);
  };
  retryBtn.onclick = ()=>{
    fbUI.style.display='none'; computeMsg.textContent='再検出中…';
    (async ()=>{
      const cam=await waitUnity(5,1000);
      if(cam) startComputeCam(cam.deviceId);
      else{ computeMsg.textContent='見つからず。手動選択を使用'; fbUI.style.display='block'; fillList(); }
    })();
  };
  computeBtn.onclick = ()=> startComputeCam(sel.value);
  peer.on('connection', conn=>{
    log('[INFO] DC 接続'); setupDataChannel(conn);
  });
}
</script>
</body>
</html>
