<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebRTC P2P デモ + Joystick 操作モード</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family:sans-serif; text-align:center; margin:0; padding:0 }
    #mediaArea { display:grid; grid-gap:10px; padding:10px; }
    #localVideo,#remoteVideo { width:100%; height:auto; background:#000; }
    /* Portrait */
    @media (orientation: portrait) {
      #mediaArea {
        grid-template-columns:1fr auto;
        grid-template-rows:auto auto;
        grid-template-areas:
          "localVideo joystick"
          "remoteVideo joystick";
        align-items:center;
        height:calc(100vh - 260px);
      }
    }
    /* Landscape */
    @media (orientation: landscape) {
      #mediaArea {
        grid-template-columns:1fr auto 1fr;
        grid-template-rows:auto;
        grid-template-areas:"localVideo joystick remoteVideo";
        align-items:center;
        height:calc(100vh - 260px);
      }
    }
    #localVideo  { grid-area:localVideo }
    #remoteVideo { grid-area:remoteVideo }

    /* ジョイスティック */
    #joystick {
      grid-area:joystick;
      width:60px; height:240px;
      margin:auto;
      position:relative;
      border:4px solid #000; border-radius:30px;
      background:#fff;
      touch-action:none; overscroll-behavior:contain;
    }
    #joystick #knob {
      position:absolute; left:50%; top:50%;
      width:40px; height:40px;
      border-radius:50%; background:#000;
      transform:translate(-50%,-50%);
      transition:transform .15s;
      pointer-events:none;
    }
    #joystickState {
      font-weight:bold; margin-top:4px;
    }

    /* コントロール・録画プレイヤー */
    #controls{padding:10px;}
    #controls select,input,button{margin:4px;}
    #recorder {
      margin-top:8px;
      display:flex; justify-content:center; align-items:center; gap:8px;
    }
    #recorder video {
      width:200px; height:140px;
      background:#000;
    }
    #recorder button { padding:4px 8px }

    #log {
      white-space:pre-wrap; background:#f7f7f7;
      padding:8px; margin:8px; text-align:left;
      height:120px; overflow-y:auto; font-size:0.9em;
    }
  </style>
</head>
<body>
  <h1>WebRTC P2P + Joystick 操作</h1>

  <!-- 映像＋ジョイスティック -->
  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>

  <hr/>

  <!-- 通信操作 -->
  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>

    <div id="userControls">
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button><br/>
      <input type="text" id="targetId" placeholder="相手のIDを入力">
      <button id="callBtn">発信</button>
    </div>
    <div id="computeControls" style="display:none;">
      <p>計算モード：Unity Video Capture を自動取得して待機します。</p>
    </div>
  </div>

  <!-- 録画プレイヤー（下スライド時の録画結果を再生） -->
  <div id="recorder">
    <video id="recordedPlayback" controls loop></video>
    <div>
      <button id="playBtn">▶️ 再生</button>
      <button id="pauseBtn">⏸ 停止</button>
      <button id="downloadBtn">⬇️ ダウンロード</button>
    </div>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

<script>
  // ─────────────────────────────────────────
  // ジョイスティック制御＋モード管理
  // ─────────────────────────────────────────
  (function(){
    const joy  = document.getElementById('joystick');
    const knob = document.getElementById('knob');
    const stateDiv = document.getElementById('joystickState');
    let dragging=false, rect, maxY, joyValue=0;
    window.joyValue = () => joyValue;  // Selenium から参照可能

    function updateState(v){
      joyValue = v;
      if(v < -0.5) stateDiv.textContent='上';
      else if(v > 0.5) stateDiv.textContent='下';
      else stateDiv.textContent='中心';
    }
    function moveKnob(y){
      let dy = y - (rect.top + rect.height/2);
      dy = Math.max(-maxY, Math.min(maxY, dy));
      knob.style.transform = `translate(-50%,calc(-50%+${dy}px))`;
      updateState(dy/maxY);
    }
    function centerKnob(){
      knob.style.transition='transform .15s';
      knob.style.transform='translate(-50%,-50%)';
      updateState(0);
      setTimeout(()=>knob.style.transition='',160);
    }
    joy.addEventListener('pointerdown',e=>{
      e.preventDefault();
      dragging=true;
      rect=joy.getBoundingClientRect();
      maxY=rect.height/2 - knob.offsetHeight/2;
      moveKnob(e.clientY);
      joy.setPointerCapture(e.pointerId);
    },{passive:false});
    joy.addEventListener('pointermove',e=>{
      e.preventDefault();
      if(dragging) moveKnob(e.clientY);
    },{passive:false});
    joy.addEventListener('pointerup',e=>{
      e.preventDefault();
      dragging=false; centerKnob();
    },{passive:false});
  })();

  // ─────────────────────────────────────────
  // PeerJS 通信ロジック
  // ─────────────────────────────────────────
  const params    = new URLSearchParams(location.search);
  const role      = params.get('role');
  const isCompute = role === 'compute';

  const localV   = document.getElementById('localVideo');
  const remoteV  = document.getElementById('remoteVideo');
  const myIdSpan = document.getElementById('myId');
  const logDiv   = document.getElementById('log');
  const userC    = document.getElementById('userControls');
  const compC    = document.getElementById('computeControls');
  const vidSel   = document.getElementById('videoSource');
  const startBtn = document.getElementById('startCamera');
  const tgtInput = document.getElementById('targetId');
  const callBtn  = document.getElementById('callBtn');

  function log(msg){
    console.log(msg);
    logDiv.textContent += '\n'+msg;
  }

  const peer = new Peer();
  peer.on('open',id=>{
    myIdSpan.textContent=id;
    log(`[INFO] 接続完了。ID=${id}`);
  });
  peer.on('error',err=>log(`[ERROR] PeerJS: ${err}`));

  if(isCompute){
    userC.style.display='none'; compC.style.display='block';
    log("[INFO] 計算モード：Unity Video Capture 自動選択");

    navigator.mediaDevices.enumerateDevices()
      .then(devs=>{
        const cam=devs.find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
        if(!cam){ log("[ERROR] 仮想カメラ見つからず"); throw ""; }
        log(`[INFO] ${cam.label} を開始`);
        return navigator.mediaDevices.getUserMedia({
          video:{deviceId:{exact:cam.deviceId}},
          audio:false });
      })
      .then(st=>{
        localV.srcObject=st; log("[INFO] VC映像取得");
        peer.on('call',call=>{
          log("[INFO] 着信→応答");
          call.answer(st);
          call.on('stream',s=>{
            remoteV.srcObject=s;
            log("[INFO] ユーザー映像受信");
          });
        });
      })
      .catch(e=>{
        log(`[ERROR] VC取得失敗: ${e}`);
        peer.on('call',call=>{
          log("[WARN] 映像なしで応答");
          call.answer(null);
        });
      });

  } else {
    userC.style.display='block'; compC.style.display='none';
    log("[INFO] ユーザーモード：カメラ選択して開始");

    navigator.mediaDevices.enumerateDevices()
      .then(devs=>{
        vidSel.innerHTML='';
        devs.filter(d=>d.kind==='videoinput')
            .forEach(d=>{
              let o=document.createElement('option');
              o.value=d.deviceId; o.text=d.label||d.deviceId;
              vidSel.appendChild(o);
            });
      });

    startBtn.onclick=()=>{
      let id=vidSel.value;
      if(!id){ log("[ERROR] カメラ未選択"); return; }
      navigator.mediaDevices.getUserMedia({
        video:{deviceId:{exact:id}}, audio:false
      })
      .then(st=>{
        localV.srcObject=st; window.localStream=st;
        log(`[INFO] カメラ開始: ${st.getVideoTracks()[0].label}`);
      })
      .catch(e=>log(`[ERROR] カメラ取得失敗: ${e.message}`));
    };

    callBtn.onclick=()=>{
      let t=tgtInput.value.trim();
      if(!t){ log("[ERROR] ID未入力"); return; }
      if(!window.localStream){ log("[ERROR] カメラ開始して下さい"); return; }
      log(`[INFO] 発信→${t}`);
      let call=peer.call(t,window.localStream);
      call.on('stream',s=>{
        remoteV.srcObject=s; log("[INFO] 計算映像受信");
      });
      call.on('error',e=>log(`[ERROR] 通話エラー:${e}`));
    };

    peer.on('call',call=>{
      log("[INFO] 着信→応答");
      call.answer(window.localStream||null);
      call.on('stream',s=>{
        remoteV.srcObject=s; log("[INFO] リモート映像受信");
      });
    });
  }
</script>
</body>
</html>
