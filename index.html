<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + Joystick (スクロール抑制版)</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    /* ─── メディアエリア ─── */
    #mediaArea {
      display: grid;
      grid-gap: 10px;
      padding: 10px;
    }
    #localVideo, #remoteVideo {
      width: 100%;
      height: auto;
      background: #000;
    }
    /* ジョイスティック枠 */
    #joystick {
      box-sizing: border-box;
      width: 60px; height: 240px;
      margin: auto;
      position: relative;
      border: 4px solid #000;
      border-radius: 30px;
      background: #fff;
      /* ここでスクロール／パンを抑制 */
      touch-action: none;
      overscroll-behavior: contain;
    }
    /* ノブ */
    #joystick #knob {
      position: absolute;
      left: 50%; top: 50%;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #000;
      transform: translate(-50%, -50%);
      transition: transform 0.15s;
      pointer-events: none;
    }
    /* Portrait: ２段＋右ジョイスティック */
    @media (orientation: portrait) {
      #mediaArea {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "localVideo joystick"
          "remoteVideo joystick";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick    { grid-area: joystick; }
    }
    /* Landscape: 左ビデオ＋中央ジョイスティック＋右ビデオ */
    @media (orientation: landscape) {
      #mediaArea {
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto;
        grid-template-areas:
          "localVideo joystick remoteVideo";
        align-items: center;
        height: calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo; }
      #remoteVideo { grid-area: remoteVideo; }
      #joystick    { grid-area: joystick; }
    }
    /* 状態表示 */
    #joystickState {
      font-weight: bold;
      margin-top: 4px;
    }
    /* コントロール & ログ */
    #controls {
      padding: 10px;
    }
    #controls select,
    #controls input,
    #controls button {
      margin: 4px;
    }
    #log {
      white-space: pre-wrap;
      background: #f7f7f7;
      padding: 8px;
      margin: 8px;
      text-align: left;
      height: 120px;
      overflow-y: auto;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>WebRTC P2P デモ + Joystick</h1>

  <!-- メディア＆ジョイスティック領域 -->
  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>

  <hr/>

  <!-- 通信コントロール -->
  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>

    <!-- ユーザーモード -->
    <div id="userControls">
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button><br/>
      <input type="text" id="targetId" placeholder="相手のIDを入力" />
      <button id="callBtn">発信</button>
    </div>

    <!-- 計算モード -->
    <div id="computeControls" style="display:none;">
      <p>計算ノードモード：Unity Video Capture を自動取得して待機します。</p>
    </div>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

  <script>
  /*======================
    ジョイスティック制御
  ======================*/
  (function(){
    const joy       = document.getElementById('joystick');
    const knob      = document.getElementById('knob');
    const stateDiv  = document.getElementById('joystickState');
    let dragging=false, rect, maxY;

    function updateState(v){
      stateDiv.textContent = v < -0.5 ? '上' : v > 0.5 ? '下' : '中心';
    }

    function moveKnob(clientY){
      let y = clientY - (rect.top + rect.height/2);
      y = Math.max(-maxY, Math.min(maxY, y));
      knob.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
      updateState(y / maxY);
    }

    function centerKnob(){
      knob.style.transition = 'transform 0.15s';
      knob.style.transform  = 'translate(-50%, -50%)';
      updateState(0);
      setTimeout(()=> knob.style.transition='', 160);
    }

    // ポインターイベントで preventDefault を呼び出しスクロール抑制
    joy.addEventListener('pointerdown', e=>{
      e.preventDefault();
      dragging = true;
      rect     = joy.getBoundingClientRect();
      maxY     = rect.height/2 - knob.offsetHeight/2;
      moveKnob(e.clientY);
      joy.setPointerCapture(e.pointerId);
    }, { passive: false });

    joy.addEventListener('pointermove', e=>{
      e.preventDefault();
      if(dragging) moveKnob(e.clientY);
    }, { passive: false });

    joy.addEventListener('pointerup', e=>{
      e.preventDefault();
      dragging=false;
      centerKnob();
    }, { passive: false });
  })();

  /*======================
    PeerJS P2P ロジック（ユーザー／計算）
  ======================*/
  const params    = new URLSearchParams(location.search);
  const role      = params.get('role');
  const isCompute = role === 'compute';

  const localVideo      = document.getElementById('localVideo');
  const remoteVideo     = document.getElementById('remoteVideo');
  const myIdSpan        = document.getElementById('myId');
  const logDiv          = document.getElementById('log');
  const userControls    = document.getElementById('userControls');
  const computeControls = document.getElementById('computeControls');
  const videoSelect     = document.getElementById('videoSource');
  const startCamBtn     = document.getElementById('startCamera');
  const targetInput     = document.getElementById('targetId');
  const callBtn         = document.getElementById('callBtn');

  function log(msg){
    console.log(msg);
    logDiv.textContent += '\n' + msg;
  }

  // PeerJS 初期化
  const peer = new Peer();
  peer.on('open', id=>{
    myIdSpan.textContent = id;
    log(`[INFO] 接続完了。自分のID: ${id}`);
  });
  peer.on('error', err=>{
    log(`[ERROR] PeerJS エラー: ${err}`);
  });

  if(isCompute){
    // 計算ノード
    userControls.style.display    = 'none';
    computeControls.style.display = 'block';
    log("[INFO] 計算モード：Unity Video Capture を自動選択します");

    navigator.mediaDevices.enumerateDevices()
      .then(devs => {
        const cam = devs.find(d=>
          d.kind==='videoinput' && d.label.includes('Unity Video Capture')
        );
        if(!cam){
          log("[ERROR] Unity Video Capture が見つかりません");
          throw new Error("仮想カメラ未検出");
        }
        log(`[INFO] 「${cam.label}」を選択します`);
        return navigator.mediaDevices.getUserMedia({
          video:{ deviceId:{ exact: cam.deviceId } },
          audio:false
        });
      })
      .then(stream=>{
        localVideo.srcObject = stream;
        log("[INFO] 仮想カメラ映像を取得しました");
        peer.on('call', call=>{
          log("[INFO] 着信 → 仮想カメラ映像で応答");
          call.answer(stream);
          call.on('stream', s=>{
            remoteVideo.srcObject = s;
            log("[INFO] ユーザー映像を受信");
          });
        });
      })
      .catch(err=>{
        log(`[ERROR] カメラ取得失敗: ${err.message}`);
        peer.on('call', call=>{
          log("[WARN] 映像なしで応答");
          call.answer(null);
        });
      });

  } else {
    // ユーザーモード
    userControls.style.display    = 'block';
    computeControls.style.display = 'none';
    log("[INFO] ユーザーモード：カメラを選択してください");

    // カメラ一覧取得
    navigator.mediaDevices.enumerateDevices()
      .then(devs=>{
        videoSelect.innerHTML = '';
        devs.filter(d=>d.kind==='videoinput').forEach(d=>{
          const o = document.createElement('option');
          o.value = d.deviceId;
          o.text  = d.label || d.deviceId;
          videoSelect.appendChild(o);
        });
        if(videoSelect.options.length===0) log("[WARN] カメラがありません");
      });

    // カメラ開始
    startCamBtn.onclick = ()=>{
      const id = videoSelect.value;
      if(!id){ log("[ERROR] カメラ未選択"); return; }
      navigator.mediaDevices.getUserMedia({
        video:{ deviceId:{ exact:id } }, audio:false
      })
      .then(stream=>{
        localVideo.srcObject = stream;
        window.localStream = stream;
        log(`[INFO] カメラ開始: ${stream.getVideoTracks()[0].label}`);
      })
      .catch(err=> log(`[ERROR] カメラ取得失敗: ${err.message}`));
    };

    // 発信
    callBtn.onclick = ()=>{
      const tgt = targetInput.value.trim();
      if(!tgt){ log("[ERROR] IDを入力してください"); return; }
      if(!window.localStream){
        log("[ERROR] 先にカメラ開始"); return;
      }
      log(`[INFO] 発信 → ${tgt}`);
      const call = peer.call(tgt, window.localStream);
      call.on('stream', s=>{
        remoteVideo.srcObject = s;
        log("[INFO] リモート映像を受信");
      });
      call.on('error', e=>{
        log(`[ERROR] 通話エラー: ${e}`);
      });
    };

    // 着信応答
    peer.on('call', call=>{
      log("[INFO] 着信 → 応答");
      call.answer(window.localStream || null);
      call.on('stream', s=>{
        remoteVideo.srcObject = s;
        log("[INFO] リモート映像を受信");
      });
    });
  }
  </script>
</body>
</html>
