<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>骨格推定 P2P デバッグ版</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 45%; margin: 0 2%; background: #000; }
    #controls { margin: 1em; }
    #status { color: red; margin: 1em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>骨格推定 P2P デバッグ版</h1>
  <div id="controls">
    <label><input type="radio" name="role" value="compute"> 計算</label>
    <label><input type="radio" name="role" value="user"> ユーザー</label><br>
    部屋番号：<input type="text" id="roomCode" placeholder="1234">
    <button id="startBtn">開始</button>
    <button id="callBtn">接続</button>
  </div>
  <div id="status">[INFO] Ready</div>
  <p>あなたの PeerID: <span id="myId">—</span></p>
  <div>
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
  </div>

  <script>
    const log     = msg => {
      console.log(msg);
      document.getElementById('status').textContent += '\n' + msg;
    };
    const status  = document.getElementById('status');
    const startBtn= document.getElementById('startBtn');
    const callBtn = document.getElementById('callBtn');
    const roomIn  = document.getElementById('roomCode');
    const myId    = document.getElementById('myId');
    const localV  = document.getElementById('localVideo');
    const remoteV = document.getElementById('remoteVideo');

    let role, peer, localStream, roomCode;

    startBtn.onclick = async () => {
      status.textContent = '[INFO] Starting…';
      role = document.querySelector('input[name=role]:checked')?.value;
      roomCode = roomIn.value.trim();
      if (!role)   return log('[ERROR] 先に「計算」か「ユーザー」を選択');
      if (!roomCode) return log('[ERROR] 部屋番号を入力');

      // PeerJS インスタンス作成
      peer = new Peer(`${role}-${roomCode}`, {
        host: '0.peerjs.com', secure: true, port: 443,
        config: { iceServers:[{ urls:'stun:stun.l.google.com:19302'}] }
      });
      peer.on('open', id => {
        myId.textContent = id;
        log(`[INFO] Peer opened: ${id}`);
      });
      peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

      if (role === 'user') {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
          localV.srcObject = localStream;
          log('[INFO] Local video stream obtained');
        } catch(e) {
          return log(`[ERROR] getUserMedia: ${e}`);
        }
        peer.on('call', call => {
          log('[INFO] Incoming call, answering…');
          call.answer(localStream);
          call.on('stream', s => {
            remoteV.srcObject = s;
            log('[INFO] Received remote stream');
          });
        });
      } else {
        callBtn.style.display = 'none';
        peer.on('call', async call => {
          log('[INFO] Incoming call on compute side');
          // 仮想カメラ候補を再ログ出力
          const cams = await navigator.mediaDevices.enumerateDevices();
          log('[INFO] Video inputs: ' + cams.filter(d=>d.kind==='videoinput').map(d=>d.label).join(' | '));
          const vc = cams.find(d=>/VirtualCam|OBS Virtual Camera|Unity Capture/.test(d.label));
          if (!vc) {
            return log('[ERROR] 仮想カメラが見つかりません');
          }
          log(`[INFO] Using virtual camera: ${vc.label}`);
          localStream = await navigator.mediaDevices.getUserMedia({ video:{ deviceId: vc.deviceId } });
          localV.srcObject = localStream;
          call.answer(localStream);
          call.on('stream', s => {
            remoteV.srcObject = s;
            log('[INFO] Received remote stream (should be user video)');
          });
        });
      }
    };

    callBtn.onclick = () => {
      status.textContent = '[INFO] Connecting…';
      if (!peer || !roomCode) return log('[ERROR] 先に開始してください');
      const target = role==='user' ? `compute-${roomCode}` : `user-${roomCode}`;
      log(`[INFO] Calling ${target}`);
      try {
        const call = peer.call(target, localStream);
        call.on('stream', s => {
          remoteV.srcObject = s;
          log('[INFO] Received remote stream');
        });
        call.on('error', e => log(`[ERROR] call error: ${e}`));
      } catch(e) {
        log(`[ERROR] peer.call failed: ${e}`);
      }
    };
  </script>
</body>
</html>
