<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>P2P Video File Transfer</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    button { margin: 8px; padding: 8px 16px; font-size: 1rem; }
    video { display: block; margin: 12px auto; max-width: 90%; }
    #status { display: block; margin-top: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>P2P Video File Transfer</h1>

  <!-- 送信側 UI -->
  <div id="senderUI" style="display:none;">
    <button id="startCamBtn">カメラ開始</button>
    <button id="recordBtn" disabled>録画開始</button>
    <span id="status"></span>
    <video id="localVideo" autoplay muted playsinline style="display:none;"></video>
  </div>

  <!-- 受信側 UI -->
  <div id="computeUI" style="display:none;">
    <p>受信側: 映像を待機中...</p>
    <video id="recvVideo" controls autoplay playsinline></video>
  </div>

  <script>
    // URLパラメータでモード判定
    const params   = new URLSearchParams(window.location.search);
    const isCompute = params.get('role') === 'compute';

    // UI要素
    const senderUI  = document.getElementById('senderUI');
    const computeUI = document.getElementById('computeUI');
    const startCamBtn = document.getElementById('startCamBtn');
    const recordBtn   = document.getElementById('recordBtn');
    const statusSpan  = document.getElementById('status');
    const localVideo  = document.getElementById('localVideo');
    const recvVideo   = document.getElementById('recvVideo');

    // PeerJS 初期化（ID を固定）
    const peerId     = isCompute ? 'compute' : 'sender';
    const peer       = new Peer(peerId);
    let conn;

    // モードに応じて UI 表示
    if (isCompute) {
      computeUI.style.display = 'block';
    } else {
      senderUI.style.display  = 'block';
    }

    // PeerJS オープン時
    peer.on('open', id => {
      console.log(`Peer open: ${id}`);
      if (!isCompute) {
        // 送信側は受信側に接続
        conn = peer.connect('compute');
        conn.on('open', () => console.log('DataConn open'));
      }
    });

    // コネクション受信時（受信側）
    peer.on('connection', connection => {
      conn = connection;
      if (isCompute) setupReceiver();
    });

    // ─── 送信側の処理 ───
    if (!isCompute) {
      let mediaRecorder, chunks = [];

      // カメラ開始
      startCamBtn.onclick = () => {
        navigator.mediaDevices.getUserMedia({
          video: { width: 1920, height: 1080 },
          audio: false
        })
        .then(stream => {
          localVideo.srcObject = stream;
          localVideo.style.display = 'block';
          startCamBtn.disabled = true;
          recordBtn.disabled   = false;
          // MediaRecorder セットアップ
          mediaRecorder = new MediaRecorder(stream, {
            mimeType: 'video/webm; codecs=vp9',
            videoBitsPerSecond: 5_000_000
          });
          mediaRecorder.ondataavailable = e => chunks.push(e.data);
          mediaRecorder.onstop        = () => sendVideo();
        })
        .catch(err => statusSpan.textContent = 'カメラ取得失敗: ' + err.message);
      };

      // 録画開始／停止
      recordBtn.onclick = () => {
        if (mediaRecorder.state === 'inactive') {
          chunks = [];
          mediaRecorder.start();
          recordBtn.textContent = '録画停止';
          statusSpan.textContent = '録画中...';
        } else {
          mediaRecorder.stop();
          recordBtn.textContent = '録画開始';
          statusSpan.textContent = '送信中...';
        }
      };

      // 録画後の送信
      function sendVideo() {
        const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
        // メタデータ送信
        conn.send({ fileSize: blob.size, fileType: blob.type });

        // Blob → ArrayBuffer → チャンク分割送信
        const reader = new FileReader();
        reader.onload = () => {
          const buffer = reader.result;
          const CHUNK_SIZE = 64 * 1024;  // 64KB
          let offset = 0;

          function sendChunk() {
            if (offset < buffer.byteLength) {
              conn.send(buffer.slice(offset, offset + CHUNK_SIZE));
              offset += CHUNK_SIZE;
              // バッファ詰まり防止
              if (conn.bufferedAmount > CHUNK_SIZE * 8) {
                conn.on('bufferedamountlow', sendChunk);
              } else {
                setTimeout(sendChunk, 0);
              }
            } else {
              statusSpan.textContent = '送信完了';
            }
          }
          sendChunk();
        };
        reader.readAsArrayBuffer(blob);
      }
    }

    // ─── 受信側の処理 ───
    function setupReceiver() {
      const buffers = [];
      let expectedSize = 0;
      let startTime = 0;

      conn.on('data', data => {
        // メタデータ受信
        if (data && data.fileSize) {
          expectedSize = data.fileSize;
          startTime    = performance.now();
          console.log('期待サイズ:', expectedSize);
          return;
        }
        // チャンク受信
        buffers.push(data);
        const received = buffers.reduce((sum, b) => sum + (b.byteLength || b.size), 0);
        // 全部受信できたら再生
        if (expectedSize > 0 && received >= expectedSize) {
          const videoBlob = buffers[0] instanceof ArrayBuffer
            ? new Blob(buffers, { type: 'video/webm' })
            : new Blob(buffers, { type: buffers[0].type });
          const url = URL.createObjectURL(videoBlob);
          recvVideo.src = url;
          const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
          console.log(`転送時間: ${elapsed} 秒`);
        }
      });
    }
  </script>
</body>
</html>
