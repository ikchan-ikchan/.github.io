<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MediaPipe Pose カメラ選択・FPS指定デモ</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video, canvas {
        display: block;
        margin: 10px auto;
        border: 1px solid #ccc;
      }
      #controls {
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose カメラ選択 & FPS指定 デモ</h2>
    
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="30" style="width:60px;">
      
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
    </div>
    
    <!-- 映像表示用 -->
    <video id="video" width="640" height="480" autoplay muted playsinline></video>
    <!-- 描画用 Canvas -->
    <canvas id="canvas" width="640" height="480"></canvas>
    
    <!-- MediaPipe Pose 本体 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <!-- 描画用ユーティリティ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <!-- カメラ管理用ユーティリティ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <script>
      // 各種DOMの参照
      const videoElement = document.getElementById('video');
      const canvasElement = document.getElementById('canvas');
      const ctx = canvasElement.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const startButton = document.getElementById('startButton');

      let mpPose = null;
      let camera = null;

      // ① カメラデバイスの列挙
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = "";
          videoDevices.forEach((device, idx) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            // ラベルが空の場合は "カメラ n" と表示
            option.text = device.label || `カメラ ${idx + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (err) {
          console.error('カメラ列挙エラー:', err);
        }
      }

      // ② MediaPipe Pose の初期化
      function initMediaPipePose() {
        // pose インスタンスを作成。locateFile で必要なファイルパスを指定
        mpPose = new Pose({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
          }
        });
        // オプション設定（必要に応じて調整）
        mpPose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          enableSegmentation: false,
          smoothSegmentation: false,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        mpPose.onResults(onResults);
      }

      // ③ 検出結果の描画
      function onResults(results) {
        // Canvas をクリア
        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        // 背景として映像を描画
        ctx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        if (results.poseLandmarks) {
          // キーポイントを描画 (赤い円)
          window.drawLandmarks(ctx, results.poseLandmarks, { color: 'red', radius: 5 });
          // スケルトン（接続線）を描画 (緑色)
          window.drawConnectors(ctx, results.poseLandmarks, Pose.POSE_CONNECTIONS,
            { color: 'lime', lineWidth: 2 });
        }
      }

      // ④ カメラの開始
      async function startCameraWithMediaPipe() {
        const selectedDeviceId = cameraSelect.value;
        const desiredFps = parseInt(frameRateInput.value) || 30;
        // MediaPipe Camera Utils は渡す constraints に deviceId などを指定できる
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: desiredFps }
          }
        };
        // カメラ生成時に自動で onFrame コールバック経由で mpPose に画像を送る
        camera = new Camera(videoElement, {
          onFrame: async () => {
            await mpPose.send({ image: videoElement });
          },
          video: constraints.video  // Camera へ渡す映像制約
        });
        camera.start();
      }

      // ⑤ 開始ボタン押下時の処理
      startButton.addEventListener('click', async () => {
        if (!mpPose) {
          initMediaPipePose();
        }
        await startCameraWithMediaPipe();
      });

      // ページ読み込み時、カメラデバイスを列挙
      enumerateCameras();
    </script>
  </body>
</html>
