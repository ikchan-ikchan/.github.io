<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebRTC P2P デモ（リアルタイム／スナップショット）</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body   { font-family:sans-serif; text-align:center; }
    video  { width:320px; height:240px; background:#000; }
    select,button,input { margin:4px 4px; }
    #log   { height:120px; width:90%; margin:8px auto; background:#f0f0f0;
             overflow-y:auto; white-space:pre-wrap; text-align:left; }
  </style>
</head>
<body>
  <h2>WebRTC P2P デモ（リアルタイム／スナップショット）</h2>

  <!-- 映像エリア -->
  <div>
    <div style="display:inline-block; margin:0 16px;">
      <h3>ローカル映像</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div style="display:inline-block; margin:0 16px;">
      <h3>リモート映像</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>
  <hr>

  <!-- ユーザー/計算共有コントロール -->
  <div id="sharedCtrl">
    自分のPeerID：<span id="myId">—</span>
  </div>

  <!-- ユーザーモード UI -->
  <div id="userCtrl">
    <label>カメラ選択：
      <select id="videoSel"></select>
    </label>
    <button id="startCamBtn">カメラ開始</button><br>

    処理モード：
    <select id="modeSel">
      <option value="realtime" selected>リアルタイム</option>
      <option value="snapshot">スナップショット</option>
    </select>
    <button id="captureBtn" disabled>撮影</button><br>

    相手ID：<input type="text" id="targetId" placeholder="計算ノードID">
    <button id="callBtn">発信</button>
  </div>

  <!-- 計算モード UI -->
  <div id="computeCtrl" style="display:none;">
    <p>計算ノード：Unity Video Capture を自動取得して待機中…</p>
  </div>

  <!-- ログ -->
  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

<script>
/* ========== 共通ユーティリティ ========== */
const logDiv = document.getElementById('log');
function log(msg){ console.log(msg); logDiv.textContent += '\n'+msg; logDiv.scrollTop = logDiv.scrollHeight; }

/* ========== 役割判定 ========== */
const params     = new URLSearchParams(location.search);
const isCompute  = params.get('role') === 'compute';

/* ========== PeerJS 初期化 ========== */
const peer = new Peer();
let mediaConn = null;      // ビデオ通話用
let dataConn  = null;      // 制御メッセージ用
peer.on('open', id => {
  document.getElementById('myId').textContent = id;
  log(`[INFO] Peer 接続完了。自分ID: ${id}`);
});
peer.on('error', err=>log(`[ERROR] Peer: ${err}`));

/* ========== 計算ノードモード ========== */
if (isCompute){
  document.getElementById('userCtrl').style.display = 'none';
  document.getElementById('computeCtrl').style.display = 'block';

  // Unity Video Capture を探して取得
  navigator.mediaDevices.enumerateDevices()
    .then(devs=>{
      const vc = devs.find(d=>d.kind==='videoinput' && d.label.includes('Unity Video Capture'));
      if(!vc){ throw new Error('Unity Video Capture が見つかりません'); }
      log(`[INFO] ${vc.label} を使用`);
      return navigator.mediaDevices.getUserMedia({ video:{ deviceId:{ exact:vc.deviceId } }, audio:false });
    })
    .then(stream=>{
      localVideo.srcObject = stream;

      /* 着信（MediaConnection）設定 */
      peer.on('call', call=>{
        log('[INFO] 通話着信 → 仮想カメラで応答');
        mediaConn = call;
        call.answer(stream);
        call.on('stream', s=>{ remoteVideo.srcObject = s; log('[INFO] ユーザー映像受信');});
      });

      /* 着信（DataConnection）設定  */
      peer.on('connection', dc=>{
        dataConn = dc;
        log('[INFO] DataChannel 接続確立');
        dc.on('data', handleDataMessage);
      });

      /* 制御メッセージ処理 */
      let currentMode = 'realtime';
      function handleDataMessage(msg){
        if (msg === 'MODE_REALTIME' || msg === 'MODE_SNAPSHOT'){
          currentMode = (msg==='MODE_REALTIME')?'realtime':'snapshot';
          log(`[INFO] モード変更指示受信 → ${currentMode}`);
          return;
        }
        if (typeof msg === 'string' && msg.startsWith('data:image')){
          if (currentMode==='snapshot'){
            // --- スナップショット1枚だけ処理 ---
            sendToVirtualCam(msg);
          }
        } else if (currentMode==='realtime' && (typeof msg === 'string' || msg instanceof ArrayBuffer)){
          // --- リアルタイムフレーム処理 ---
          sendToVirtualCam(msg);
        }
      }

      /* 仮想カメラへ送出（ここでは受信データをそのまま送る例）*/
      function sendToVirtualCam(dataUrl){
        const b64 = dataUrl.split(',')[1];
        const frame = cv2imdecode(b64);
        if (!window.vcam){
          window.vcam = new pyvirtualcam.Camera({ width:frame.width, height:frame.height, fps:20, backend:'unitycapture' });
          log('[INFO] 仮想カメラ開始');
        }
        window.vcam.send(frame.data);
      }
      /* ↑cv2imdecode等はPython的記法の擬似コード/概念です。
         実際は計算ノード側ブラウザにJSで処理するか、Pythonで処理するかによって実装が変わります。*/
    })
    .catch(err=>log(`[ERROR] 仮想カメラ取得失敗: ${err.message}`));

/* ========== ユーザーモード ========== */
} else {
  /* --- 要素取得 --- */
  const videoSel   = document.getElementById('videoSel');
  const startBtn   = document.getElementById('startCamBtn');
  const modeSel    = document.getElementById('modeSel');
  const captureBtn = document.getElementById('captureBtn');
  const callBtn    = document.getElementById('callBtn');
  const targetIn   = document.getElementById('targetId');
  let localStream  = null;

  // カメラ一覧をロード
  navigator.mediaDevices.enumerateDevices().then(devs=>{
    videoSel.innerHTML='';
    devs.filter(d=>d.kind==='videoinput').forEach(d=>{
      const opt=document.createElement('option');
      opt.value=d.deviceId; opt.text=d.label||d.deviceId;
      videoSel.appendChild(opt);
    });
  });

  /* カメラ開始 */
  startBtn.onclick = ()=>{
    const id = videoSel.value;
    if(!id){ log('[ERROR] カメラ未選択'); return; }
    navigator.mediaDevices.getUserMedia({ video:{ deviceId:{ exact:id } }, audio:false })
      .then(str=>{
        localStream = str;
        localVideo.srcObject = str;
        log('[INFO] カメラ開始');
      })
      .catch(e=>log(`[ERROR] カメラ開始失敗: ${e.message}`));
  };

  /* 発信ボタン */
  callBtn.onclick = ()=>{
    const targetId = targetIn.value.trim();
    if(!targetId){ log('[ERROR] 相手ID未入力'); return; }
    if(!localStream){ log('[ERROR] カメラ開始していません'); return; }
    mediaConn = peer.call(targetId, localStream);
    mediaConn.on('stream', s=>{ remoteVideo.srcObject = s; log('[INFO] 計算ノード映像受信'); });

    // DataChannel 接続
    dataConn  = peer.connect(targetId);
    dataConn.on('open', ()=>{
      log('[INFO] DataChannel 接続完了');
      // 初期モードを通知
      dataConn.send('MODE_REALTIME');
    });
  };

  /* 処理モード切替 */
  let frameTimer = null;
  modeSel.onchange = ()=>{
    const mode = modeSel.value;
    if (!dataConn || !dataConn.open){ log('[WARN] DataChannel未接続'); return; }
    if (mode==='realtime'){
      captureBtn.disabled=true;
      dataConn.send('MODE_REALTIME');
      // 連続送信開始
      if(!frameTimer){
        frameTimer=setInterval(sendFrame,100);
      }
    } else { // snapshot
      captureBtn.disabled=false;
      dataConn.send('MODE_SNAPSHOT');
      // 連続送信停止
      clearInterval(frameTimer); frameTimer=null;
    }
    log(`[INFO] モード変更: ${mode}`);
  };

  /* フレーム連続送信関数 */
  function sendFrame(){
    if(!localVideo.videoWidth) return;
    const c=document.createElement('canvas');
    c.width=localVideo.videoWidth;
    c.height=localVideo.videoHeight;
    c.getContext('2d').drawImage(localVideo,0,0,c.width,c.height);
    dataConn.send(c.toDataURL('image/jpeg',0.8));
  }

  /* スナップショット撮影 */
  captureBtn.onclick = ()=>{ sendFrame(); log('[INFO] スナップショット送信'); };

  /* 着信を受けた場合（計算→ユーザー発信時）*/
  peer.on('call', call=>{
    if(!localStream){ log('[WARN] 着信が来ましたがローカル映像無し→拒否'); return; }
    mediaConn = call;
    call.answer(localStream);
    call.on('stream', s=>{ remoteVideo.srcObject = s; log('[INFO] 計算ノード映像受信'); });
  });

  /* DataConnection 着信（計算→ユーザー）*/
  peer.on('connection', dc=>{
    dataConn = dc; log('[INFO] DataChannel 接続完了(着信)');
    dc.on('data', msg=>log('[INFO] 計算ノード→ユーザーへ:' + msg));
  });
}
</script>
</body>
</html>
