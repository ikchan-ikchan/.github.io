<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>MediaPipe Pose: カメラ選択 & フレームレート指定デモ</title>
    <style>
      body { font-family: sans-serif; text-align: center; }
      video, canvas { display: block; margin: 10px auto; }
      #controls { margin: 10px; }
    </style>
  </head>
  <body>
    <h2>MediaPipe Pose: カメラ選択 & フレームレート指定デモ</h2>
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
    </div>
    
    <!-- カメラ映像（非表示にして内部利用） -->
    <video id="video" width="640" height="480" autoplay muted playsinline style="display:none;"></video>
    <!-- 描画用キャンバス -->
    <canvas id="outputCanvas" width="640" height="480"></canvas>
    
    <!-- MediaPipe Pose, Drawing Utils の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    
    <script>
      const video = document.getElementById('video');
      const outputCanvas = document.getElementById('outputCanvas');
      const canvasCtx = outputCanvas.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const startButton = document.getElementById('startButton');
      
      let pose = null;
      let processingLoopId = null;
      
      // ① 利用可能なカメラを列挙する
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `カメラ ${index + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (error) {
          console.error('カメラの列挙に失敗:', error);
        }
      }
      
      // ② MediaPipe Pose の初期化
      function initializePose() {
        pose = new Pose({
          locateFile: (file) => {
            // CDN 経由でファイルを取得する
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
          }
        });
        pose.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        // onResults コールバックで描画処理を呼ぶ
        pose.onResults(onResults);
      }
      
      // ③ ポーズ検出結果を受け取って描画するコールバック
      function onResults(results) {
        // Canvas をクリアし、元の映像を背景として描画
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        canvasCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
        if (results.poseLandmarks) {
          // スケルトン（キーポイント間の接続）の描画
          drawConnectors(canvasCtx, results.poseLandmarks, Pose.POSE_CONNECTIONS, { color: 'lime', lineWidth: 2 });
          // キーポイント自体の描画
          drawLandmarks(canvasCtx, results.poseLandmarks, { color: 'red', lineWidth: 1 });
        }
        canvasCtx.restore();
      }
      
      // ④ 選択したカメラで映像を取得する
      async function startCamera() {
        if (video.srcObject) {
          // 既存ストリームがあれば停止する
          video.srcObject.getTracks().forEach(track => track.stop());
        }
        const selectedDeviceId = cameraSelect.value;
        const frameRate = parseInt(frameRateInput.value) || 15;
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: frameRate }
          }
        };
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          return new Promise(resolve => {
            video.onloadedmetadata = () => {
              video.play();
              resolve();
            };
          });
        } catch (error) {
          console.error('カメラ映像の取得に失敗:', error);
        }
      }
      
      // ⑤ 映像フレームを MediaPipe Pose に渡すループ
      async function processVideo() {
        const frameRate = parseInt(frameRateInput.value) || 15;
        const interval = 1000 / frameRate;
        async function sendFrame() {
          if (!video.paused && !video.ended) {
            await pose.send({ image: video });
          }
          processingLoopId = setTimeout(sendFrame, interval);
        }
        sendFrame();
      }
      
      // ⑥ スタートボタンのイベント（カメラの開始、Pose の初期化、ループ開始）
      startButton.addEventListener('click', async () => {
        if (processingLoopId) {
          clearTimeout(processingLoopId);
        }
        await startCamera();
        initializePose();
        processVideo();
      });
      
      // ページ読み込み時にカメラを列挙
      enumerateCameras();
    </script>
  </body>
</html>
