<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Pose検出デモ</title>
  <style>
    /* ブラウザの余白を無くして全画面表示を実現 */
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <!-- カメラ映像表示用のvideo要素 -->
  <video id="video" autoplay playsinline></video>
  <!-- 推定結果描画用のcanvas -->
  <canvas id="overlay"></canvas>

  <!-- TensorFlow.jsおよびPoseNetのライブラリを読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.14.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    // カメラセットアップ：ユーザーのwebカメラを取得しvideoに流し込む
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            // videoのサイズに合わせてcanvasも設定
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            resolve();
          };
        });
      } catch (e) {
        console.error("カメラの初期化に失敗しました：", e);
      }
    }

    // PoseNetモデルをロードする
    async function loadPoseNet() {
      const net = await posenet.load();
      return net;
    }

    // 1フレームごとに姿勢推定を実施
    async function detectPose(net) {
      // PoseNetによる姿勢推定
      const pose = await net.estimateSinglePose(video, {
        flipHorizontal: false,  // 必要に応じてtrueにすると鏡像になる
        decodingMethod: 'single-person'
      });
      return pose;
    }

    // 推定結果をキャンバスに描画する
    function drawPose(pose) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 信頼度が一定以上の各キーポイントを描画（顔の部位や他の部位）
      pose.keypoints.forEach(key => {
        if (key.score > 0.5) {
          ctx.beginPath();
          ctx.arc(key.position.x, key.position.y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = "red";
          ctx.fill();
        }
      });

      // 隣接するキーポイント間を線で結んでボーンを描画
      const adjacentKeyPoints = posenet.getAdjacentKeyPoints(pose.keypoints, 0.5);
      adjacentKeyPoints.forEach(pair => {
        ctx.beginPath();
        ctx.moveTo(pair[0].position.x, pair[0].position.y);
        ctx.lineTo(pair[1].position.x, pair[1].position.y);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "blue";
        ctx.stroke();
      });
    }

    // メイン処理：カメラセットアップ、モデル読み込み、ループ処理でリアルタイム推定
    async function main() {
      await setupCamera();
      const net = await loadPoseNet();

      async function poseLoop() {
        const pose = await detectPose(net);
        drawPose(pose);
        requestAnimationFrame(poseLoop);
      }
      poseLoop();
    }

    main();
  </script>
</body>
</html>
