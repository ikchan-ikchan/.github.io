<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>OpenCV Pose Estimation: カメラ選択, FPS, 解像度指定 & 記録 + 3D表示 デモ</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
      }
      video, canvas {
        display: block;
        margin: 10px auto;
      }
      #controls {
        margin: 10px;
      }
      #maxResolutionInfo, #poseCoordinates {
        margin-top: 5px;
        font-size: 0.9em;
        color: #555;
      }
      table {
        margin: auto;
        border-collapse: collapse;
      }
      table, th, td {
        border: 1px solid #aaa;
        padding: 4px;
      }
      /* 3D 表示エリアのスタイル */
      #threeContainer {
        margin: 10px auto;
        width: 640px;
        height: 300px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h2>OpenCV Pose Estimation: カメラ選択, FPS, 解像度指定 & 記録 + 3D表示 デモ</h2>
    <div id="controls">
      <label for="cameraSelect">カメラ選択:</label>
      <select id="cameraSelect"></select>
      &nbsp;&nbsp;
      <label for="frameRateInput">フレームレート (fps):</label>
      <input type="number" id="frameRateInput" min="1" value="15" style="width:60px;">
      &nbsp;&nbsp;
      <label for="resPercentInput">解像度 (%):</label>
      <input type="number" id="resPercentInput" min="1" max="100" value="100" style="width:60px;">
      &nbsp;&nbsp;
      <button id="startButton">開始</button>
      &nbsp;&nbsp;
      <button id="captureButton">記録</button>
      <div id="maxResolutionInfo"></div>
    </div>
    
    <!-- カメラ映像（内部利用：Canvas に描画） -->
    <video id="video" autoplay muted playsinline style="display:none;"></video>
    <!-- 描画用キャンバス（2D 表示） -->
    <canvas id="outputCanvas"></canvas>
    
    <!-- Pose 座標表示用 -->
    <div id="poseCoordinates"></div>
    <!-- 3D 表示用コンテナ -->
    <div id="threeContainer"></div>
    
    <!-- OpenCV.js の読み込み (async 属性により onRuntimeInitialized で初期化) -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
    <!-- Three.js と OrbitControls の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
      // 要素の取得
      const video = document.getElementById('video');
      const outputCanvas = document.getElementById('outputCanvas');
      const canvasCtx = outputCanvas.getContext('2d');
      const cameraSelect = document.getElementById('cameraSelect');
      const frameRateInput = document.getElementById('frameRateInput');
      const resPercentInput = document.getElementById('resPercentInput');
      const startButton = document.getElementById('startButton');
      const captureButton = document.getElementById('captureButton');
      const maxResolutionInfo = document.getElementById('maxResolutionInfo');
      const poseCoordinatesDiv = document.getElementById('poseCoordinates');
      const threeContainer = document.getElementById('threeContainer');

      // OpenCV 関連の変数
      let cap = null;
      let src = null;
      let net = null; // ポーズ推定用の DNN ネットワーク
      let processing = false;
      let landmarks = [];  // 最新のランドマーク配列

      // ポーズ推定用のモデルファイル（ファイルはご自身のサーバに配置してください）
      const protoFile = 'pose_deploy_linevec_faster_4_stages.prototxt';
      const weightsFile = 'pose_iter_160000.caffemodel';

      // ① 利用可能なカメラの列挙
      async function enumerateCameras() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `カメラ ${index + 1}`;
            cameraSelect.appendChild(option);
          });
        } catch (error) {
          console.error('カメラの列挙に失敗:', error);
        }
      }
      
      // ② 選択したカメラで、最大解像度の何％かを指定して映像を取得する
      async function startCamera() {
        const selectedDeviceId = cameraSelect.value;
        const tempConstraints = { video: { deviceId: { exact: selectedDeviceId } } };
        let tempStream;
        try {
          tempStream = await navigator.mediaDevices.getUserMedia(tempConstraints);
        } catch (error) {
          console.error('初回ストリームの取得に失敗:', error);
          return;
        }
        const videoTrack = tempStream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        let maxWidth = (capabilities.width && capabilities.width.max) || 640;
        let maxHeight = (capabilities.height && capabilities.height.max) || 480;
        maxResolutionInfo.innerText = `このカメラの最大解像度: ${maxWidth} x ${maxHeight}`;
        tempStream.getTracks().forEach(track => track.stop());
        
        const resPercent = parseInt(resPercentInput.value) || 100;
        const desiredWidth = Math.floor(maxWidth * (resPercent / 100));
        const desiredHeight = Math.floor(maxHeight * (resPercent / 100));
        const frameRate = parseInt(frameRateInput.value) || 15;
        
        const constraints = {
          video: {
            deviceId: { exact: selectedDeviceId },
            width: { exact: desiredWidth },
            height: { exact: desiredHeight },
            frameRate: { ideal: frameRate }
          }
        };
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          return new Promise(resolve => {
            video.onloadedmetadata = () => {
              outputCanvas.width = video.videoWidth;
              outputCanvas.height = video.videoHeight;
              video.play();
              resolve();
            };
          });
        } catch (error) {
          console.error('カメラ映像の取得に失敗:', error);
        }
      }
      
      // ③ DNN ネットワークの読み込み
      function loadPoseNetwork() {
        // ※ OpenCV.js の仮想ファイルシステムにファイルを配置する処理が必要な場合があります
        // 下記はサーバ上の相対パスから直接ロードする例です
        net = cv.readNetFromCaffe(protoFile, weightsFile);
      }

      // ④ OpenCV.js を用いたフレーム処理（DNN によるポーズ推定）
      function processVideoFrame() {
        if (!processing) return;
        try {
          cap.read(src);
          // 入力画像を blob 化（前処理：正規化など必要に応じて調整）
          let blob = cv.blobFromImage(src, 1.0 / 255, new cv.Size(src.cols, src.rows), new cv.Scalar(0,0,0), false, false);
          net.setInput(blob);
          let output = net.forward();
          
          // ※ 出力のサイズと形式は使用モデルに依存します。
          // 以下は仮の実装例：出力サイズが [1, nPoints, H, W] と仮定し、
          // 各キー点の最大信頼度位置を検出して正規化座標として保存する。
          landmarks = [];
          let nPoints = output.size[1];
          let H = output.size[2];
          let W = output.size[3];
          for (let n = 0; n < nPoints; n++) {
            let maxVal = 0;
            let maxLoc = {x: 0, y: 0};
            // 各信号（H×W）の中で最大値を探索
            for (let i = 0; i < H; i++) {
              for (let j = 0; j < W; j++) {
                let index = n * H * W + i * W + j;
                let prob = output.data32F[index];
                if (prob > maxVal) {
                  maxVal = prob;
                  maxLoc = { x: j, y: i };
                }
              }
            }
            landmarks.push({
              x: maxLoc.x / W,
              y: maxLoc.y / H,
              conf: maxVal
            });
          }
          blob.delete();
          output.delete();
          
          // 画像を canvas に描画（OpenCV.js の imshow を利用）
          cv.imshow('outputCanvas', src);
          // Canvas API でランドマークを重ね描き
          canvasCtx.fillStyle = 'red';
          landmarks.forEach(pt => {
            if (pt.conf > 0.1) { // 信頼度の閾値（適宜調整）
              canvasCtx.beginPath();
              canvasCtx.arc(pt.x * src.cols, pt.y * src.rows, 4, 0, 2 * Math.PI);
              canvasCtx.fill();
            }
          });
        } catch (error) {
          console.error(error);
        }
        // 指定フレームレートに基づくループ
        const interval = 1000 / (parseInt(frameRateInput.value) || 15);
        setTimeout(processVideoFrame, interval);
      }
      
      // ⑤ 3D 表示 (Three.js を利用) ※2D 正規化座標を X, Y としてプロット
      function draw3DPoints() {
        threeContainer.innerHTML = '';
        const scene = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(75, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
        threeContainer.appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera3D, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.screenSpacePanning = true;
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const planeGeometry = new THREE.PlaneGeometry(400, 400);
        const planeMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -50;
        scene.add(plane);
        
        // ランドマークを小さな球体として配置（ここでは Z 軸は 0 としています）
        const pointGeometry = new THREE.SphereGeometry(2, 16, 16);
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        landmarks.forEach(pt => {
          if (pt.conf > 0.1) {
            const sphere = new THREE.Mesh(pointGeometry, pointMaterial);
            sphere.position.x = (pt.x - 0.5) * 100;
            sphere.position.y = (0.5 - pt.y) * 100;
            sphere.position.z = 0;
            scene.add(sphere);
          }
        });
        
        camera3D.position.set(0, 0, 150);
        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera3D);
        }
        animate();
      }
      
      // ⑥ 「記録」ボタン押下時：処理停止後にテーブルと 3D 表示を更新
      captureButton.addEventListener('click', () => {
        processing = false;
        let html = '<h3>記録された座標 (正規化 x, y, 信頼度)</h3>';
        html += '<table>';
        html += '<tr><th>Index</th><th>x</th><th>y</th><th>conf</th></tr>';
        landmarks.forEach((pt, index) => {
          html += `<tr>
                      <td>${index}</td>
                      <td>${pt.x.toFixed(3)}</td>
                      <td>${pt.y.toFixed(3)}</td>
                      <td>${pt.conf.toFixed(3)}</td>
                   </tr>`;
        });
        html += '</table>';
        poseCoordinatesDiv.innerHTML = html;
        draw3DPoints();
      });
      
      // ⑦ 「開始」ボタン押下時の処理
      startButton.addEventListener('click', async () => {
        await startCamera();
        cap = new cv.VideoCapture(video);
        src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
        loadPoseNetwork();  // モデル読み込み（ファイルパスの設定に注意）
        processing = true;
        processVideoFrame();
      });
      
      // OpenCV.js の初期化完了時のコールバック
      function onOpenCvReady() {
        console.log('OpenCV.js が初期化されました');
        enumerateCameras();
      }
      if (cv.getBuildInformation) {
        onOpenCvReady();
      } else {
        cv['onRuntimeInitialized'] = onOpenCvReady;
      }
    </script>
  </body>
</html>
