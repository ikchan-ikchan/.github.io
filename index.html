<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>PNG連番ロスレス送信デモ（改善版）</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    /* （省略：前と同じCSS） */
    body{font-family:sans-serif;text-align:center;margin:0;padding:0;}
    #mediaArea{display:grid;grid-gap:10px;padding:10px;}
    #localVideo,#remoteVideo{width:100%;height:auto;background:#000;}
    #sendCanvas,#recvCanvas{display:none;}
    #joystick{box-sizing:border-box;width:60px;height:240px;margin:auto;
      position:relative;border:4px solid #000;border-radius:30px;
      background:#fff;touch-action:none;overscroll-behavior:contain;}
    #knob{position:absolute;left:50%;top:50%;width:40px;height:40px;
      border-radius:50%;background:#000;transform:translate(-50%,-50%);
      transition:transform .15s;pointer-events:none;}
    #joystickState{font-weight:bold;margin-top:4px;}
    @media (orientation:portrait){
      #mediaArea{grid-template-columns:1fr auto;grid-template-rows:auto auto;
                 grid-template-areas:"localVideo joystick" "recvCanvas joystick";
                 align-items:center;height:calc(100vh - 200px);}
      #localVideo{grid-area:localVideo;}#recvCanvas{grid-area:recvCanvas;}
      #joystick{grid-area:joystick;}
    }
    @media (orientation:landscape){
      #mediaArea{grid-template-columns:1fr auto 1fr;grid-template-rows:auto;
                 grid-template-areas:"localVideo joystick recvCanvas";
                 align-items:center;height:calc(100vh - 200px);}
      #localVideo{grid-area:localVideo;}#recvCanvas{grid-area:recvCanvas;}
      #joystick{grid-area:joystick;}
    }
    #controls{padding:10px;}
    #controls select,#controls input,#controls button{margin:4px;}
    #log{white-space:pre-wrap;background:#f7f7f7;padding:8px;margin:8px;
         text-align:left;height:120px;overflow-y:auto;font-size:.9em;}
  </style>
</head>
<body>
<h1>PNG連番ロスレス送信デモ（改善版）</h1>

<div id="mediaArea">
  <video id="localVideo" autoplay playsinline muted></video>
  <canvas id="sendCanvas"></canvas>
  <canvas id="recvCanvas"></canvas>
  <div id="joystick"><div id="knob"></div></div>
</div>
<div id="joystickState">中心</div>
<hr/>

<div id="controls">
  <p>自分のID: <span id="myId">―</span></p>
  <div id="userControls">
    <label>カメラ選択: <select id="videoSource"></select></label>
    <button id="startCamera">カメラ開始</button>
    <input type="text" id="targetId" placeholder="相手のIDを入力" />
    <button id="connectBtn">接続</button>
  </div>
</div>

<h3>ログ</h3>
<div id="log">[INFO] ページ読み込み完了</div>

<script>
// ---- ユーティリティ ----
const $ = id=>document.getElementById(id);
const log = m=>{ console.log(m); $('log').textContent+='\n'+m; $('log').scrollTop=$('log').scrollHeight; };
const params = new URLSearchParams(location.search);
const isCompute = params.get('role')==='compute';

// ---- DOM ----
const localVideo = $('localVideo');
const sendCanvas = $('sendCanvas');
const recvCanvas = $('recvCanvas');
const joy = $('joystick');
const knob = $('knob');
const stateDiv = $('joystickState');
const myIdSpan = $('myId');
const videoSelect = $('videoSource');
const startCamBtn = $('startCamera');
const targetInput = $('targetId');
const connectBtn = $('connectBtn');

// ---- PeerJS ----
const peer = new Peer();
peer.on('open', id=>{ myIdSpan.textContent=id; log('[INFO] Peer open: '+id); });
peer.on('error',e=>log('[ERROR] Peer: '+e));

// ---- DataChannel ----
let dataConn=null;
function setupDataChannel(conn){
  dataConn=conn;
  conn.on('open',()=>log('[INFO] DC open'));
  conn.on('error',e=>log('[ERROR] DC: '+e));
  conn.on('data',handleData);
}

// ---- PNG受信＆再生 ----
let recvFrames=[], idleTimer=null;
const IDLE=2000;
function finishReceive(){
  if(!recvFrames.length) return;
  const ctx = recvCanvas.getContext('2d');
  // canvasを表示＆サイズ合わせ
  recvCanvas.style.display='block';
  recvCanvas.width = sendCanvas.width;
  recvCanvas.height= sendCanvas.height;
  let idx=0;
  function draw(){
    if(idx>=recvFrames.length) return;
    const img = new Image();
    img.onload = ()=>{
      ctx.clearRect(0,0,recvCanvas.width,recvCanvas.height);
      ctx.drawImage(img,0,0,recvCanvas.width,recvCanvas.height);
      URL.revokeObjectURL(img.src);
      idx++;
      setTimeout(draw,100); // 10fps
    };
    img.src = URL.createObjectURL(new Blob([recvFrames[idx]],{type:'image/png'}));
  }
  draw();
  log('[INFO] 受信完了 '+recvFrames.length+'枚');
  recvFrames=[];
}
function handleData(d){
  if(d.type==='start-pngseq'){
    recvFrames=[];
    log('[INFO] 受信開始');
    return;
  }
  if(d.type==='end-pngseq'){
    log('[INFO] 受信終了');
    clearTimeout(idleTimer);
    finishReceive();
    return;
  }
  if(d instanceof ArrayBuffer){
    recvFrames.push(d);
    clearTimeout(idleTimer);
    idleTimer=setTimeout(finishReceive,IDLE);
    return;
  }
  if(d.type==='joystick'){
    setKnob(d.value);
  }
}

// ---- PNG送信バッファ制御 ----
let pngQueue=[], pngInt=null, sending=false;
function queueFrame(){
  if(!sending) return;
  const ctx = sendCanvas.getContext('2d');
  ctx.drawImage(localVideo,0,0,sendCanvas.width,sendCanvas.height);
  sendCanvas.toBlob(b=>{
    b.arrayBuffer().then(buf=> pngQueue.push(buf) );
  },'image/png');
}
function sendLoop(){
  if(!sending||!dataConn||!dataConn.open) return;
  if(pngQueue.length){
    dataConn.send(pngQueue.shift());
    setTimeout(sendLoop,5);
  } else {
    setTimeout(sendLoop,10);
  }
}
function startPNG(){
  if(!localVideo.srcObject||!dataConn||!dataConn.open) return;
  sending=true;
  // canvasサイズ同期
  const t = localVideo.srcObject.getVideoTracks()[0];
  const s = t.getSettings? t.getSettings() : {width:1920,height:1080};
  sendCanvas.width=s.width; sendCanvas.height=s.height;
  dataConn.send({type:'start-pngseq'});
  queueFrame();            // ← **即キャプチャ**
  pngInt = setInterval(queueFrame,100);
  sendLoop();
}
function stopPNG(){
  sending=false;
  clearInterval(pngInt);
  if(dataConn&&dataConn.open) dataConn.send({type:'end-pngseq'});
  pngQueue=[];
}

// ---- ジョイスティック制御 ----
function setKnob(v){
  const r=joy.getBoundingClientRect(),
        m=r.height/2-knob.offsetHeight/2,
        y=Math.max(-m,Math.min(m,v*m));
  knob.style.transform=`translate(-50%,calc(-50% + ${y}px))`;
  stateDiv.textContent = v>0.5?'下':v<-0.5?'上':'中心';
}
function updateJoy(v){
  setKnob(v);
  if(dataConn&&dataConn.open) dataConn.send({type:'joystick',value:v});
  if(v>0.5&&!sending) startPNG();
  if(Math.abs(v)<=0.5&&sending) stopPNG();
}
let drag=false,rect={},mY=0;
joy.addEventListener('pointerdown',e=>{
  e.preventDefault(); drag=true;
  rect=joy.getBoundingClientRect();
  mY=rect.height/2-knob.offsetHeight/2;
  joy.setPointerCapture(e.pointerId);
  move(e.clientY);
});
joy.addEventListener('pointermove',e=>{ if(drag){e.preventDefault();move(e.clientY);} });
joy.addEventListener('pointerup',e=>{
  e.preventDefault(); drag=false;
  knob.style.transition='transform .15s';
  knob.style.transform='translate(-50%,-50%)';
  setTimeout(()=>knob.style.transition='',160);
  updateJoy(0);
});
function move(cy){
  let y=cy-(rect.top+rect.height/2);
  y=Math.max(-mY,Math.min(mY,y));
  knob.style.transition='';
  knob.style.transform=`translate(-50%,calc(-50% + ${y}px))`;
  updateJoy(y/mY);
}

// ---- カメラ & 接続 ----
navigator.mediaDevices.enumerateDevices().then(ds=>{
  ds.filter(d=>d.kind==='videoinput').forEach(d=>{
    const o=document.createElement('option');
    o.value=d.deviceId; o.text=d.label||d.deviceId;
    videoSelect.appendChild(o);
  });
});
startCamBtn.onclick=()=>{
  const id=videoSelect.value; if(!id){log('[ERR] カメラ未選択');return;}
  navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id}},audio:false})
    .then(s=>{ localVideo.srcObject=s; log('[INFO] カメラ開始'); })
    .catch(e=>log('[ERR] gUM:'+e.message));
};
connectBtn.onclick=()=>{
  const t=targetInput.value.trim(); if(!t){log('[ERR] ID空');return;}
  setupDataChannel(peer.connect(t));
};
peer.on('connection',c=>setupDataChannel(c));
</script>
</body>
</html>
