<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebRTC P2P + Joystick 控制ストリーミング</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family:sans-serif; text-align:center; margin:0; padding:0 }
    /* メディア＆ジョイスティック領域 */
    #mediaArea { display:grid; grid-gap:10px; padding:10px }
    #localVideo,#remoteVideo { width:100%; height:auto; background:#000 }
    #joystick {
      box-sizing:border-box;
      width:60px; height:240px; margin:auto;
      border:4px solid #000; border-radius:30px;
      background:#fff; touch-action:none; overscroll-behavior:contain;
      position:relative;
    }
    #joystick #knob {
      position:absolute; left:50%; top:50%;
      width:40px; height:40px; margin:-20px 0 0 -20px;
      border-radius:50%; background:#000;
      transform:translate(0,0); transition:transform .15s;
      pointer-events:none;
    }
    @media (orientation: portrait) {
      #mediaArea {
        grid-template-columns:1fr auto;
        grid-template-rows:auto auto;
        grid-template-areas:
          "localVideo joystick"
          "remoteVideo joystick";
        align-items:center; height:calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo }
      #remoteVideo { grid-area: remoteVideo }
      #joystick    { grid-area: joystick }
    }
    @media (orientation: landscape) {
      #mediaArea {
        grid-template-columns:1fr auto 1fr;
        grid-template-rows:auto;
        grid-template-areas:"localVideo joystick remoteVideo";
        align-items:center; height:calc(100vh - 200px);
      }
      #localVideo  { grid-area: localVideo }
      #remoteVideo { grid-area: remoteVideo }
      #joystick    { grid-area: joystick }
    }
    #joystickState { font-weight:bold; margin-top:4px }
    #controls { padding:10px }
    #controls select,#controls input,#controls button { margin:4px }
    #log {
      white-space:pre-wrap; background:#f7f7f7;
      padding:8px; margin:8px; text-align:left;
      height:120px; overflow-y:auto; font-size:.9em;
    }
  </style>
</head>
<body>
  <h1>WebRTC P2P + Joystick ストリーミング制御</h1>

  <!-- メディア＋ジョイスティック -->
  <div id="mediaArea">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="joystick"><div id="knob"></div></div>
  </div>
  <div id="joystickState">中心</div>

  <hr/>

  <!-- 通信コントロール -->
  <div id="controls">
    <p>自分のID: <span id="myId">―</span></p>
    <div id="userControls">
      <label>カメラ選択:
        <select id="videoSource"></select>
      </label>
      <button id="startCamera">カメラ開始</button><br>
      <input type="text" id="targetId" placeholder="計算ノードIDを入力">
      <button id="callBtn" disabled>発信（ジョイスティック操作で自動）</button>
    </div>
    <div id="computeControls" style="display:none">
      <p>計算モード: Unity Video Capture を自動選択して待機</p>
    </div>
  </div>

  <h3>ログ</h3>
  <div id="log">[INFO] ページ読み込み完了</div>

  <script>
  /*────────────────────────────────
     1. ジョイスティック制御
  ────────────────────────────────*/
  (function(){
    const joy = document.getElementById('joystick');
    const knob = document.getElementById('knob');
    const stateDiv = document.getElementById('joystickState');
    let dragging=false, rect, maxY, lastState = 'center';
    let recorder, recordedBlobs = [];

    function updateState(v){
      if(v < -0.5) return 'up';
      if(v >  0.5) return 'down';
      return 'center';
    }

    function showStateLabel(s){
      stateDiv.textContent = s === 'up'   ? '上'
                           : s === 'down' ? '下'
                           : '中心';
    }

    function moveKnob(clientY){
      let y = clientY - (rect.top + rect.height/2);
      y = Math.max(-maxY, Math.min(maxY, y));
      knob.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
    }

    function centerKnob(){
      knob.style.transition = 'transform .15s';
      knob.style.transform = 'translate(-50%, -50%)';
      setTimeout(()=> knob.style.transition = '',160);
    }

    function captureFrameAndCall(){
      // 単一フレーム送信
      const cvs = document.createElement('canvas');
      cvs.width  = localVideo.videoWidth;
      cvs.height = localVideo.videoHeight;
      cvs.getContext('2d').drawImage(localVideo,0,0);
      const stream = cvs.captureStream(1);
      doCall(stream);
      // 1秒後に停止
      setTimeout(()=> stream.getTracks().forEach(t=>t.stop()),1000);
    }

    function startRecording(){
      recordedBlobs = [];
      recorder = new MediaRecorder(localVideo.srcObject);
      recorder.ondataavailable = e=>{
        if(e.data && e.data.size) recordedBlobs.push(e.data);
      };
      recorder.start();
      log('[INFO] 動画記録開始');
    }

    function stopRecordingAndCall(){
      recorder.onstop = ()=>{
        const blob = new Blob(recordedBlobs,{type:recordedBlobs[0].type});
        const video = document.createElement('video');
        video.src = URL.createObjectURL(blob);
        video.muted = true;
        video.play();
        const stream = video.captureStream();
        video.onended = () => stream.getTracks().forEach(t=>t.stop());
        doCall(stream);
        log('[INFO] 記録動画を送信');
      };
      recorder.stop();
    }

    joy.addEventListener('pointerdown', e=>{
      e.preventDefault();
      dragging = true;
      rect = joy.getBoundingClientRect();
      maxY = rect.height/2 - knob.offsetHeight/2;
      moveKnob(e.clientY);
      joy.setPointerCapture(e.pointerId);
      const state = updateState((e.clientY - (rect.top+rect.height/2))/maxY);
      if(state==='up') {
        captureFrameAndCall();
      } else if(state==='down') {
        startRecording();
      }
      lastState = state;
    }, {passive:false});

    joy.addEventListener('pointermove', e=>{
      e.preventDefault();
      if(!dragging) return;
      moveKnob(e.clientY);
      const state = updateState((e.clientY - (rect.top+rect.height/2))/maxY);
      if(state==='up' && lastState!=='up'){
        captureFrameAndCall();
      }
      lastState = state;
    }, {passive:false});

    joy.addEventListener('pointerup', e=>{
      e.preventDefault();
      dragging = false;
      centerKnob();
      const state = lastState;
      lastState = 'center';
      if(state==='down'){
        stopRecordingAndCall();
      }
      showStateLabel(state);
    }, {passive:false});
  })();

  /*────────────────────────────────
     2. PeerJS P2P 通信ロジック
  ────────────────────────────────*/
  const params = new URLSearchParams(location.search);
  const role   = params.get('role');
  const isCompute = role==='compute';

  const localVideo      = document.getElementById('localVideo');
  const remoteVideo     = document.getElementById('remoteVideo');
  const myIdSpan        = document.getElementById('myId');
  const logDiv          = document.getElementById('log');
  const userControls    = document.getElementById('userControls');
  const computeControls = document.getElementById('computeControls');
  const videoSelect     = document.getElementById('videoSource');
  const startCamBtn     = document.getElementById('startCamera');
  const targetInput     = document.getElementById('targetId');
  const callBtn         = document.getElementById('callBtn');

  function log(msg){
    console.log(msg);
    logDiv.textContent += '\n'+msg;
  }

  // PeerJS 初期化
  const peer = new Peer();
  peer.on('open', id=>{
    myIdSpan.textContent = id;
    log(`[INFO] 自分のID: ${id}`);
  });
  peer.on('error', err=>{
    log(`[ERROR] PeerJS: ${err}`);
  });

  // 発信関数
  function doCall(stream){
    const target = targetInput.value.trim();
    if(!target){
      log('[ERROR] 計算ノードIDを入力してください');
      return;
    }
    const call = peer.call(target, stream);
    call.on('stream', s=>{
      remoteVideo.srcObject = s;
      log('[INFO] 処理後映像を受信');
    });
    call.on('error', e=>{
      log(`[ERROR] 通話エラー: ${e}`);
    });
  }

  if(isCompute){
    // ── 計算側モード ──
    userControls.style.display    = 'none';
    computeControls.style.display = 'block';
    log('[INFO] 計算モード: Unity Video Capture を自動選択');

    navigator.mediaDevices.enumerateDevices()
      .then(devs=>{
        const cam = devs.find(d=>
          d.kind==='videoinput'&&d.label.includes('Unity Video Capture')
        );
        if(!cam){
          log('[ERROR] Unity Video Capture 未検出');
          throw new Error();
        }
        log(`[INFO] ${cam.label} を使用`);
        return navigator.mediaDevices.getUserMedia({
          video:{ deviceId:{ exact:cam.deviceId }}, audio:false
        });
      })
      .then(stream=>{
        localVideo.srcObject = stream;
        log('[INFO] 仮想カメラ映像取得完了');
        peer.on('call', call=>{
          log('[INFO] 着信: 映像処理開始');
          call.answer(stream);
          call.on('stream', s=>{
            remoteVideo.srcObject = s;
            log('[INFO] 入力映像受信');
          });
        });
      })
      .catch(_=>{
        log('[ERROR] 仮想カメラ取得失敗');
        peer.on('call', call=>{
          call.answer(null);
        });
      });

  } else {
    // ── ユーザーモード ──
    userControls.style.display    = 'block';
    computeControls.style.display = 'none';
    log('[INFO] ユーザーモード: カメラ開始後に操作してください');

    navigator.mediaDevices.enumerateDevices()
      .then(devs=>{
        videoSelect.innerHTML = '';
        devs.filter(d=>d.kind==='videoinput').forEach(d=>{
          const o = document.createElement('option');
          o.value = d.deviceId;
          o.text  = d.label||d.deviceId;
          videoSelect.appendChild(o);
        });
        if(!videoSelect.options.length)
          log('[WARN] カメラが見つかりません');
      });

    startCamBtn.onclick = ()=>{
      const id = videoSelect.value;
      if(!id){ log('[ERROR] カメラ選択してください'); return; }
      navigator.mediaDevices.getUserMedia({
        video:{ deviceId:{ exact:id }}, audio:false
      })
      .then(stream=>{
        localVideo.srcObject = stream;
        window.localStream = stream;
        log(`[INFO] カメラ開始: ${stream.getVideoTracks()[0].label}`);
      })
      .catch(err=>{ log(`[ERROR] カメラ取得失敗: ${err.message}`) });
    };
  }
  </script>
</body>
</html>
