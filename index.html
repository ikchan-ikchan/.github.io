<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>骨格推定 P2P（カメラ選択対応）</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width:45%; margin:0 2%; background:#000 }
    #controls { margin:1em; }
    #status   { color:red; white-space:pre-wrap; text-align:left; }
    #cameraSelect { display:none; margin-top:0.5em; }
  </style>
</head>
<body>
  <h1>骨格推定 P2P（カメラ選択対応）</h1>
  <div id="controls">
    <label><input type="radio" name="role" value="compute"> 計算</label>
    <label><input type="radio" name="role" value="user"> ユーザー</label><br>
    部屋番号：<input type="text" id="roomCode" placeholder="1234">
    <button id="startBtn">開始</button>
    <button id="callBtn">接続</button>
    <!-- ユーザーのみ表示 -->
    <div id="cameraSelect">
      カメラを選択：
      <select id="camList"></select>
    </div>
  </div>

  <div id="status">[INFO] Ready</div>
  <p>あなたの PeerID: <span id="myId">—</span></p>
  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <script>
    const log      = msg => {
      console.log(msg);
      document.getElementById('status').textContent += '\n'+msg;
    };
    const controls = document.getElementById('controls');
    const startBtn = document.getElementById('startBtn');
    const callBtn  = document.getElementById('callBtn');
    const roomIn   = document.getElementById('roomCode');
    const myId     = document.getElementById('myId');
    const localV   = document.getElementById('localVideo');
    const remoteV  = document.getElementById('remoteVideo');
    const camDiv   = document.getElementById('cameraSelect');
    const camList  = document.getElementById('camList');

    let role, peer, localStream, roomCode;

    async function listCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      camList.innerHTML = '';
      cams.forEach(d=>{
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.text  = d.label || d.deviceId;
        camList.appendChild(o);
      });
    }

    startBtn.onclick = async () => {
      log('[INFO] Starting…');
      role     = document.querySelector('input[name=role]:checked')?.value;
      roomCode = roomIn.value.trim();
      if (!role)     return log('[ERROR] 先に「計算」か「ユーザー」を選択');
      if (!roomCode) return log('[ERROR] 部屋番号を入力してください');

      // ユーザーならカメラ一覧取得＆表示
      if (role === 'user') {
        await listCameras();
        camDiv.style.display = 'block';
      } else {
        camDiv.style.display = 'none';
      }

      // PeerJS 初期化
      peer = new Peer(`${role}-${roomCode}`, {
        host: '0.peerjs.com', secure: true, port: 443,
        config:{ iceServers:[{urls:'stun:stun.l.google.com:19302'}] }
      });
      peer.on('open', id=>{
        myId.textContent = id;
        log(`[INFO] Peer opened: ${id}`);
      });
      peer.on('error', err=>log(`[ERROR] PeerJS: ${err}`));

      if (role === 'compute') {
        callBtn.style.display = 'none';
        // 計算側はPython仮想カメラを取得
        const cams = await navigator.mediaDevices.enumerateDevices();
        const vc = cams.find(d=>
          d.kind==='videoinput' &&
          /VirtualCam|OBS Virtual Camera|Unity Capture/.test(d.label)
        );
        if (!vc) return log('[ERROR] 仮想カメラが見つかりません');
        localStream = await navigator.mediaDevices.getUserMedia({
          video:{ deviceId: vc.deviceId }
        });
        localV.srcObject = localStream;
        peer.on('call', call=>{
          log('[INFO] Incoming call → answer with VC');
          call.answer(localStream);
          call.on('stream', s=>{
            remoteV.srcObject = s;
            log('[INFO] Received user stream');
          });
        });

      } else {
        // ユーザー側は選択されたデバイスで getUserMedia
        const deviceId = camList.value;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { deviceId: deviceId }, audio: false
          });
        } catch(e) {
          return log(`[ERROR] getUserMedia: ${e}`);
        }
        localV.srcObject = localStream;
        log('[INFO] Local camera ready');
        peer.on('call', call=>{
          log('[INFO] Incoming call → answer with User Camera');
          call.answer(localStream);
          call.on('stream', s=>{
            remoteV.srcObject = s;
            log('[INFO] Received remote stream');
          });
        });
      }
    };

    callBtn.onclick = ()=>{
      log('[INFO] Connecting…');
      if (!peer || !roomCode) return log('[ERROR] 先に開始してください');
      const target = role==='user'
        ? `compute-${roomCode}`
        : `user-${roomCode}`;
      log(`[INFO] Calling ${target}`);
      try {
        const call = peer.call(target, localStream);
        call.on('stream', s=>{
          remoteV.srcObject = s;
          log('[INFO] Received remote stream');
        });
        call.on('error', e=>log(`[ERROR] call error: ${e}`));
      } catch(e) {
        log(`[ERROR] peer.call failed: ${e}`);
      }
    };
  </script>
</body>
</html>
