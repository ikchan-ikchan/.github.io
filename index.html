<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MediaPipe Pose カメラ選択 & FPS設定デモ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
    }
    video, canvas {
      display: block;
      margin: 10px auto;
    }
    #controls {
      margin: 10px;
    }
  </style>
  <!-- MediaPipe Pose、Camera Utils、Drawing Utils の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
</head>
<body>
  <h2>MediaPipe Pose カメラ選択 & FPS設定デモ</h2>
  <div id="controls">
    <label for="cameraSelect">カメラ選択:</label>
    <select id="cameraSelect"></select>
    &nbsp;&nbsp;
    <label for="frameRateInput">フレームレート (fps):</label>
    <input type="number" id="frameRateInput" min="1" value="30" style="width:60px;">
    &nbsp;&nbsp;
    <button id="startButton">開始</button>
  </div>

  <!-- 映像（内部用：iOS は非表示にして利用） -->
  <video id="video" width="640" height="480" playsinline style="display: none;"></video>
  <!-- 描画用キャンバス -->
  <canvas id="output_canvas" width="640" height="480"></canvas>

  <script>
    // DOM 要素の取得
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const cameraSelect = document.getElementById('cameraSelect');
    const frameRateInput = document.getElementById('frameRateInput');
    const startButton = document.getElementById('startButton');

    // MediaPipe Pose の初期化
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      smoothSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onResults);

    // グローバル変数
    let cameraInstance = null;      // MediaPipe Camera Utils 用（非 iOS 用）
    let detectionLoopId = null;     // iOS 用自作ループで使うタイマーID

    // iOS 判定（iPhone/iPad）
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    // ① カメラデバイスの列挙
    async function enumerateCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        cameraSelect.innerHTML = "";
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `カメラ ${index + 1}`;
          cameraSelect.appendChild(option);
        });
      } catch (err) {
        console.error("カメラの列挙に失敗:", err);
      }
    }

    // ② 結果描画関数（MediaPipe の onResults）
    function onResults(results) {
      // 描画前にキャンバスをクリア
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      // 結果画像（入力映像）を背景に描画
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      if (results.poseLandmarks) {
        // Drawing Utils を利用して接続線を描画（グローバル定義済みの POSE_CONNECTIONS を使用）
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS,
                       {color: '#00FF00', lineWidth: 4});
        // キーポイント描画
        drawLandmarks(canvasCtx, results.poseLandmarks,
                      {color: '#FF0000', lineWidth: 2});
      }
      canvasCtx.restore();
    }

    // ③ iOS 用：自前で getUserMedia を呼び出し、FPS 指定の独自ループで推論を実行
    async function startCameraForIOS() {
      // 選択されているカメラのラベルから facingMode を決定
      const selectedLabel = cameraSelect.options[cameraSelect.selectedIndex].text.toLowerCase();
      // ラベルに "back" または "rear" または "環境" が含まれていれば、環境カメラ（リアカメラ）を指定
      const facingMode = (selectedLabel.includes("back") || selectedLabel.includes("rear") || selectedLabel.includes("環境"))
                         ? "environment" : "user";
      const constraints = {
        video: {
          facingMode: { exact: facingMode },
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      };
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        await videoElement.play();
        // FPS 指定（ms 単位の間隔）
        const fps = parseInt(frameRateInput.value, 10) || 30;
        const interval = 1000 / fps;
        // 自前ループ：指定間隔ごとに pose.send() を呼び出す
        function detectionLoop() {
          pose.send({ image: videoElement });
          detectionLoopId = setTimeout(detectionLoop, interval);
        }
        detectionLoop();
      } catch (err) {
        console.error("iOS カメラ映像の取得に失敗:", err);
      }
    }

    // ④ 非 iOS（デスクトップ・Android）の場合：MediaPipe Camera Utils を利用
    async function startCameraForNonIOS() {
      const fps = parseInt(frameRateInput.value, 10) || 30;
      // MediaPipe Camera のオプション：deviceId を指定するとそのカメラを利用
      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 640,
        height: 480,
        deviceId: cameraSelect.value
      });
      try {
        await cameraInstance.start();
      } catch (err) {
        console.error("カメラ映像の取得に失敗:", err);
      }
    }

    // ⑤ 「開始」ボタン押下時の処理
    startButton.addEventListener('click', async () => {
      // 既存のループがあれば停止する
      if (detectionLoopId) { clearTimeout(detectionLoopId); detectionLoopId = null; }
      if (cameraInstance && !isIOS) { cameraInstance.stop(); cameraInstance = null; }
      // iOS か否かで処理を切り替える
      if (isIOS) {
        await startCameraForIOS();
      } else {
        await startCameraForNonIOS();
      }
    });

    // ページ読み込み時にカメラデバイスを列挙する
    enumerateCameras();
  </script>
</body>
</html>
