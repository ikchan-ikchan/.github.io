<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC P2P + ジョイスティック + 録画ストリーミング</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body{font-family:sans-serif;text-align:center;margin:0;padding:0}
    #mediaArea{display:grid;grid-gap:10px;padding:10px}
    #localVideo,#remoteVideo{width:100%;height:auto;background:#000}
    #joystick{box-sizing:border-box;width:60px;height:240px;margin:auto;
      position:relative;border:4px solid #000;border-radius:30px;background:#fff;
      touch-action:none;overscroll-behavior:contain}
    #knob{position:absolute;left:50%;top:50%;width:40px;height:40px;
      border-radius:50%;background:#000;transform:translate(-50%,-50%);
      transition:transform .15s;pointer-events:none}
    #joystickState{font-weight:bold;margin-top:4px}
    #controls{padding:10px}
    #controls select,#controls input,#controls button{margin:4px}
    #log{white-space:pre-wrap;background:#f7f7f7;padding:8px;margin:8px;
      text-align:left;height:120px;overflow-y:auto;font-size:.9em}
    @media(orientation:portrait){
      #mediaArea{grid-template-columns:1fr auto;grid-template-rows:auto auto;
        grid-template-areas:"localVideo joystick""remoteVideo joystick";
        align-items:center;height:calc(100vh - 200px)}
      #localVideo{grid-area:localVideo}#remoteVideo{grid-area:remoteVideo}
      #joystick{grid-area:joystick}
    }
    @media(orientation:landscape){
      #mediaArea{grid-template-columns:1fr auto 1fr;grid-template-rows:auto;
        grid-template-areas:"localVideo joystick remoteVideo";
        align-items:center;height:calc(100vh - 200px)}
      #localVideo{grid-area:localVideo}#remoteVideo{grid-area:remoteVideo}
      #joystick{grid-area:joystick}
    }
  </style>
</head>
<body>
<h1>WebRTC P2P + ジョイスティック + 録画ストリーミング</h1>

<div id="mediaArea">
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline controls></video>
  <div id="joystick"><div id="knob"></div></div>
</div>
<div id="joystickState">中心</div>
<hr/>

<div id="controls">
  <p>自分のID: <span id="myId">―</span></p>

  <!-- ユーザーモード -->
  <div id="userControls">
    <label>カメラ選択:
      <select id="videoSource"></select>
    </label>
    <button id="startCamera">カメラ開始</button>
    <input type="text" id="targetId" placeholder="相手のIDを入力">
    <button id="connectBtn">接続</button>
  </div>

  <!-- 計算ノード -->
  <div id="computeControls" style="display:none;">
    <p id="computeMsg">計算ノード: Unity カメラ検出中…</p>
    <div id="fallbackUI" style="display:none;">
      <label>カメラ手動選択:
        <select id="computeVideoSel"></select>
      </label>
      <button id="retryBtn">再検出</button>
      <button id="computeStartBtn">このカメラで開始</button>
    </div>
  </div>

  <button id="recordBtn" disabled>録画 開始</button>
</div>

<h3>ログ</h3>
<div id="log">[INFO] ページ読み込み完了</div>

<script>
/* =============== 共通ユーティリティ =============== */
const $  = id=>document.getElementById(id);
const log=t=>{console.log(t);$('log').textContent+='\n'+t;$('log').scrollTop=$('log').scrollHeight};
const params=new URLSearchParams(location.search);
const isCompute=params.get('role')==='compute';

/* =============== DOM 参照 =============== */
const localVideo=$('localVideo'),remoteVideo=$('remoteVideo');
const joy=$('joystick'),knob=$('knob'),stateDiv=$('joystickState');
const userUI=$('userControls'),computeUI=$('computeControls');
const videoSel=$('videoSource'),startBtn=$('startCamera');
const targetInp=$('targetId'),connectBtn=$('connectBtn');
const recordBtn=$('recordBtn');

/* =============== PeerJS =============== */
const peer=new Peer();
peer.on('open',id=>{$('myId').textContent=id;log(`[INFO] Peer open: ${id}`);});
peer.on('error',e=>log(`[ERROR] Peer: ${e}`));

/* =============== DataChannel 共通 =============== */
let dataConn=null,recvBuf=[],recvType='';
function setupDC(conn){
  dataConn=conn;
  conn.on('open', ()=>log('[INFO] DC open'));
  conn.on('error',e=>log(`[ERROR] DC: ${e}`));
  conn.on('data',d=>{
    if(d.type==='file-info'){recvType=d.fileType;recvBuf=[];log('[INFO] file-info 受信');}
    else if(d instanceof ArrayBuffer){recvBuf.push(d);}
    else if(d.type==='stop'){
      const blob=new Blob(recvBuf,{type:recvType});
      remoteVideo.src=URL.createObjectURL(blob);
      log('[INFO] 受信完了 '+blob.size+' bytes');
    }else if(d.type==='joystick'){setKnob(d.value);}
  });
}

/* =============== ジョイスティック =============== */
function setKnob(v){
  const r=joy.getBoundingClientRect(),max=r.height/2-knob.offsetHeight/2;
  const y=Math.max(-max,Math.min(max,v*max));
  knob.style.transition='transform .15s';
  knob.style.transform=`translate(-50%,calc(-50% + ${y}px))`;
  stateDiv.textContent=v<-0.5?'上':v>0.5?'下':'中心';
  setTimeout(()=>knob.style.transition='',160);
}
function sendJoy(v){
  if(dataConn&&dataConn.open&&!isCompute)dataConn.send({type:'joystick',value:v});
}
if(!isCompute){
  let drag=false,rect,maxY;
  joy.addEventListener('pointerdown',e=>{
    e.preventDefault();drag=true;rect=joy.getBoundingClientRect();
    maxY=rect.height/2-knob.offsetHeight/2;joy.setPointerCapture(e.pointerId);move(e.clientY);
  },{passive:false});
  joy.addEventListener('pointermove',e=>{if(drag)move(e.clientY);},{passive:false});
  joy.addEventListener('pointerup',e=>{drag=false;reset();},{passive:false});
  function move(cy){const y=cy-(rect.top+rect.height/2);knob.style.transition='';
    knob.style.transform=`translate(-50%,calc(-50% + ${Math.max(-maxY,Math.min(maxY,y))}px))`;
    sendJoy(y/maxY);}
  function reset(){knob.style.transition='transform .15s';knob.style.transform='translate(-50%,-50%)';
    sendJoy(0);setTimeout(()=>knob.style.transition='',160);}
}

/* =============== MediaRecorder（改良） =============== */
let recorder=null,pending=0,stopped=false;
function setupRecorder(stream){
  recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5_000_000});
  const SLICE=1000;
  recorder.onstart=()=>{
    dataConn&&dataConn.send({type:'file-info',fileType:recorder.mimeType});
    pending=0;stopped=false;log('[INFO] 録画開始');
  };
  recorder.ondataavailable=e=>{
    if(!e.data||!e.data.size)return;
    pending++;
    e.data.arrayBuffer().then(buf=>{
      dataConn&&dataConn.send(buf);
      pending--;
      if(stopped&&pending===0){dataConn.send({type:'stop'});log('[INFO] stop 送信');}
    });
  };
  recorder.onstop=()=>{
    stopped=true;
    if(pending===0){dataConn&&dataConn.send({type:'stop'});log('[INFO] stop 送信');}
  };
  recordBtn.disabled=false;
}

/* =============== ユーザーモード UI =============== */
if(!isCompute){
  computeUI.style.display='none';
  navigator.mediaDevices.enumerateDevices().then(devs=>{
    devs.filter(d=>d.kind==='videoinput').forEach(d=>{
      const o=document.createElement('option');o.value=d.deviceId;o.text=d.label||d.deviceId;videoSel.appendChild(o);
    });
  });
  startBtn.onclick=()=>{
    const id=videoSel.value;if(!id){log('[ERR] カメラ未選択');return;}
    navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id},width:1920,height:1080},audio:true})
      .then(s=>{localVideo.srcObject=s;setupRecorder(s);})
      .catch(e=>log('[ERR] gUM: '+e.message));
  };
  connectBtn.onclick=()=>{
    const tgt=targetInp.value.trim();if(!tgt){log('[ERR] IDを入力');return;}
    setupDC(peer.connect(tgt));
  };
}

/* =============== 計算ノード UI =============== */
if(isCompute){
  userUI.style.display='none';computeUI.style.display='block';
  const msg=$('computeMsg'),fb=$('fallbackUI'),sel=$('computeVideoSel');
  const retry=$('retryBtn'),selStart=$('computeStartBtn');
  const fill=()=>{sel.innerHTML='';navigator.mediaDevices.enumerateDevices().then(dv=>{
    dv.filter(d=>d.kind==='videoinput').forEach(d=>{const o=document.createElement('option');
      o.value=d.deviceId;o.text=d.label||d.deviceId;sel.appendChild(o);});});
  };
  const waitUnity=async(max=6,intv=1500)=>{
    for(let i=0;i<max;i++){
      const cam=(await navigator.mediaDevices.enumerateDevices())
                .find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
      if(cam)return cam;await new Promise(r=>setTimeout(r,intv));
    }return null;
  };
  const startCam=async(id)=>{
    try{const s=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id},width:1920,height:1080},audio:true});
      localVideo.srcObject=s;setupRecorder(s);msg.textContent='カメラ起動';fb.style.display='none';}
    catch(e){log('[ERR] cam: '+e.message);}
  };
  (async()=>{const cam=await waitUnity();if(cam){startCam(cam.deviceId);}
    else{msg.textContent='Unity カメラ未検出';fb.style.display='block';fill();}})();
  navigator.mediaDevices.ondevicechange=async()=>{
    if(localVideo.srcObject)return;
    const cam=(await navigator.mediaDevices.enumerateDevices())
              .find(d=>d.kind==='videoinput'&&d.label.includes('Unity Video Capture'));
    if(cam){log('[INFO] devicechange で検出');startCam(cam.deviceId);}
  };
  retry.onclick=async()=>{fb.style.display='none';msg.textContent='再検出中…';
    const cam=await waitUnity(5,1000);if(cam)startCam(cam.deviceId);
    else{msg.textContent='見つかりません';fb.style.display='block';fill();}};
  selStart.onclick=()=>startCam(sel.value);
  peer.on('connection',c=>{log('[INFO] DC 接続');setupDC(c);});
}

/* =============== 録画ボタン =============== */
recordBtn.onclick=()=>{
  if(!recorder){log('[ERR] カメラ開始して下さい');return;}
  if(!dataConn||!dataConn.open){log('[ERR] 接続していません');return;}
  if(recorder.state==='inactive'){
    recorder.start(1000);recordBtn.textContent='録画 停止';
  }else{recorder.stop();recordBtn.textContent='録画 開始';}
};
</script>
</body>
</html>
