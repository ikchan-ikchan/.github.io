<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カメラ映像から人検出</title>
  <style>
    /* 動画とキャンバスを重ねて表示 */
    #videoElement, #overlay {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <!-- カメラ映像を表示するためのvideoタグ -->
  <video id="videoElement" width="640" height="480" autoplay muted></video>
  <!-- 結果を描画するためのcanvasタグ -->
  <canvas id="overlay" width="640" height="480"></canvas>

  <!-- TensorFlow.jsとCOCO-SSDモデルの読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    let model = null;

    // カメラ映像の取得
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          }
        });
      } catch (err) {
        console.error("カメラ取得エラー: ", err);
      }
    }

    // COCO-SSDモデルの読み込み
    async function loadModel() {
      model = await cocoSsd.load();
      console.log("モデル読み込み完了");
    }

    // 動画フレーム毎に物体検出を実行し、結果を描画する関数
    async function detectFrame() {
      if (video.readyState === 4 && model) {
        // 検出結果の取得
        const predictions = await model.detect(video);

        // キャンバスのクリア
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 各検出結果に対して、personかどうか確認し描画する
        predictions.forEach(prediction => {
          if (prediction.class === 'person' && prediction.score > 0.5) { // 信頼度50%以上の場合
            const [x, y, width, height] = prediction.bbox;

            // 塗りつぶしの矩形 (半透明のカラー)
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';  // 赤を半透明で塗る
            ctx.fillRect(x, y, width, height);

            // 枠線を描画
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, width, height);

            // ラベル表示（オプション）
            ctx.font = '16px sans-serif';
            ctx.fillStyle = 'red';
            ctx.fillText(`${prediction.class} ${(prediction.score * 100).toFixed(1)}%`, x, y > 20 ? y - 5 : y + 20);
          }
        });
      }
      requestAnimationFrame(detectFrame);
    }

    // 初期化処理
    async function init() {
      await setupCamera();
      await loadModel();
      detectFrame();  // 検出ループ開始
    }

    init();
  </script>
</body>
</html>
