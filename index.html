<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>P2P デモ：ユーザー側カメラ選択</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #controls { margin: 1em; }
    #status { color: red; white-space: pre-wrap; text-align: left; }
    video { width:45%; margin:0 2%; background:#000 }
    select, button { margin-top: 0.5em; }
  </style>
</head>
<body>
  <h1>P2P デモ：カメラ選択</h1>
  <div id="controls">
    <label>
      <input type="radio" name="role" value="compute"> 計算
    </label>
    <label>
      <input type="radio" name="role" value="user"> ユーザー
    </label>
    <br>
    <div id="userCameraContainer" style="display:none;">
      <p>使用するカメラを選択：</p>
      <select id="camSelect"></select>
    </div>
    <p>
      部屋番号：<input type="text" id="roomCode" placeholder="1234">
    </p>
    <button id="startBtn">開始</button>
    <button id="callBtn">接続</button>
  </div>
  <div id="status">[INFO] Ready</div>
  <p>あなたの PeerID: <span id="myId">—</span></p>
  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <script>
    const log       = msg => {
      console.log(msg);
      document.getElementById('status').textContent += '\n'+msg;
    };
    const status    = document.getElementById('status');
    const roleRadios= document.getElementsByName('role');
    const camCont   = document.getElementById('userCameraContainer');
    const camSelect = document.getElementById('camSelect');
    const startBtn  = document.getElementById('startBtn');
    const callBtn   = document.getElementById('callBtn');
    const roomIn    = document.getElementById('roomCode');
    const myIdSpan  = document.getElementById('myId');
    const localV    = document.getElementById('localVideo');
    const remoteV   = document.getElementById('remoteVideo');

    let role, peer, localStream, roomCode;

    // 役割選択時のUI切り替え
    for (const r of roleRadios) {
      r.addEventListener('change', async () => {
        role = document.querySelector('input[name=role]:checked').value;
        status.textContent = `[INFO] 役割: ${role}`;
        if (role === 'user') {
          // ユーザー側：カメラ選択UIを表示 & カメラリスト取得
          camCont.style.display = 'block';
          callBtn.style.display = 'inline';
          // カメラ一覧を取得してドロップダウンに追加
          const devices = await navigator.mediaDevices.enumerateDevices();
          const cams = devices.filter(d => d.kind === 'videoinput');
          camSelect.innerHTML = '';
          cams.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.text  = d.label || d.deviceId;
            camSelect.appendChild(opt);
          });
        } else {
          // 計算側：カメラUIを隠し、接続ボタンも不要
          camCont.style.display = 'none';
          callBtn.style.display = 'none';
        }
      });
    }

    startBtn.onclick = async () => {
      status.textContent = '[INFO] Starting…';
      roomCode = roomIn.value.trim();
      if (!role)       return status.textContent='[ERROR] 先に役割を選択';
      if (!roomCode)   return status.textContent='[ERROR] 部屋番号を入力';

      // PeerJS 初期化
      peer = new Peer(`${role}-${roomCode}`, {
        host:'0.peerjs.com', secure:true, port:443,
        config:{ iceServers:[{urls:'stun:stun.l.google.com:19302'}] }
      });
      peer.on('open', id => {
        myIdSpan.textContent = id;
        log(`[INFO] Peer opened: ${id}`);
      });
      peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

      if (role === 'user') {
        // ユーザー側：選択カメラで getUserMedia
        const deviceId = camSelect.value;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video:{ deviceId }, audio:false
          });
          localV.srcObject = localStream;
          log('[INFO] Local camera stream ready');
        } catch(e) {
          return log(`[ERROR] カメラ取得失敗: ${e}`);
        }
        // 計算側からの呼び出しを answer
        peer.on('call', call => {
          log('[INFO] Incoming call, answering with local video');
          call.answer(localStream);
          call.on('stream', s => {
            remoteV.srcObject = s;
            log('[INFO] Received remote stream');
          });
        });
      } else {
        // 計算側：仮想カメラで応答（既存ロジック）
        callBtn.style.display = 'none';
        peer.on('call', async call => {
          // ... 以前の仮想カメラ取得＆answer(localStream) 処理 ...
          // 例:
          const cams = await navigator.mediaDevices.enumerateDevices();
          const vc = cams.find(d=>/VirtualCam/.test(d.label));
          localStream = await navigator.mediaDevices.getUserMedia({
            video:{ deviceId: vc.deviceId }
          });
          call.answer(localStream);
          call.on('stream', s => remoteV.srcObject = s);
          log('[INFO] Computation side answered with VC');
        });
      }
    };

    callBtn.onclick = () => {
      status.textContent = '[INFO] Connecting…';
      if (!peer || !roomCode) return log('[ERROR] 先に開始');
      const target = role==='user' ? `compute-${roomCode}` : `user-${roomCode}`;
      log(`[INFO] Calling ${target}`);
      try {
        const call = peer.call(target, localStream);
        call.on('stream', s => {
          remoteV.srcObject = s;
          log('[INFO] Received remote stream');
        });
      } catch(e) {
        log(`[ERROR] peer.call failed: ${e}`);
      }
    };
  </script>
</body>
</html>
