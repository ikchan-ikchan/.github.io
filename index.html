<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>P2P Lossless Video via DataChannel</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    video, img {
      width: 480px;
      height: auto;
      border: 1px solid #ccc;
      margin: 5px;
    }
  </style>
</head>
<body>
  <h2>ローカル映像 (カメラ映像)</h2>
  <video id="localVideo" autoplay muted playsinline></video>
  <h2>リモート映像 (PNG 連続表示)</h2>
  <img id="remoteImage" src="" alt="Remote frame">
  <script>
    // — PeerJS オブジェクト生成 — 
    const peer = new Peer();  // オプションで Peer ID を指定可
    peer.on('open', myId => {
      console.log('My peer ID:', myId);
      // 相手の Peer ID を自分で入力 or URL パラメータから取得するなどして…
      const remoteId = prompt('相手の Peer ID を入力してください');
      connectTo(remoteId);
    });

    let conn;     // DataChannel 用接続
    let sendLoop; // フレーム送信用インターバル識別子

    // — カメラ映像取得 & 接続後の処理 — 
    async function connectTo(remoteId) {
      // カメラ映像を取得
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      const localVideo = document.getElementById('localVideo');
      localVideo.srcObject = stream;

      // DataChannel 接続を開始
      conn = peer.connect(remoteId, { reliable: true });
      conn.on('open', () => {
        console.log('DataChannel open');
        startSendingFrames(localVideo);
      });

      // 相手から送られてくるバイナリデータ (PNG) を受信して表示
      conn.on('data', data => {
        // ArrayBuffer → Blob → URL にして img 要素にセット
        const blob = new Blob([data], { type: 'image/png' });
        document.getElementById('remoteImage').src = URL.createObjectURL(blob);
      });
    }

    // — canvas に描画して PNG で送信 — 
    function startSendingFrames(videoEl) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      // カメラ映像の解像度に合わせる
      const trackSettings = videoEl.srcObject.getVideoTracks()[0].getSettings();
      canvas.width = trackSettings.width || 640;
      canvas.height = trackSettings.height || 480;

      const FPS = 2; // 1秒あたりの送信フレーム数（必要に応じて調整）
      sendLoop = setInterval(() => {
        ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => {
          if (!blob || conn.open === false) return;
          blob.arrayBuffer().then(buffer => conn.send(buffer));
        }, 'image/png');
      }, 1000 / FPS);
    }

    // — 相手からコネクション来た場合のハンドリング — 
    peer.on('connection', incoming => {
      // 双方向で送受信したい場合はここで同様に startSendingFrames を呼び出しても OK
      incoming.on('data', data => {
        const blob = new Blob([data], { type: 'image/png' });
        document.getElementById('remoteImage').src = URL.createObjectURL(blob);
      });
    });

    // ページ閉じるときにクリーンアップ
    window.addEventListener('beforeunload', () => {
      if (sendLoop) clearInterval(sendLoop);
      if (conn) conn.close();
      peer.destroy();
    });
  </script>
</body>
</html>
