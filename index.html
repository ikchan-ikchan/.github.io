<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>骨格推定 P2P - ユーザー側デバッグ版</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    video { width: 45%; margin: 0 2%; background: #000; }
    #controls { margin: 1em; }
    #status { white-space: pre-wrap; text-align: left; margin: 1em auto; width: 60%; color: #333; background: #f0f0f0; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>骨格推定 P2P - ユーザー側</h1>
  <div id="controls">
    <label><input type="radio" name="role" value="user"> ユーザー</label><br>
    部屋番号：<input type="text" id="roomCode" placeholder="1234">
    <button id="startBtn">開始</button>
    <button id="callBtn">接続</button>
  </div>
  <div id="status">[INFO] Ready</div>
  <p>あなたの PeerID: <span id="myId">—</span></p>
  <div>
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>
  </div>

  <script>
    const logArea = document.getElementById('status');
    function log(msg) {
      console.log(msg);
      logArea.textContent += '\n' + msg;
    }

    const startBtn = document.getElementById('startBtn');
    const callBtn  = document.getElementById('callBtn');
    const roomIn   = document.getElementById('roomCode');
    const myIdSpan = document.getElementById('myId');
    const localV   = document.getElementById('localVideo');
    const remoteV  = document.getElementById('remoteVideo');

    let peer, localStream, roomCode;

    startBtn.onclick = async () => {
      logArea.textContent = '[INFO] Starting…';
      // 役割は固定で「user」
      roomCode = roomIn.value.trim();
      if (!roomCode) {
        log('[ERROR] 部屋番号を入力してください');
        return;
      }
      // PeerJS インスタンス
      peer = new Peer(`user-${roomCode}`, {
        host: '0.peerjs.com', secure: true, port: 443,
        config: { iceServers:[{ urls:'stun:stun.l.google.com:19302'}] }
      });
      peer.on('open', id => {
        myIdSpan.textContent = id;
        log(`[INFO] Peer open: ${id}`);
      });
      peer.on('error', err => log(`[ERROR] PeerJS: ${err}`));

      // カメラ取得
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        localV.srcObject = localStream;
        log('[INFO] Local video stream obtained');
      } catch(e) {
        log(`[ERROR] getUserMedia failed: ${e}`);
        return;
      }

      // 相手から着信されたら、自動で answer & 映像表示
      peer.on('call', call => {
        log('[INFO] Incoming call, answering with local camera…');
        call.answer(localStream);
        call.on('stream', stream => {
          log('[INFO] Received remote stream');
          remoteV.srcObject = stream;
        });
        call.on('error', err => log(`[ERROR] call error: ${err}`));
      });
    };

    callBtn.onclick = () => {
      if (!peer || !localStream) {
        log('[ERROR] まず開始してください');
        return;
      }
      const targetId = `compute-${roomCode}`;
      log(`[INFO] Calling ${targetId}…`);
      try {
        const call = peer.call(targetId, localStream);
        call.on('stream', stream => {
          log('[INFO] Received inverted stream from compute');
          remoteV.srcObject = stream;
        });
        call.on('error', err => log(`[ERROR] call error: ${err}`));
      } catch(e) {
        log(`[ERROR] peer.call failed: ${e}`);
      }
    };
  </script>
</body>
</html>
