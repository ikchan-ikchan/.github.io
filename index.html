# auto_compute_invert_js_capture.py
"""
自動「計算」クライアント（色反転版・JSキャプチャ）
  • Selenium＋JS で <video id="remoteVideo"> のフレームを off‐screen Canvas 経由で取得
  • 色反転 → pyvirtualcam で仮想カメラ出力
  • ROI（動画解像度）変更時は仮想カメラを再オープン
"""

import time, random, base64
import cv2
import numpy as np
import pyvirtualcam

from selenium import webdriver
from selenium.webdriver.chrome.service import Service
from selenium.webdriver.common.by import By
from selenium.webdriver.support.ui import WebDriverWait
from selenium.webdriver.support import expected_conditions as EC
from selenium.common.exceptions import NoAlertPresentException
from webdriver_manager.chrome import ChromeDriverManager

# ==== 設定部分をあなたの環境に合わせて書き換えてください ====
SITE_URL  = "https://YOUR_GITHUB_USERNAME.github.io/pose-p2p/"
CAP_FPS   = 20
ROOM_CODE = f"{random.randint(0,9999):04d}"
# ================================================================

def dismiss_alert(driver):
    try:
        a = driver.switch_to.alert
        a.accept()
    except NoAlertPresentException:
        pass

def open_virtualcam(w, h, fps):
    """OBS/UnityCapture を試して仮想カメラをオープン"""
    for backend in ('obs','unitycapture'):
        try:
            cam = pyvirtualcam.Camera(width=w, height=h, fps=fps,
                                     backend=backend, print_fps=False)
            print(f"[INFO] VirtualCam opened via {backend!r}: {cam.device}")
            return cam
        except Exception as e:
            print(f"[WARN] backend={backend} failed: {e}")
    raise RuntimeError("No virtual camera backend worked")

def main():
    # 1) Selenium + Chrome 起動
    service = Service(ChromeDriverManager().install())
    opts = webdriver.ChromeOptions()
    opts.add_argument("--use-fake-ui-for-media-stream")
    opts.add_argument("--disable-infobars")
    opts.add_argument("--start-maximized")
    driver = webdriver.Chrome(service=service, options=opts)

    try:
        # 2) P2Pページにアクセスして「計算」役で入室
        driver.get(SITE_URL)
        dismiss_alert(driver)
        wait = WebDriverWait(driver, 20)

        wait.until(EC.element_to_be_clickable(
            (By.CSS_SELECTOR, 'input[value="compute"]')
        )).click()
        inp = driver.find_element(By.ID, "roomCode")
        inp.clear(); inp.send_keys(ROOM_CODE)
        driver.find_element(By.ID, "startBtn").click()
        dismiss_alert(driver)
        print(f"[INFO] ROOM CODE = {ROOM_CODE}")
        print("[INFO] Waiting for user…")

        # 3) <video id="remoteVideo"> 要素を待つ
        wait.until(EC.presence_of_element_located((By.ID, "remoteVideo")))
        dismiss_alert(driver)
        print("[INFO] remoteVideo element ready")

        # 4) JSで動画解像度を取得
        def get_video_size():
            w = driver.execute_script(
                "let v=document.getElementById('remoteVideo');"
                "return v.videoWidth||v.clientWidth;"
            )
            h = driver.execute_script(
                "let v=document.getElementById('remoteVideo');"
                "return v.videoHeight||v.clientHeight;"
            )
            return int(w), int(h)

        width, height = get_video_size()
        print(f"[INFO] initial video size = {width}×{height}")

        # 5) 仮想カメラを開く
        cam = open_virtualcam(width, height, CAP_FPS)
        frame_count = 0

        # 6) メインループ：JSキャプチャ→反転→送信
        while True:
            # a) サイズ変化チェック
            new_w, new_h = get_video_size()
            if new_w!=width or new_h!=height:
                print(f"[INFO] video size changed: {width}×{height} → {new_w}×{new_h}")
                cam.close()
                cam = open_virtualcam(new_w, new_h, CAP_FPS)
                width, height = new_w, new_h
                continue

            # b) JSで off‐screen Canvas に現在フレームを描画 → DataURL を取得
            data_url = driver.execute_script(
                "const v=document.getElementById('remoteVideo');"
                "const c=document.createElement('canvas');"
                "c.width=v.videoWidth||v.clientWidth;"
                "c.height=v.videoHeight||v.clientHeight;"
                "c.getContext('2d').drawImage(v,0,0,c.width,c.height);"
                "return c.toDataURL('image/png');"
            )
            # c) DataURL → OpenCV 画像
            header, b64 = data_url.split(',',1)
            img = cv2.imdecode(
                np.frombuffer(base64.b64decode(b64), dtype=np.uint8),
                cv2.IMREAD_COLOR
            )
            # d) 色反転
            inverted = cv2.bitwise_not(img)

            # e) 仮想カメラ送信
            try:
                cam.send(inverted)
                cam.sleep_until_next_frame()
            except Exception as e:
                print(f"[ERROR] cam.send failed: {e}")
                cam.close()
                cam = open_virtualcam(width, height, CAP_FPS)
                continue

            # f) デバッグログ
            frame_count += 1
            if frame_count % CAP_FPS == 0:
                print(f"[DEBUG] Sent {frame_count} frames")

    except KeyboardInterrupt:
        print("\n[INFO] Interrupted by user, exiting…")
    finally:
        try: cam.close()
        except: pass
        driver.quit()
        print("[INFO] Chrome closed, script ended.")

if __name__ == "__main__":
    main()
