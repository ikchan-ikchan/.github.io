<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>動画ファイルから 2D 点描画デモ</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    #controls { margin: 10px; }
    #outputCanvas { border: 1px solid #ccc; }
    input[type="file"] { margin: 10px; }
  </style>
</head>
<body>
  <h2>動画ファイルから 2D 点描画デモ</h2>
  <div id="controls">
    <input type="file" id="videoFileInput" accept="video/*">
    <label for="fpsInput">FPS：</label>
    <input type="number" id="fpsInput" min="1" value="15" style="width:60px;">
    <button id="startButton">再生＆解析開始</button>
  </div>
  
  <!-- 動画は非表示 -->
  <video id="video" style="display:none;" playsinline muted></video>
  <!-- キーポイントを描くための Canvas -->
  <canvas id="outputCanvas" width="640" height="480"></canvas>
  
  <!-- MediaPipe Pose -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  
  <script>
    const fileInput = document.getElementById('videoFileInput');
    const startButton = document.getElementById('startButton');
    const fpsInput = document.getElementById('fpsInput');
    const video = document.getElementById('video');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    
    let pose;
    
    // MediaPipe Pose の初期化
    function initPose() {
      pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      pose.onResults(onResults);
    }
    
    // 解析結果を Canvas に点として描画
    function onResults(results) {
      // まずキャンバス全体をクリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      if (!results.poseLandmarks) return;
      // 各ランドマークを点で描画 (正規化座標 → Canvas 座標に変換)
      for (const lm of results.poseLandmarks) {
        const x = lm.x * canvas.width;
        const y = lm.y * canvas.height;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, 2 * Math.PI);
        ctx.fillStyle = 'red';
        ctx.fill();
      }
    }
    
    // 動画フレームを解析用に送るループ
    function startProcessing() {
      const fps = parseInt(fpsInput.value) || 15;
      const interval = 1000 / fps;
      async function tick() {
        if (!video.paused && !video.ended) {
          await pose.send({ image: video });
        }
        setTimeout(tick, interval);
      }
      tick();
    }
    
    // ファイル選択後の再生＆解析開始
    startButton.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('動画ファイルを選択してください');
        return;
      }
      // 動画要素にファイルをセット
      video.src = URL.createObjectURL(file);
      video.onloadedmetadata = () => {
        // Canvas を動画サイズに合わせる
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        video.play();
        initPose();
        startProcessing();
      };
    });
  </script>
</body>
</html>
